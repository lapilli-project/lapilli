apiVersion: v1
kind: Namespace
metadata: {name: monitoring}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: monitoring}
data:
  prometheus.yml: |
    global: {scrape_interval: 5s, evaluation_interval: 15s}
    scrape_configs:
      - job_name: thumb-api
        static_configs: [{targets: ["thumb-api.media.svc:8080"], labels: {namespace: media, service: thumb-api}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: monitoring}
spec: {selector: {app: prometheus}, ports: [{port: 9090, targetPort: 9090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: monitoring}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          # The version of the engine lapilli-case is built with (go.mod), so that a case frozen here
          # and replayed is evaluated by the engine that answered the Prometheus's own queries:
          # test/replay-diff compares the two, and selftest.py holds this to go.mod. It was v3.5.0
          # until 2026-10-08, when rounds 38 and 39 ran.
          image: prom/prometheus:v3.15.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-admin-api", "--storage.tsdb.min-block-duration=2h"]
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: cfg, mountPath: /etc/prometheus}, {name: data, mountPath: /prometheus}]
      volumes: [{name: cfg, configMap: {name: prometheus-config}}, {name: data, emptyDir: {}}]
