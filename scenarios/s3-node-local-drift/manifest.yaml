apiVersion: v1
kind: Namespace
metadata: {name: infra-agents}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: node-agent, namespace: infra-agents}
spec:
  selector: {matchLabels: {app: node-agent}}
  template:
    metadata: {labels: {app: node-agent}}
    spec:
      tolerations: [{operator: Exists}]
      containers:
        - name: agent
          image: python:3.12-alpine
          command: ["python", "-u", "/code/node_agent.py"]
          env: [{name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}]
          volumeMounts: [{name: code, mountPath: /code}, {name: tuning, mountPath: /host/etc/ledger-tuning, readOnly: true}]
      volumes: [{name: code, configMap: {name: node-agent-code}}, {name: tuning, hostPath: {path: /etc/ledger-tuning, type: DirectoryOrCreate}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger-api, namespace: ledger}
spec:
  replicas: 6
  selector: {matchLabels: {app: ledger-api}}
  template:
    metadata: {labels: {app: ledger-api}}
    spec:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, nodeTaintsPolicy: Honor, labelSelector: {matchLabels: {app: ledger-api}}}
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "-u", "/code/ledger_api.py"]
          env: [{name: APP_VERSION, value: "1.4.1"}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5, failureThreshold: 2}
          volumeMounts: [{name: code, mountPath: /code}, {name: tuning, mountPath: /etc/ledger-tuning, readOnly: true}]
      volumes: [{name: code, configMap: {name: ledger-code}}, {name: tuning, hostPath: {path: /etc/ledger-tuning, type: Directory}}]
