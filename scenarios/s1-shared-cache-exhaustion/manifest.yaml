apiVersion: v1
kind: ConfigMap
metadata: {name: report-worker-config, namespace: shop}
data: {CACHE_CONN_MODE: "per-task", TASK_INTERVAL_SECONDS: "2"}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: cache-ingress, namespace: shop}
spec:
  podSelector: {matchLabels: {app: cache}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {tier: backend}}}]
      ports: [{protocol: TCP, port: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: cache, namespace: shop}
spec: {selector: {app: cache}, ports: [{port: 6379, targetPort: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cache, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: cache}}
  template:
    metadata: {labels: {app: cache, tier: data}}
    spec:
      containers:
        - name: cache
          image: python:3.12-alpine
          command: ["python", "-u", "/code/cache_server.py"]
          env: [{name: MAX_ACTIVE, value: "40"}, {name: LOG_LEVEL, value: "info"}]
          ports: [{containerPort: 6379}]
          volumeMounts: [{name: code, mountPath: /code}]
      volumes: [{name: code, configMap: {name: shop-code}}]
