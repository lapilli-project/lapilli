# What CI's staticcheck job checks (.github/workflows/ci.yml).
# Left out, beside staticcheck's own defaults:
#   ST1005: an error here may begin with a name that is written with a
#           capital (a cloud's, a tool's, a button's, a field's), or end
#           with the key of a file and its colon.
#   ST1018: tests hand the parsers control and invisible characters as
#           they would arrive, written as themselves.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1005", "-ST1018"]
