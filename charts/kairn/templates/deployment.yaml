{{- /* The shutdown budgets in main.rs: RECONCILE_GRACE (12 s) + NOTIFY_DRAIN (10 s) = 22 s, plus
     slack for the process to exit. `values.schema.json` enforces the same floor and rejects a bad
     value before this runs; this is the backstop for `helm template --skip-schema-validation`, and
     a Rust test keeps both numbers tied to the constants they stand for. Refuse the render rather
     than ship an install whose grace period silently truncates a capture and the notification
     flush — lost evidence with nothing in the log is the one thing this project will not do
     quietly. */ -}}
{{- if lt (int .Values.terminationGracePeriodSeconds) 25 }}
{{- fail (printf "terminationGracePeriodSeconds is %v; Kairn needs at least 25 to finish the captures in flight (12s) and flush notifications (10s) on SIGTERM" .Values.terminationGracePeriodSeconds) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kairn.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kairn.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One writer on a ReadWriteOnce volume: never run old and new pods side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "kairn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kairn.selectorLabels" . | nindent 8 }}
      annotations:
        # Destinations are read at start: roll the pod when they change.
        kairn.dev/destinations-checksum: {{ toJson .Values.export.destinations | sha256sum | trunc 16 }}
        # A host change must roll the pod: the controller checks it per send, and a stale pod
        # would keep talking to the old endpoint.
        kairn.dev/notify-checksum: {{ toJson .Values.notify.routes | sha256sum | trunc 16 }}
        {{- if .Values.telemetry.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # On SIGTERM the controller finishes the captures in flight (12 s) and then flushes the
      # notification groups still coalescing (10 s) — a group is claimed before it is posted, so
      # abandoning one marks its captures notified and never announced. Set explicitly rather than
      # left to Kubernetes' 30 s default: lower it and the kubelet's SIGKILL lands mid-flush, taking
      # the capture and the notification with it and logging nothing.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "kairn.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532 # so the nonroot controller can write to a fresh PVC
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: controller # `kairn demo` execs into this container by name
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          env:
            - name: KAIRN_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: KAIRN_CLUSTER_ID
              value: {{ .Values.clusterId | quote }}
            - name: KAIRN_PROFILE
              value: {{ .Values.profile.name | quote }}
            # The namespaces this install was scoped to, so the permission self-check asks the
            # right questions: a cluster-wide question is refused by the Role generated in
            # namespaced mode, and a single-namespace question cannot tell a ClusterRole from a
            # Role. Empty means cluster-wide, matching the ClusterRole in rbac.yaml.
            - name: KAIRN_WATCH_NAMESPACES
              value: {{ join "," .Values.watchNamespaces | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: KAIRN_DESTINATIONS_FILE
              value: /etc/kairn/destinations.json
            {{- if .Values.webhook.auth.enabled }}
            - name: KAIRN_WEBHOOK_TOKEN_FILE
              value: /etc/kairn/webhook/token
            {{- end }}
            {{- if .Values.notify.routes }}
            # The retrieval command a notification prints names this Deployment, and the name
            # varies with the release.
            - name: KAIRN_DEPLOYMENT
              value: {{ include "kairn.fullname" . }}
            - name: KAIRN_NOTIFY_ROUTES_FILE
              value: /etc/kairn/notify/routes.json
            - name: KAIRN_NOTIFY_SECRETS_DIR
              value: /etc/kairn/notify/secrets
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            {{- if eq .Values.signing.mode "kms" }}
            - name: KAIRN_SIGNING_KMS_KEY
              value: {{ required "signing.kms.key is required when signing.mode=kms" .Values.signing.kms.key | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: webhook
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: bundles
              mountPath: {{ include "kairn.bundlePath" . }}
            - name: tmp
              mountPath: /tmp # scratch for `kairn verify` unpacking (read-only rootfs)
            - name: destinations
              mountPath: /etc/kairn/destinations.json
              subPath: destinations.json
              readOnly: true
            {{- if .Values.notify.routes }}
            - name: notify-routes
              mountPath: /etc/kairn/notify/routes.json
              subPath: routes.json
              readOnly: true
            {{- range .Values.notify.routes }}
            - name: notify-path-{{ .name }}
              mountPath: /etc/kairn/notify/secrets/{{ .name }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.webhook.auth.enabled }}
            - name: webhook-token
              mountPath: /etc/kairn/webhook
              readOnly: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: bundles
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-bundles" (include "kairn.fullname" .)) }}
          {{- else }}
          emptyDir: {} # bundles are lost when the pod goes away — for throwaway clusters only
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: destinations
          configMap:
            name: {{ include "kairn.fullname" . }}-destinations
        {{- if .Values.notify.routes }}
        - name: notify-routes
          configMap:
            name: {{ include "kairn.fullname" . }}-notify
        {{- range .Values.notify.routes }}
        - name: notify-path-{{ .name }}
          secret:
            secretName: {{ .pathSecret }}
            # Only the path key: a Secret in this namespace can hold other things.
            items: [{ key: path, path: path }]
            # A missing or mistyped Secret must not stop the pod starting: with one replica
            # and `Recreate`, that would leave the cluster with no evidence recorder at all.
            # The route is disabled instead, loudly, and capture is unaffected.
            optional: true
        {{- end }}
        {{- end }}
        {{- if .Values.webhook.auth.enabled }}
        - name: webhook-token
          secret:
            secretName: {{ include "kairn.webhookTokenSecret" . }}
            items: [{ key: token, path: token }]
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
