{{- $fullname := include "kairn.fullname" . -}}
{{- $collectorRules := list
  (dict "apiGroups" (list "") "resources" (list "pods" "pods/log" "events") "verbs" (list "get" "list" "watch"))
  (dict "apiGroups" (list "apps") "resources" (list "replicasets" "deployments") "verbs" (list "get" "list" "watch")) -}}
# Read-only access to exactly what the collectors read — explicit resources, never "*",
# and no Secrets (DESIGN §7).
{{- if empty .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-collector
  labels: {{- include "kairn.labels" . | nindent 4 }}
rules: {{- toYaml $collectorRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-collector
  labels: {{- include "kairn.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-collector
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-collector
  namespace: {{ . }}
  labels: {{- include "kairn.labels" $ | nindent 4 }}
rules: {{- toYaml $collectorRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-collector
  namespace: {{ . }}
  labels: {{- include "kairn.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-collector
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
---
# Control: the CRs Kairn owns, in its own namespace. Secret access only for the signing key.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kairn.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kairn.dev"]
    resources: ["incidentcaptures", "incidentcaptures/status", "captureprofiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  {{- if eq .Values.signing.mode "static" }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ required "signing.keySecret is required when signing.mode=static" .Values.signing.keySecret | quote }}]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kairn.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ .Release.Namespace }}
