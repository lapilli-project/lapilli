# cronjob runs lapilli verdict once a week, at schedule, and reports. serve
# runs lapilli serve, which keeps judging: every hour, into a ledger on a
# volume, with a web UI, an API and /metrics (see serve below).
mode: cronjob

# When to run, in cron form, and in which time zone: Mondays at 09:00 by
# default, judging the week before. In serve mode, timeZone is the zone
# days and weeks are counted in.
schedule: "0 9 * * 1"
timeZone: Etc/UTC
since: 7d

# Where the history is.
prometheus:
  # A Prometheus-compatible API: Prometheus, Thanos, Mimir, VictoriaMetrics,
  # or a cloud's managed Prometheus. Oracle Cloud has none: on OKE, give the
  # Prometheus you run there, with no auth.
  url: ""
  # For a cloud's managed Prometheus, the cloud whose credentials to send,
  # taken from the pod's workload identity:
  #   aws     Amazon Managed Service for Prometheus: url is the workspace's
  #           query URL. Give the service account an IAM role allowed
  #           aps:QueryMetrics, through IRSA (serviceAccount.annotations
  #           eks.amazonaws.com/role-arn) or EKS Pod Identity.
  #   azure   Azure Monitor managed service for Prometheus: url is the
  #           workspace's query endpoint. Use Azure Workload Identity:
  #           podLabels azure.workload.identity/use: "true", the service
  #           account annotation azure.workload.identity/client-id, and the
  #           Monitoring Data Reader role on the workspace.
  #   google  Google Cloud Managed Service for Prometheus: url is
  #           https://monitoring.googleapis.com/v1/projects/PROJECT/location/global/prometheus.
  #           Use GKE Workload Identity, with roles/monitoring.viewer.
  auth: ""
  # The region to sign for with aws, when the URL doesn't say.
  awsRegion: ""
  # A Secret holding a bearer token, for an API that takes one.
  tokenSecret:
    name: ""
    key: token
# The same as prometheus.url for Google Cloud Managed Service for Prometheus
# in this project, with auth google.
gcpProject: ""

# The alert rules to replay, from one of four places.
rules:
  # ConfigMaps in this namespace holding alert rules: Prometheus rule files,
  # PrometheusRule resources, Grafana alerting provisioning files, a cloud's
  # rule groups. Each is mounted and every key with rules in it is read.
  configMaps: []
  # Or the alert rules the API at prometheus.url has loaded
  # (GET /api/v1/rules): Prometheus, Thanos, Mimir, vmalert, Amazon Managed
  # Service for Prometheus.
  loaded: false
  # Or the alert rules a Grafana holds, read through its provisioning API
  # with a service account token kept in a Secret.
  grafana:
    url: ""
    tokenSecret:
      name: ""
      key: token
  # Or the alert rules a managed Prometheus ruler holds, as written, read
  # through the API that writes them (docs/design/rulers.md):
  #   Mimir     http://mimir:8080/prometheus/config/v1/rules
  #   Cortex    http://cortex:9009/api/v1/rules
  #   Amazon    https://aps.REGION.amazonaws.com/workspaces/WORKSPACE_ID,
  #             with prometheus.auth aws and aps:ListRuleGroupsNamespaces
  #             and aps:DescribeRuleGroupsNamespace
  #   Azure     https://management.azure.com/subscriptions/SUB, or
  #             .../resourceGroups/RG, with prometheus.auth azure and a role
  #             that reads Microsoft.AlertsManagement/prometheusRuleGroups
  # tenant is a Mimir's or a Cortex's with tenants and no gateway to set
  # it, sent as X-Scope-OrgID to url and prometheus.url alike; tokenSecret a
  # token that may read their rules (rules:read).
  ruler:
    url: ""
    tenant: ""
    tokenSecret:
      name: ""
      key: token
  # A cloud's own alarms, read through its API beside any of the above, or
  # alone (docs/design/alarms.md): each a source, the name its history is
  # copied in under (lowercase letters, digits and dashes), and the URL its
  # host says the cloud of, read with that cloud's credentials, whatever
  # prometheus.auth says:
  #   CloudWatch  https://monitoring.REGION.amazonaws.com
  #   Azure       https://management.azure.com/subscriptions/SUB, or
  #               .../resourceGroups/RG
  #   Google      https://monitoring.googleapis.com/v3/projects/PROJECT/alertPolicies
  #   OCI         https://telemetry.REGION.oraclecloud.com/20180401/alarms?compartmentId=OCID
  # PromQL alarms are replayed, the others judged by their history, tied to
  # them. The README has the read permissions each needs.
  alarms: []
  # - source: cloudwatch-prod
  #   url: https://monitoring.eu-west-1.amazonaws.com
  # How often serve reads them, so the clouds' request quotas hold: 10m
  # when empty.
  alarmsEvery: ""

# What went wrong. Incidents written down, as in an incidents file:
#   - {id: INC-41, title: Checkout errors, start: "2026-10-28T12:01:00+09:00", labels: {service: checkout}}
incidents: []
# An expression that returns something while users are hurt; its windows
# become incidents too.
impact: ""
# Labels a firing and an incident must agree on, such as [service].
match: []
# When people are at work, and asleep, in timeZone: the firings that caught
# nothing are counted by when they came, those that woke people first. Like
# mon-fri@08:00-18:00 and 22:00-08:00, which is what empty means; or none.
# shifts, for hours that take turns instead, as --shifts takes them, like
# "every=1w from=2026-11-02T09:00; tz=Asia/Seoul; tz=Europe/Berlin".
hours:
  work: ""
  sleep: ""
  shifts: ""

# Where the report goes, besides the job's log.
report:
  # A Pushgateway URL, for graphing the stones week by week. The metrics go
  # in the group job=lapilli, instance=<namespace>-<release>. In serve mode
  # Prometheus scrapes /metrics instead.
  pushgateway: ""
  # A Secret holding a Slack incoming webhook's URL. In serve mode, the
  # weekly digest goes there.
  slackWebhookSecret:
    name: ""
    key: url
  timeZone: ""   # times in the report; the schedule's time zone when empty

# More flags, such as [--lead, 10m]. A Loki ruler's rules go here too,
# beside the rules above or alone: [--loki, http://loki:3100,
# --loki-loaded-rules], with --loki-tenant for a Loki with tenants. A token
# file or rule files to mount need values of their own, still to do.
extraArgs: []

# lapilli serve, with mode: serve. In serve mode incidents and impact may
# both be left out: incidents can be written down in the UI. rules takes one
# ConfigMap, read again every minute: each change is a new version.
serve:
  every: 1h      # run this often
  settle: 1h     # and replay this much before the last run's end again
  backfill: 28d  # on first start, replay this far back
  keep: 400d     # drop firings older than this
  digest: mon@09:00  # the weekly digest, in timeZone, until an admin sets it in the UI
  # The replay set beside what really fired (ALERTS, GRAFANA_ALERTS), a day
  # at a time once the runs won't replay it again; a rule whose replay
  # differs says so (docs/design/fidelity.md).
  checkReplay:
    enabled: true
    series: []        # the series that say what really fired, if not those
    differs: ""       # N/RATIO, 5/0.9 unless given
  # What each rule says when it fires, checked: no runbook, a template
  # that doesn't parse, a label no firing had, and the rest
  # (docs/design/content.md).
  checkContent:
    enabled: true
    severities: []      # the severities the team uses; any other is a problem
    scrapeInterval: ""  # for the range check; Prometheus's own, each job's, unless given
  # Earlier versions of the rules in rules.configMaps, read from the git
  # repository they are kept in, so a first start's backfill replays each
  # day with that day's rules (docs/design/history.md). An init container
  # clones the branch and runs recipes/versions/git.sh on each start; a
  # ledger with versions of its own passes them over. Off when repository
  # is empty.
  rulesHistory:
    repository: ""   # what git clone takes, such as https://github.com/example/monitoring.git
    branch: ""       # the default branch when empty
    paths: ""        # the rule files or directories in it, space-separated, such as alerts/
    since: ""        # from when, such as 2026-10-01; backfill and a day before now when empty
    # For rules rendered from a chart: a command run in each commit's files
    # that writes the rules on its stdout, such as
    # helm template monitoring charts/monitoring (the image needs helm then).
    render: ""
    # A Secret holding a token for an https repository that needs one, read
    # as the password of x-access-token.
    tokenSecret:
      name: ""
      key: token
    # An image with git and sh, pinned by digest.
    image: alpine/git:v2.52.0@sha256:4a0e72d49596a1f5d3701aeedafdadc5c0da4062be4657c7bdc4017387f591cc
  # Who people are. By default no one signs in, and the Service is a
  # ClusterIP: reach it with kubectl port-forward. To serve it at a URL
  # people open (service, ingress or httpRoute below), sign them in, one
  # way of three: signIn.oidc, lapilli's own sign-in, as Grafana and Argo
  # CD have; signIn.proxyJWT, the signed header of a sign-in in front (a
  # cloud's identity-aware proxy, a load balancer's sign-in, oauth2-proxy);
  # or userHeader, the plain header a proxy that signs people in (and
  # strips it from callers) puts the person in, such as X-Forwarded-Email.
  # Changes are recorded under the name it gives.
  userHeader: ""
  # lapilli's own sign-in (docs/design/signin.md). With it, every page and
  # API call but the health checks needs someone signed in, and only those
  # roles name come in (roles.viewers, editors, admins): an identity
  # provider signs in whoever it knows, which for a public one (Google's
  # for any account, GitLab.com, GitHub through Dex, a multi-tenant Entra
  # ID app) is anyone.
  signIn:
    # OpenID Connect: any provider (Google, Microsoft Entra ID, Okta,
    # Keycloak, Dex, AWS Cognito, OCI IAM identity domains, GitLab...).
    # Register lapilli as a client whose redirect URI is externalURL's
    # /auth/callback (externalURL is worked out from ingress or httpRoute
    # when not given). An API client or an agent sends an ID token the
    # provider gave this client as a bearer token.
    oidc:
      issuer: ""      # https://accounts.google.com, https://login.microsoftonline.com/TENANT/v2.0, ...
      clientId: ""
      # A Secret holding the client's secret; none for a public client.
      clientSecret:
        name: ""
        key: client-secret
      scopes: []      # email and profile when empty, openid always; add groups where the provider asks for it
      hostedDomains: []    # Google Workspace domains people must come from (the hd claim)
      trustedClients: []   # the provider's other clients whose ID tokens are taken as this one's
      bearer: true         # take ID tokens as bearer tokens (API clients, agents)
    # The signed header of a sign-in in front: google-iap (Google Cloud's
    # Identity-Aware Proxy: audience is the backend service's,
    # /projects/NUMBER/global/backendServices/ID), aws-alb (an Application
    # Load Balancer's sign-in: albArn is the load balancer's), or jwks (any
    # other: header, jwks, issuer and audience).
    proxyJWT:
      kind: ""
      audience: ""
      albArn: ""
      issuer: ""
      jwks: ""
      header: ""
    # The claims naming the person and listing their groups, for roles.
    # With oidc, email needs email_verified; take preferred_username or sub
    # where the provider doesn't send it (Entra ID). Empty groupsClaim for
    # none.
    userClaim: email
    groupsClaim: groups
    sessionMaxAge: ""  # 12h when empty
    # The key sessions are signed with, 32 characters or more: whoever
    # holds it can sign in as anyone. A Secret of your own (name), or one
    # the chart makes (FULLNAME-session-key, kept across upgrades and when
    # the release is uninstalled). A GitOps tool that renders the chart
    # without the cluster (Argo CD, Flux) would make a new key each render,
    # signing everyone out: give it a Secret of your own.
    sessionKeySecret:
      name: ""
      key: session-key
      create: true
  readOnly: false  # take no changes through the UI or API
  # Without roles (below), everyone may only look: lapilli serve listens on
  # the pod's address, which every pod in the cluster can reach. Changes
  # then need roles, behind a sign-in proxy (userHeader), or this, which
  # lets everyone who reaches the UI or the API change anything, as an
  # admin: for a cluster where only people who may already reach it with
  # kubectl port-forward can, with serve.networkPolicy keeping the rest out.
  everyoneAdmin: false
  # Who may change what, once the proxy names people: with editors or
  # admins, only those listed may change anything, and the rest may only
  # look. People as userHeader names them, groups as groupsHeader lists them,
  # or "*" for everyone signed in. Editors write incidents, tasks, comments,
  # quiet windows and notes on rules; admins also the settings and the teams.
  # With admins, admins can also give an editor's role in the UI, of every
  # team or of one, kept in the ledger; never an admin's or an approver's
  # (docs/design/serveops.md).
  roles:
    # Who may look, and with serve.signIn who may come in at all: people,
    # group:NAME, *@DOMAIN, or "*" for everyone the sign-in signs in.
    viewers: []
    editors: []
    admins: []
    groupsHeader: ""   # the header the proxy lists groups in, such as X-Forwarded-Groups
  # Telling of what happens: tasks made, assigned, done or overdue; incidents
  # written down; quiet windows kept; comments.
  notify:
    # A Secret holding a URL each is POSTed to, as JSON: a tracker's, a
    # chat's, or anything else that takes a webhook.
    webhookSecret:
      name: ""
      key: url
    slack: false  # also post each, as a line, to report.slackWebhookSecret
    lang: en      # the language of what is posted to Slack: en, es, ja or ko
  # A team's own weekly digest: its rules and the incidents it owns, posted to
  # a Slack-style incoming webhook. A Secret with a key for each team, and which
  # key is whose:
  #   teams: {Payments: payments-url}
  # With notify.webhookSecret, the webhook gets digest.ready too, for everyone
  # and for each team.
  teamDigests:
    secretName: ""
    teams: {}
  # Where the reports people schedule in the UI can go, by name: each a
  # Slack-style incoming webhook whose URL is in a Secret's key. A report picks
  # among these names, and slack (report.slackWebhookSecret), webhook
  # (notify.webhookSecret, as report.ready) and team:NAME (teamDigests.teams);
  # the UI never takes a URL. A name is lowercase letters, digits and . _ -:
  #   destinations:
  #     - {name: ops-daily, secretName: lapilli-report-ops, key: url}
  reports:
    destinations: []
  # A port that takes incidents, and does nothing else, from a job holding the
  # token in this Secret: one that copies them from where they are kept (see
  # recipes/incidents). Off when the Secret isn't named. With networkPolicy, who
  # may reach it goes in from, as NetworkPolicy peers: the job, and only to this
  # port, so it can't name itself anyone on the UI's.
  incidentsAPI:
    tokenSecret:
      name: ""
      key: token
    port: 8082
    from: []
  # Firings recorded elsewhere, such as a cloud's own alarm history, taken on
  # the incidentsAPI port from a job holding the token in this Secret, its
  # own: one that runs a script in recipes/firings and sends what it writes
  # with put.sh. Off when the Secret isn't named. With it, rules and
  # prometheus are optional: without them nothing is replayed, and what is
  # copied in is judged as it comes. incidentsAPI.from names who may reach
  # the port.
  firings:
    tokenSecret:
      name: ""
      key: token
    # Tell once, to notify.webhookSecret and, with notify.slack, Slack, of a
    # source nothing has been copied in from for this long: the job copying
    # it may have stopped. Empty is 26h; a weekly job wants 8d.
    quietAfter: ""
  # Tasks kept in step with issues in a tracker (see recipes/trackers): the
  # incidentsAPI port takes the tasks token in tokenSecret, its own, which
  # reads tasks and sets their link and status, and nothing else. With
  # tracker named, a CronJob runs that tracker's recipe every few minutes,
  # with the tracker's own token in trackerTokenSecret and its settings in
  # env, and the NetworkPolicy lets it reach that port alone. Off when the
  # Secret isn't named.
  trackers:
    tokenSecret:
      name: ""
      key: token
    tracker: ""   # github, gitlab, jira, linear, azure-boards or shortcut; no CronJob when empty
    schedule: "*/5 * * * *"
    # The recipe's settings, as recipes/trackers says, such as
    #   GITHUB_REPO: example/alerts
    #   JIRA_URL: https://example.atlassian.net, JIRA_EMAIL: ..., JIRA_PROJECT: OPS
    # The tokens' files and LAPILLI_URL are set by the chart.
    env: {}
    # A Secret holding the tracker's own token: GitHub's, GitLab's, Jira's
    # API token or Linear's API key.
    trackerTokenSecret:
      name: ""
      key: token
    closeIssues: false   # also close an issue whose task was done or dropped in Lapilli
    # Keep comments in step too, both ways, each once. It publishes what
    # people write on tasks to whoever can read the issue; who wrote it
    # only with COMMENT_NAMES: "true" in env (often their email).
    comments: false
    # An image with sh, curl and jq, pinned by digest (NAME@sha256:...):
    # required with tracker.
    image: ""
    resources: {}
  # On-call schedules read from the iCalendar feeds on-call tools export
  # (see the README's "Shifts from on-call schedules"): --on-call's file, the
  # key of a ConfigMap, and a Secret holding the feeds' URLs and tokens,
  # mounted at /var/run/lapilli/on-call/, which the file's url_file and
  # token_file name. A team's shifts then take on-call=NAME. Each feed is
  # read from the pod, so its host must be reachable from there.
  onCall:
    configMap:
      name: ""
      key: on-call.yaml
    secret: ""
  # A port that takes notifications as alert managers sent them, and nothing
  # else, each source on a path of its own (see the README's "Notifications
  # as they were sent"): with the token in tokenSecret (Alertmanager,
  # Grafana, Azure Monitor, Google Cloud, OCI Notifications), Grafana's HMAC
  # secret in grafanaSecret, or Amazon SNS's signature from the topics in
  # snsTopics, by ARN (CloudWatch alarms' too). Off unless one is given.
  # With networkPolicy, who may reach it goes in from, as NetworkPolicy
  # peers: the alert manager, and only to this port. Google Cloud's webhooks
  # and OCI Notifications reach public endpoints only.
  notificationsAPI:
    tokenSecret:
      name: ""
      key: token
    grafanaSecret:
      name: ""
      key: secret
    snsTopics: []
    port: 8083
    from: []
  # Where people reach the UI, such as https://lapilli.example.com; what is
  # told links to it, and signIn.oidc sends people back to. Worked out from
  # ingress's first host (https when its tls names it) or httpRoute's first
  # hostname when empty.
  externalURL: ""
  # Host names lapilli answers to besides addresses, localhost, names under
  # .svc, .cluster.local or .internal, and externalURL's: the name your
  # proxy or ingress passes on, if it is another. ingress's hosts and
  # httpRoute's hostnames are added. Others get 421, against DNS rebinding.
  allowedHosts: []
  # The UI outside the cluster on a Service of its own, FULLNAME-ui, a
  # LoadBalancer or a NodePort, the UI's port alone; FULLNAME stays a
  # ClusterIP with every port, as jobs and Prometheus reach it. The README
  # has each cloud's load balancer annotations. A load balancer of TCP
  # (GKE's and AKS's) doesn't end TLS: with signIn.oidc, end it at an
  # Ingress or a Gateway, or at a load balancer that does (an AWS NLB's or
  # an OCI load balancer's TLS listener).
  service:
    type: ClusterIP   # ClusterIP (no FULLNAME-ui), LoadBalancer or NodePort
    port: 80          # FULLNAME-ui's port
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []   # the addresses let through the cloud's load balancer
    # Local keeps the clients' addresses, so loadBalancerSourceRanges and
    # the NetworkPolicy see them; Cluster when empty.
    externalTrafficPolicy: ""
    nodePort: null
    # userHeader trusts a plain header, which no proxy can set or strip in
    # front of a load balancer of TCP: refused with a LoadBalancer or a
    # NodePort, unless loadBalancerSourceRanges names the proxy's addresses
    # alone and this says so.
    sourceRangesAreTheProxy: false
  # An Ingress for the UI (networking.k8s.io/v1).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []         # such as lapilli.example.com
    path: /           # lapilli is served at the root of its host
    pathType: Prefix
    tls: []           # - {secretName: lapilli-tls, hosts: [lapilli.example.com]}
    # People reach it over https, for externalURL: TLS ended here (tls) or
    # at the load balancer in front (an ALB's certificate, a managed
    # certificate). false only for a host on this machine (NAME.localhost).
    https: true
  # A Gateway API HTTPRoute for the UI (gateway.networking.k8s.io/v1).
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs: []    # - {name: gateway, namespace: gateway-system, sectionName: https}
    hostnames: []
    https: true       # the Gateway's listener serves https, for externalURL
  # Serving the UI outside the cluster (a LoadBalancer or NodePort, an
  # Ingress or an HTTPRoute) with no sign-in lets anyone who reaches it
  # read the ledger: refused, unless this says that is meant.
  exposeWithoutSignIn: false
  # The readiness probe's path: /readyz is ready once the ledger has a run
  # recorded, at once after a restart, after the backfill's first day on a
  # first install; /healthz is ready at once. The liveness probe is
  # /healthz.
  readinessPath: /readyz
  # Agents reach /mcp and read what the pages show. Who an agent must act
  # for to replay a change to the rules it proposes: editors or admins. Off
  # when empty: it runs PromQL the agent writes, with lapilli's access to
  # Prometheus, and for a Loki's rules LogQL, with its access to Loki. It
  # needs roles.editors or roles.admins.
  mcpCompare: ""
  # Who an agent must act for to propose a change to a rule over MCP, kept
  # as an agent's for a person to approve: editors or admins. Off when
  # empty. An agent never approves or applies one.
  mcpPropose: ""
  # Changing rules, with a person's approval (docs/design/changes.md). Off
  # unless enabled: Lapilli reads, and proposes when people ask. Enabled,
  # a change an approver approved in the UI is checked again, then handed
  # to a recipe in recipes/changes that opens a pull request where the rule
  # is kept, holding the token in tokenSecret, on the incidentsAPI port
  # (incidentsAPI.from names who may reach it); or, for rules read from
  # Grafana, applied through its API with grafanaTokenSecret's token, a
  # service account that may write the rules Lapilli may change. Lapilli
  # also proposes, each week. It needs userHeader, roles.editors or
  # roles.admins (without roles, whoever may change anything is an
  # admin), and approvers or roles.admins: the admins approve, unless
  # approvers says who. To stop
  # changes at once, an admin pauses them in the UI, or anyone
  # who may make a ConfigMap in the namespace makes FULLNAME-changes-paused,
  # FULLNAME being the release's name followed by -lapilli, unless the
  # release's name has lapilli in it already: for a release named ops,
  #   kubectl create configmap ops-lapilli-changes-paused --from-literal=paused=1
  # and for one named lapilli, lapilli-changes-paused. helm install prints
  # the command. Deleting it resumes them, within a minute or so.
  changes:
    enabled: false
    # Who may approve, as roles lists people and groups; the admins when
    # empty. Approvals is 1 or 2. The sign-in proxy should let only people
    # in, by a browser's sign-in, on /proposals/: a client that isn't a
    # browser can post the approval form as whoever the proxy names it.
    approvers: []
    approvals: 1
    tokenSecret:
      name: ""
      key: token
    # A Grafana service account's token: an Editor's changes a for or what
    # a rule says; turning a rule off takes an Admin's, as Grafana keeps a
    # pause from an Editor.
    grafanaTokenSecret:
      name: ""
      key: token
    # For rules read from a ruler (rules.ruler): the namespaces, or Azure
    # rule groups as RG/NAME (NAME when rules.ruler.url names one resource
    # group), Lapilli may change rules in; NAME* for a prefix. For a cloud's
    # alarms (rules.alarms), SOURCE:NAME: CloudWatch's alarm name, Azure's
    # RG/NAME, Google's policy's display name, OCI's display name, such as
    # cloudwatch-prod:checkout-*. Nothing in a ruler or a cloud is changed
    # without it. Name none a tool keeps (mimirtool rules sync, Terraform,
    # CloudFormation, Config Connector, Alloy's mimir.rules.kubernetes): it
    # would undo the change, or fight it.
    in: []
    # Tags, KEY=VALUE or KEY=*, that mean another tool keeps an Amazon
    # namespace, an Azure rule group or a cloud's alarm; OCI's defined tags
    # as NAMESPACE.KEY=VALUE (CloudFormation's own, and Google's
    # managed-by-cnrm and goog-terraform-provisioned, are known).
    managed: []
    # One write credential a kind, mounted only with changes on: a token
    # that may write a Mimir's or a Cortex's rules (rules:write); a role the
    # pod's identity assumes to write Amazon's namespaces and CloudWatch's
    # alarms; the client ID of a user-assigned identity, federated with this
    # service account, to write Azure's rule groups and alert rules; a
    # service account the pod's identity impersonates to write Google's
    # alerting policies; a Secret holding an OCI config file and the API
    # key it names, for OCI's alarms, whose key_file must be
    # /etc/lapilli/oci/key.pem. Without one, a Mimir's or a Cortex's writes
    # are sent with no token (for a ruler reached only in the cluster), and
    # a cloud's with the pod's identity. The README has each cloud's least
    # privilege.
    rulerTokenSecret:
      name: ""
      key: token
    awsRole: ""         # rulers' and alarms'
    azureClientId: ""   # rulers' and alarms'
    googleServiceAccount: ""
    ociConfigSecret:
      name: ""
      configKey: config
      keyKey: key.pem
    # Deletions a day and changes an hour, at most: 5,20 when empty.
    limits: ""
  # The headers name people only if nothing but the proxy can reach the
  # pod: with userHeader, a NetworkPolicy that lets in only those in from
  # (the proxy), as NetworkPolicy peers, and Prometheus, in metricsFrom, to
  # the metrics port alone, e.g.
  #   from:
  #     - podSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy}}
  #   metricsFrom:
  #     - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  # Behind an ingress controller or a Gateway, from names its pods'
  # namespace; behind a LoadBalancer, the load balancer's addresses and
  # health checks as ipBlocks (with service.externalTrafficPolicy Local,
  # the clients' own). The README has each cloud's.
  # It needs a network plugin that enforces NetworkPolicies. userHeader is
  # refused without it, unless something else keeps the rest out (a service
  # mesh's policy) and othersKeptOut says so.
  networkPolicy:
    enabled: false
    from: []
    metricsFrom: []
    othersKeptOut: false
    # Where lapilli serve, and its rules history's init containers, may
    # connect, as NetworkPolicy egress rules (to, ports), beside the
    # cluster's DNS (dns): a NetworkPolicy of its own, off unless enabled.
    # Without it the pod reaches whatever the cluster lets it, a cloud's
    # metadata server (169.254.169.254) and the Kubernetes API among them.
    # With it, name each place it talks to: the Prometheus, the rules' API
    # (Grafana, a ruler), the rules history's repository, Slack and the
    # webhooks, and a cloud's APIs and its identity's token endpoint. A
    # cloud's workload identity may need its metadata server let through
    # (GKE's does: see Google's documentation on network policies with
    # Workload Identity), which every container in the pod can then reach.
    #   to:
    #     - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
    #       ports: [{port: 9090, protocol: TCP}]
    #     - to: [{ipBlock: {cidr: 0.0.0.0/0, except: [169.254.169.254/32, 10.0.0.0/8]}}]
    #       ports: [{port: 443, protocol: TCP}]
    egress:
      enabled: false
      dns: true
      to: []
  port: 8080
  # /metrics and the health checks, alone, for Prometheus and the probes.
  metricsPort: 9091
  ledger:
    # A PersistentVolumeClaim (kept when the release is uninstalled), or an
    # emptyDir when false: the ledger starts again with the pod.
    persistence: true
    size: 2Gi
    storageClass: ""   # the cluster's default when empty
    existingClaim: ""
  # A Prometheus Operator ServiceMonitor for /metrics.
  serviceMonitor:
    enabled: false
    interval: 1m
    labels: {}

# A ConfigMap holding a Grafana dashboard of lapilli's metrics (from serve's
# /metrics, or the CronJob's Pushgateway), labelled for Grafana's dashboard
# sidecar.
dashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"

image:
  repository: ghcr.io/lapilli-project/lapilli
  tag: ""        # the chart's appVersion when empty
  # The image's digest, sha256:...: the pod runs exactly that image. A
  # release's chart has its own image's, written by the release workflow,
  # the image it built and attested; give image.tag another version and
  # give that version's digest too, or empty this.
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

# A replay is cut off after this many minutes and reports what it finished;
# the job is stopped ten minutes after. In serve mode, a run that doesn't
# finish in time is retried over less at once.
timeoutMinutes: 50
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
