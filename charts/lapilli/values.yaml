# cronjob runs lapilli verdict once a week, at schedule, and reports. serve
# runs lapilli serve, which keeps judging: every hour, into a ledger on a
# volume, with a web UI, an API and /metrics (see serve below).
mode: cronjob

# When to run, in cron form, and in which time zone: Mondays at 09:00 by
# default, judging the week before. In serve mode, timeZone is the zone
# days and weeks are counted in.
schedule: "0 9 * * 1"
timeZone: Etc/UTC
since: 7d

# Where the history is.
prometheus:
  # A Prometheus-compatible API: Prometheus, Thanos, Mimir, VictoriaMetrics,
  # or a cloud's managed Prometheus. Oracle Cloud has none: on OKE, give the
  # Prometheus you run there, with no auth.
  url: ""
  # For a cloud's managed Prometheus, the cloud whose credentials to send,
  # taken from the pod's workload identity:
  #   aws     Amazon Managed Service for Prometheus: url is the workspace's
  #           query URL. Give the service account an IAM role allowed
  #           aps:QueryMetrics, through IRSA (serviceAccount.annotations
  #           eks.amazonaws.com/role-arn) or EKS Pod Identity.
  #   azure   Azure Monitor managed service for Prometheus: url is the
  #           workspace's query endpoint. Use Azure Workload Identity:
  #           podLabels azure.workload.identity/use: "true", the service
  #           account annotation azure.workload.identity/client-id, and the
  #           Monitoring Data Reader role on the workspace.
  #   google  Google Cloud Managed Service for Prometheus: url is
  #           https://monitoring.googleapis.com/v1/projects/PROJECT/location/global/prometheus.
  #           Use GKE Workload Identity, with roles/monitoring.viewer.
  auth: ""
  # The region to sign for with aws, when the URL doesn't say.
  awsRegion: ""
  # A Secret holding a bearer token, for an API that takes one.
  tokenSecret:
    name: ""
    key: token
# The same as prometheus.url for Google Cloud Managed Service for Prometheus
# in this project, with auth google.
gcpProject: ""

# The alert rules to replay, from one of three places.
rules:
  # ConfigMaps in this namespace holding alert rules: Prometheus rule files,
  # PrometheusRule resources, Grafana alerting provisioning files, a cloud's
  # rule groups. Each is mounted and every key with rules in it is read.
  configMaps: []
  # Or the alert rules the API at prometheus.url has loaded
  # (GET /api/v1/rules): Prometheus, Thanos, Mimir, vmalert, Amazon Managed
  # Service for Prometheus.
  loaded: false
  # Or the alert rules a Grafana holds, read through its provisioning API
  # with a service account token kept in a Secret.
  grafana:
    url: ""
    tokenSecret:
      name: ""
      key: token

# What went wrong. Incidents written down, as in an incidents file:
#   - {id: INC-41, title: Checkout errors, start: "2026-10-28T12:01:00+09:00", labels: {service: checkout}}
incidents: []
# An expression that returns something while users are hurt; its windows
# become incidents too.
impact: ""
# Labels a firing and an incident must agree on, such as [service].
match: []

# Where the report goes, besides the job's log.
report:
  # A Pushgateway URL, for graphing the stones week by week. The metrics go
  # in the group job=lapilli, instance=<namespace>-<release>. In serve mode
  # Prometheus scrapes /metrics instead.
  pushgateway: ""
  # A Secret holding a Slack incoming webhook's URL. In serve mode, the
  # weekly digest goes there.
  slackWebhookSecret:
    name: ""
    key: url
  timeZone: ""   # times in the report; the schedule's time zone when empty

# More flags, such as [--lead, 10m].
extraArgs: []

# lapilli serve, with mode: serve. In serve mode incidents and impact may
# both be left out: incidents can be written down in the UI. rules takes one
# ConfigMap, read again every minute: each change is a new version.
serve:
  every: 1h      # run this often
  settle: 1h     # and replay this much before the last run's end again
  backfill: 28d  # on first start, replay this far back
  keep: 400d     # drop firings older than this
  digest: mon@09:00  # the weekly digest, in timeZone
  # The UI has no sign-in of its own, and the Service is a ClusterIP: reach
  # it with kubectl port-forward, or put it behind a proxy that signs people
  # in (oauth2-proxy, an ingress's or a cloud's) and name the header that
  # proxy puts the person in, such as X-Forwarded-Email, so changes are
  # recorded under it. Set it only when the proxy strips it from callers.
  userHeader: ""
  readOnly: false  # take no changes through the UI or API
  port: 8080
  ledger:
    # A PersistentVolumeClaim (kept when the release is uninstalled), or an
    # emptyDir when false: the ledger starts again with the pod.
    persistence: true
    size: 2Gi
    storageClass: ""   # the cluster's default when empty
    existingClaim: ""
  # A Prometheus Operator ServiceMonitor for /metrics.
  serviceMonitor:
    enabled: false
    interval: 1m
    labels: {}

# A ConfigMap holding a Grafana dashboard of lapilli's metrics (from serve's
# /metrics, or the CronJob's Pushgateway), labelled for Grafana's dashboard
# sidecar.
dashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"

image:
  repository: ghcr.io/lapilli-project/lapilli
  tag: ""        # the chart's appVersion when empty
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

# A replay is cut off after this many minutes and reports what it finished;
# the job is stopped ten minutes after. In serve mode, a run that doesn't
# finish in time is retried over less at once.
timeoutMinutes: 50
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
