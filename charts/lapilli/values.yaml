# cronjob runs lapilli verdict once a week, at schedule, and reports. serve
# runs lapilli serve, which keeps judging: every hour, into a ledger on a
# volume, with a web UI, an API and /metrics (see serve below).
mode: cronjob

# When to run, in cron form, and in which time zone: Mondays at 09:00 by
# default, judging the week before. In serve mode, timeZone is the zone
# days and weeks are counted in.
schedule: "0 9 * * 1"
timeZone: Etc/UTC
since: 7d

# Where the history is.
prometheus:
  # A Prometheus-compatible API: Prometheus, Thanos, Mimir, VictoriaMetrics,
  # or a cloud's managed Prometheus. Oracle Cloud has none: on OKE, give the
  # Prometheus you run there, with no auth.
  url: ""
  # For a cloud's managed Prometheus, the cloud whose credentials to send,
  # taken from the pod's workload identity:
  #   aws     Amazon Managed Service for Prometheus: url is the workspace's
  #           query URL. Give the service account an IAM role allowed
  #           aps:QueryMetrics, through IRSA (serviceAccount.annotations
  #           eks.amazonaws.com/role-arn) or EKS Pod Identity.
  #   azure   Azure Monitor managed service for Prometheus: url is the
  #           workspace's query endpoint. Use Azure Workload Identity:
  #           podLabels azure.workload.identity/use: "true", the service
  #           account annotation azure.workload.identity/client-id, and the
  #           Monitoring Data Reader role on the workspace.
  #   google  Google Cloud Managed Service for Prometheus: url is
  #           https://monitoring.googleapis.com/v1/projects/PROJECT/location/global/prometheus.
  #           Use GKE Workload Identity, with roles/monitoring.viewer.
  auth: ""
  # The region to sign for with aws, when the URL doesn't say.
  awsRegion: ""
  # A Secret holding a bearer token, for an API that takes one.
  tokenSecret:
    name: ""
    key: token
# The same as prometheus.url for Google Cloud Managed Service for Prometheus
# in this project, with auth google.
gcpProject: ""

# The alert rules to replay, from one of three places.
rules:
  # ConfigMaps in this namespace holding alert rules: Prometheus rule files,
  # PrometheusRule resources, Grafana alerting provisioning files, a cloud's
  # rule groups. Each is mounted and every key with rules in it is read.
  configMaps: []
  # Or the alert rules the API at prometheus.url has loaded
  # (GET /api/v1/rules): Prometheus, Thanos, Mimir, vmalert, Amazon Managed
  # Service for Prometheus.
  loaded: false
  # Or the alert rules a Grafana holds, read through its provisioning API
  # with a service account token kept in a Secret.
  grafana:
    url: ""
    tokenSecret:
      name: ""
      key: token

# What went wrong. Incidents written down, as in an incidents file:
#   - {id: INC-41, title: Checkout errors, start: "2026-10-28T12:01:00+09:00", labels: {service: checkout}}
incidents: []
# An expression that returns something while users are hurt; its windows
# become incidents too.
impact: ""
# Labels a firing and an incident must agree on, such as [service].
match: []
# When people are at work, and asleep, in timeZone: the firings that caught
# nothing are counted by when they came, those that woke people first. Like
# mon-fri@08:00-18:00 and 22:00-08:00, which is what empty means; or none.
# shifts, for hours that take turns instead, as --shifts takes them, like
# "every=1w from=2026-11-02T09:00; tz=Asia/Seoul; tz=Europe/Berlin".
hours:
  work: ""
  sleep: ""
  shifts: ""

# Where the report goes, besides the job's log.
report:
  # A Pushgateway URL, for graphing the stones week by week. The metrics go
  # in the group job=lapilli, instance=<namespace>-<release>. In serve mode
  # Prometheus scrapes /metrics instead.
  pushgateway: ""
  # A Secret holding a Slack incoming webhook's URL. In serve mode, the
  # weekly digest goes there.
  slackWebhookSecret:
    name: ""
    key: url
  timeZone: ""   # times in the report; the schedule's time zone when empty

# More flags, such as [--lead, 10m].
extraArgs: []

# lapilli serve, with mode: serve. In serve mode incidents and impact may
# both be left out: incidents can be written down in the UI. rules takes one
# ConfigMap, read again every minute: each change is a new version.
serve:
  every: 1h      # run this often
  settle: 1h     # and replay this much before the last run's end again
  backfill: 28d  # on first start, replay this far back
  keep: 400d     # drop firings older than this
  digest: mon@09:00  # the weekly digest, in timeZone
  # The replay set beside what really fired (ALERTS, GRAFANA_ALERTS), a day
  # at a time once the runs won't replay it again; a rule whose replay
  # differs says so (docs/design/fidelity.md).
  checkReplay:
    enabled: true
    series: []        # the series that say what really fired, if not those
    differs: ""       # N/RATIO, 5/0.9 unless given
  # Earlier versions of the rules in rules.configMaps, read from the git
  # repository they are kept in, so a first start's backfill replays each
  # day with that day's rules (docs/design/history.md). An init container
  # clones the branch and runs recipes/versions/git.sh on each start; a
  # ledger with versions of its own passes them over. Off when repository
  # is empty.
  rulesHistory:
    repository: ""   # what git clone takes, such as https://github.com/example/monitoring.git
    branch: ""       # the default branch when empty
    paths: ""        # the rule files or directories in it, space-separated, such as alerts/
    since: ""        # from when, such as 2026-10-01; backfill and a day before now when empty
    # For rules rendered from a chart: a command run in each commit's files
    # that writes the rules on its stdout, such as
    # helm template monitoring charts/monitoring (the image needs helm then).
    render: ""
    # A Secret holding a token for an https repository that needs one, read
    # as the password of x-access-token.
    tokenSecret:
      name: ""
      key: token
    # An image with git and sh, pinned by digest.
    image: alpine/git:v2.52.0@sha256:4a0e72d49596a1f5d3701aeedafdadc5c0da4062be4657c7bdc4017387f591cc
  # The UI has no sign-in of its own, and the Service is a ClusterIP: reach
  # it with kubectl port-forward, or put it behind a proxy that signs people
  # in (oauth2-proxy, an ingress's or a cloud's) and name the header that
  # proxy puts the person in, such as X-Forwarded-Email, so changes are
  # recorded under it. Set it only when the proxy strips it from callers.
  userHeader: ""
  readOnly: false  # take no changes through the UI or API
  # Who may change what, once the proxy names people: with editors or
  # admins, only those listed may change anything, and the rest may only
  # look. People as userHeader names them, groups as groupsHeader lists them,
  # or "*" for everyone signed in. Editors write incidents, tasks, comments,
  # quiet windows and notes on rules; admins also the settings and the teams.
  roles:
    editors: []
    admins: []
    groupsHeader: ""   # the header the proxy lists groups in, such as X-Forwarded-Groups
  # Telling of what happens: tasks made, assigned, done or overdue; incidents
  # written down; quiet windows kept; comments.
  notify:
    # A Secret holding a URL each is POSTed to, as JSON: a tracker's, a
    # chat's, or anything else that takes a webhook.
    webhookSecret:
      name: ""
      key: url
    slack: false  # also post each, as a line, to report.slackWebhookSecret
    lang: en      # the language of what is posted to Slack: en or ko
  # A team's own weekly digest: its rules and the incidents it owns, posted to
  # a Slack-style incoming webhook. A Secret with a key for each team, and which
  # key is whose:
  #   teams: {Payments: payments-url}
  # With notify.webhookSecret, the webhook gets digest.ready too, for everyone
  # and for each team.
  teamDigests:
    secretName: ""
    teams: {}
  # A port that takes incidents, and does nothing else, from a job holding the
  # token in this Secret: one that copies them from where they are kept (see
  # recipes/incidents). Off when the Secret isn't named. With networkPolicy, who
  # may reach it goes in from, as NetworkPolicy peers: the job, and only to this
  # port, so it can't name itself anyone on the UI's.
  incidentsAPI:
    tokenSecret:
      name: ""
      key: token
    port: 8082
    from: []
  # Firings recorded elsewhere, such as a cloud's own alarm history, taken on
  # the incidentsAPI port from a job holding the token in this Secret, its
  # own: one that runs a script in recipes/firings and sends what it writes
  # with put.sh. Off when the Secret isn't named. With it, rules and
  # prometheus are optional: without them nothing is replayed, and what is
  # copied in is judged as it comes. incidentsAPI.from names who may reach
  # the port.
  firings:
    tokenSecret:
      name: ""
      key: token
    # Tell once, to notify.webhookSecret and, with notify.slack, Slack, of a
    # source nothing has been copied in from for this long: the job copying
    # it may have stopped. Empty is 26h; a weekly job wants 8d.
    quietAfter: ""
  # A port that takes notifications as alert managers sent them, and nothing
  # else, each source on a path of its own (see the README's "Notifications
  # as they were sent"): with the token in tokenSecret (Alertmanager,
  # Grafana, Azure Monitor, Google Cloud, OCI Notifications), Grafana's HMAC
  # secret in grafanaSecret, or Amazon SNS's signature from the topics in
  # snsTopics, by ARN (CloudWatch alarms' too). Off unless one is given.
  # With networkPolicy, who may reach it goes in from, as NetworkPolicy
  # peers: the alert manager, and only to this port. Google Cloud's webhooks
  # and OCI Notifications reach public endpoints only.
  notificationsAPI:
    tokenSecret:
      name: ""
      key: token
    grafanaSecret:
      name: ""
      key: secret
    snsTopics: []
    port: 8083
    from: []
  # Where people reach the UI, such as https://lapilli.example.com; what is
  # told links to it.
  externalURL: ""
  # Host names lapilli answers to besides addresses, localhost, names under
  # .svc, .cluster.local or .internal, and externalURL's: the name your
  # proxy or ingress passes on, if it is another. Others get 421, against
  # DNS rebinding.
  allowedHosts: []
  # Agents reach /mcp and read what the pages show. Who an agent must act
  # for to replay a change to the rules it proposes: editors or admins. Off
  # when empty: it runs PromQL the agent writes, with lapilli's access to
  # Prometheus. It needs roles.editors or roles.admins.
  mcpCompare: ""
  # The headers name people only if nothing but the proxy can reach the
  # pod: with userHeader, a NetworkPolicy that lets in only those in from
  # (the proxy), as NetworkPolicy peers, and Prometheus, in metricsFrom, to
  # the metrics port alone, e.g.
  #   from:
  #     - podSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy}}
  #   metricsFrom:
  #     - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  # It needs a network plugin that enforces NetworkPolicies. userHeader is
  # refused without it, unless something else keeps the rest out (a service
  # mesh's policy) and othersKeptOut says so.
  networkPolicy:
    enabled: false
    from: []
    metricsFrom: []
    othersKeptOut: false
  port: 8080
  # /metrics and the health checks, alone, for Prometheus and the probes.
  metricsPort: 9091
  ledger:
    # A PersistentVolumeClaim (kept when the release is uninstalled), or an
    # emptyDir when false: the ledger starts again with the pod.
    persistence: true
    size: 2Gi
    storageClass: ""   # the cluster's default when empty
    existingClaim: ""
  # A Prometheus Operator ServiceMonitor for /metrics.
  serviceMonitor:
    enabled: false
    interval: 1m
    labels: {}

# A ConfigMap holding a Grafana dashboard of lapilli's metrics (from serve's
# /metrics, or the CronJob's Pushgateway), labelled for Grafana's dashboard
# sidecar.
dashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"

image:
  repository: ghcr.io/lapilli-project/lapilli
  tag: ""        # the chart's appVersion when empty
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

# A replay is cut off after this many minutes and reports what it finished;
# the job is stopped ten minutes after. In serve mode, a run that doesn't
# finish in time is retried over less at once.
timeoutMinutes: 50
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
