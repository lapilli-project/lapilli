# Lapilli Helm values. Defaults are the "recorder-lite" posture from DESIGN §10: one command,
# bundles on a PVC, signing off, read-only collector RBAC.

image:
  repository: ghcr.io/lapilli-project/lapilli-controller
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Stable identifier recorded in every bundle and checked by `lapilli verify --cluster`.
# Set it to something meaningful per cluster (e.g. "prod-apne2").
clusterId: kubernetes

# Namespaces whose workloads Lapilli may read (pods, logs, events, ReplicaSets, Deployments).
# Empty = cluster-wide (ClusterRole). A list = one namespaced Role per entry, nothing else.
watchNamespaces: []

# The CaptureProfile the webhook attaches to every capture.
profile:
  create: true
  name: default
  preSeconds: 300
  postSeconds: 300
  collectors: [logs, resources, events, changes]
  # Collectors this profile deliberately does NOT run because you already keep that data
  # elsewhere: `logs` when a log shipper tails /var/log/pods, `events` when an event exporter
  # streams them, `metrics` when Prometheus is the store. Every bundle records the list
  # (coverage.deferred), `lapilli verify` prints it on the verdict line, and the postmortem
  # names it — so a bundle that intends only `resources` and `changes` can never read as a
  # full capture. Must not overlap `collectors`; the API server refuses the overlap. This is a
  # claim that the data exists somewhere else, not a way to turn a collector off quietly.
  deferred: []
  # Name a notify.routes entry to announce this profile's captures (see `notify` below).
  notifyRoute: ""

# Alertmanager webhook (POST :8080/webhook).
webhook:
  # Most captures ONE payload may create. 0 = unlimited.
  #
  # This bounds a storm at its source, and it exists because nothing else did. The body limit
  # admits roughly 990 realistic alerts in one payload; the largest storm measured end to end is
  # 50, and that already peaked at 146.8 MiB of the 256Mi limit against 124.0 MiB at 20 alerts.
  # Cost grows with the size of the storm and the growth was unbounded. A payload past the
  # measured envelope is not a free experiment: an OOM mid-storm loses the captures already in
  # flight as well as the ones refused.
  #
  # The default is the largest storm anyone has measured, not a computed ceiling. Raise it after
  # measuring your own cluster — `test/e2e/storm.sh N` is the harness that produced these numbers.
  # Alerts past the cap are counted in lapilli_alerts_dropped_total{reason="payload-cap"}, logged,
  # and reported in the webhook's response, so raising or keeping it is a visible decision rather
  # than a silent loss.
  maxCapturesPerPayload: 50
  auth:
    # Require `Authorization: Bearer <token>`. The chart generates a token (kept across
    # upgrades) unless existingSecret names one with key `token`. See NOTES for the
    # Alertmanager side. Turning this off lets anything that can reach the Service trigger
    # captures.
    enabled: true
    existingSecret: ""   # required with `helm template`-based GitOps (Argo CD); key `token`, ≥ 32 chars
  networkPolicy:
    # Restrict ingress to the webhook port to these peers (e.g. Alertmanager's namespace).
    enabled: false
    from: []
    #  - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
    #    podSelector: { matchLabels: { app.kubernetes.io/name: alertmanager } }

# Object-store export (docs/design-export.md): after sealing, copy each bundle to these
# destinations, never overwriting. Defined here, by the admin, only; CaptureProfiles can
# reference them by name and change nothing. The default profile uses all of them.
export:
  destinations: []
  #  - name: evidence
  #    url: s3://incident-evidence/prod-apne2   # or gs://bucket/prefix
  #    region: ap-northeast-2
  #    endpoint: ""          # S3-compatible endpoint (MinIO); empty = AWS
  #    allowHttp: false      # plaintext only for in-cluster test endpoints
  #    credentialsSecret: "" # Secret with access_key_id / secret_access_key; empty = ambient

# One grouped, one-screen summary per incident, posted where the team already looks
# (docs/design-notify.md). Off until you define a route. A CaptureProfile may only *name* a
# route (`spec.notify.route`), so editing a profile cannot redirect or widen someone else's.
#
# What a message carries: counts, termination reason and exit code, memory peak against the
# limit, whether the crashed container's last log survived, what the last rollout changed and
# when and by whom, how complete the evidence is, and the command that retrieves the bundle.
# `detail: content` adds the changed field and its (redacted) before/after values.
# The last log line is NEVER sent, in any mode: bundles deliberately do not redact logs.
notify:
  routes: []
  # …and set profile.notifyRoute to one of their names to announce the default profile's
  # captures. A profile with no route is not announced anywhere.
  #  - name: platform             # [a-z0-9-]; what a profile references
  #    host: hooks.slack.com      # host[:port], never a URL. A change here rolls the pod.
  #    pathSecret: lapilli-slack-hook  # Secret with `path: /services/T000/B000/xxxx`
  #    format: slack              # slack | json (lapilli.dev/notification/v1)
  #    detail: facts              # facts (default) | content
  #    maxPerWindow: 10           # messages per 5 minutes per route, then one suppressed notice
  #    includeDemo: false         # also announce `lapilli demo` captures (they stay local)
  #    insecureHttp: false        # tests only, and also needs LAPILLI_NOTIFY_ALLOW_HTTP in extraEnv

serviceAccount:
  # e.g. eks.amazonaws.com/role-arn: arn:aws:iam::…:role/lapilli (IRSA),
  #      iam.gke.io/gcp-service-account: lapilli@project.iam.gserviceaccount.com
  annotations: {}

# PromQL range snapshots around the incident window (bundle `metrics/`). Off until you set
# prometheusUrl; then the "metrics" collector is added to the profile automatically.
# Plain http:// is accepted only for a cluster-local or loopback host (a single-label service
# name, *.svc, *.svc.cluster.local, localhost, 127.0.0.0/8); anything else must be https. The
# URL must carry no credentials, query or fragment, and must not resolve to a link-local
# address (169.254.0.0/16, fe80::/10) — a bad value fails the metrics collector (PARTIAL).
# An IP literal in brackets (http://[::1]:9090) is not accepted: write a name, or an IPv4
# literal (http://127.0.0.1:9090).
metrics:
  prometheusUrl: ""      # e.g. http://prometheus-operated.monitoring.svc:9090
  stepSeconds: 15
  # [{name: file_safe_name, query: 'PromQL with $namespace/$pod/$container'}]; empty = built-ins
  # (cAdvisor memory/CPU + kube-state-metrics limits/restarts).
  queries: []

# diffs/: before/after pod-template diffs are always on (read-only, from revision history).
# configMaps: when a rollout switched which ConfigMap the template references (kustomize
# hash suffixes, immutable ConfigMaps), also GET both ConfigMaps and diff them (redacted).
# Needs `get configmaps`, so it requires a non-empty watchNamespaces (never kube-system).
diffs:
  configMaps: false

# Credential redaction of captured objects (env values, args, probe headers, annotations,
# event messages) before they are written into a bundle. Best-effort pattern + entropy rules;
# "strict" redacts every candidate value except the names listed in plaintext; "off" is
# recorded in the bundle and flagged by `lapilli verify`. Container logs are never redacted.
redaction:
  mode: default          # default | strict | off
  plaintext: []          # e.g. [CACHE_WARMUP, LOG_LEVEL] (only used by strict)

signing:
  # "none" (default), "static" or "kms".
  # static: an existing Secret holding a PKCS#8 PEM private key under `key.pem`; Lapilli gets
  #   read access to that one Secret only.
  # kms: AWS KMS or GCP Cloud KMS signs every bundle (docs/kms.md); the key never enters the
  #   cluster. Credentials come from the service account (IRSA / Pod Identity / Workload
  #   Identity: see serviceAccount.annotations). Profiles' signing settings are ignored.
  mode: none
  keySecret: ""
  kms:
    # AWS: a key ARN (arn:aws:kms:<region>:<account>:key/<id>); alias ARNs are refused.
    # GCP: a key version (projects/<p>/locations/<l>/keyRings/<r>/cryptoKeys/<k>/cryptoKeyVersions/<n>).
    key: ""

# Where sealed .ieb bundles are written. Bundles are the product: keep them on a PVC.
# For audit use, back this with WORM/object-lock storage (DESIGN §5).
persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""   # "" = cluster default
  accessModes: [ReadWriteOnce]
  existingClaim: ""

service:
  port: 8080

# Seconds the kubelet waits after SIGTERM before SIGKILL. The controller uses it to finish the
# captures in flight and then flush notification groups that are still coalescing; a group is
# claimed before it is posted, so a truncated flush marks captures notified that were never
# announced. Lapilli needs at least 25 and the chart refuses to render below that. Raise it if your
# captures are slow (a large log window, or a slow Prometheus for the metrics collector).
terminationGracePeriodSeconds: 30

# Bundle lifecycle. Nothing deletes a sealed bundle unless you turn this on, and the volume above is
# 1Gi by default. One alert over a 20-pod Deployment at Alertmanager's default 4h repeat is about
# 120 captures a day, and how long that takes to fill 1Gi depends entirely on how big your bundles
# are: day 8 at a megabyte each, day 34 at 250 KB, years at the 6.2 KB measured for a crash-looping
# busybox pod whose whole log is one line. Only the last of those is measured, and it is a floor —
# a real capture carries a real log window. Size the volume from YOUR bundles
# (lapilli_bundle_bytes), not from this comment. A full volume makes EVERY capture fail, not just
# the old ones.
#
# READ THIS BEFORE ENABLING. With no export.destinations configured the local bundle is the ONLY
# copy, and reclaiming it destroys that evidence. That case needs `allowUnexported: true` on purpose.
# If you need evidence Lapilli itself cannot destroy, export it to a bucket with Object Lock.
# See docs/design-retention.md.
retention:
  # Ceiling on the bytes Lapilli's own files occupy under the bundle root. 0 = off, which is the
  # default: nothing is reclaimed until you choose a bound. Set to "" to derive it from
  # persistence.size × 0.8, or to a number of bytes.
  #
  # Deliberately a ceiling on OUR footprint, not on the filesystem's used bytes: a PVC is usually
  # backed by a filesystem much larger than the request (hostPath, local-path, kind), so `statvfs`
  # used-bytes and persistence.size are not the same quantity at all.
  maxBytes: 0
  # Also reclaim anything older than this many days. 0 = off.
  days: 0
  # Refuse to start a capture with less than this free, so it fails with a `pvc-full:` reason
  # instead of dying part-way through collection on ENOSPC. 0 = off.
  minFreeBytes: 67108864
  # Reclaim bundles that reached no destination — i.e. destroy the only copy. Off on purpose.
  allowUnexported: false
  # Reclaim files whose IncidentCapture is gone. Off on purpose: nothing in Lapilli deletes a capture,
  # so a `kubectl delete incidentcapture --all` (or the CRD delete-and-recreate upgrade) would
  # otherwise authorise a mass delete. The sweep refuses anyway above 100 files or 5% of the
  # population, and always reclaims abandoned staging directories regardless of this switch.
  reclaimOrphans: false

logLevel: info,kube=warn

# How many captures may be collected at once.
#
# Measured with test/e2e/storm.sh on kind — one payload of 20 realistic Alertmanager alerts,
# a fresh pod per value, peak read from the kernel's memory.peak against the 256Mi limit below:
#
#   concurrency                   peak       % of limit   CPU
#   1                             124.0 MiB    48.4%      2.18s
#   2  (default)                  121.3 MiB    47.4%      3.19s
#   8                             162.0 MiB    63.3%      8.32s
#   0  (kube-rs default)          183.8 MiB    71.8%      5.56s
#
# Read the caveat with the numbers. Every row is ONE run, and the peak is the high-water mark
# since the pod started, so it carries the informer's first list as well as the storm: 124.0 at
# concurrency 1 landing ABOVE 121.3 at concurrency 2 is the noise floor showing. Adjacent rows
# are not distinguishable. Only the ends carry weight — unbounded peaked about 60 MiB higher and
# burned more CPU for identical work — and that is the whole reason the default is 2.
#
# Wall clock is deliberately absent: the same storm has measured between 1 and 200 seconds
# depending on whether the metrics collector had anything to fetch, which is a property of your
# Prometheus and the alert's age rather than of this setting.
#
# An earlier version of this comment carried a different table for the same experiment, produced
# by a harness that sampled /metrics once after the storm had already finished. Those numbers
# were n=1 and not even taken during the run; they are gone rather than corrected.
reconcileConcurrency: 2

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 256Mi }

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Extra environment variables for the controller (e.g. a private KMS endpoint:
# AWS_ENDPOINT_URL_KMS). Not needed for normal installs.
# The bundle as a tool an agent can call (HolmesGPT, Claude Code, any MCP client): a second
# container in the controller pod serves the bundle volume over the Model Context Protocol —
# find_bundles by the alert's namespace/pod/rule/time, verify, summary, read_file
# (resources/*.json and diffs/**: the point-in-time object bodies and the rollout diff),
# postmortem. The volume is mounted read-only and every request needs
# `Authorization: Bearer <token>` (Secret <release>-mcp-token, key `token`, or existingSecret).
# Endpoint: http://<release>-mcp.<namespace>.svc:<port>/mcp (streamable HTTP).
# docs/design-distribution-path.md and integrations/holmesgpt/.
mcp:
  enabled: false
  port: 8082
  existingSecret: ""   # key `token`, >= 32 chars; required with `helm template`-based GitOps
  # Serve logs/** through read_file. Off: a container's log is text the workload wrote, going
  # straight into an agent's context. Turn on knowingly.
  allowLogs: false
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

extraEnv: []

# The controller's own Prometheus metrics, on /metrics of the health port (8081).
# The series are documented in docs/metrics.md; they carry no incident content.
telemetry:
  # Pod annotations for scrape-by-annotation setups (harmless if nothing reads them).
  scrapeAnnotations: true
  # A Service plus a Prometheus Operator ServiceMonitor (needs that CRD).
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
