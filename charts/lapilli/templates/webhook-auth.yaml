{{- if and .Values.webhook.auth.enabled (not .Values.webhook.auth.existingSecret) }}
{{- $name := printf "%s-webhook-token" (include "lapilli.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "lapilli.labels" . | nindent 4 }}
  annotations:
    # Never deleted by Helm; with `helm template`-based GitOps (Argo CD) `lookup` can't see
    # it and a new token would be rendered each sync: use webhook.auth.existingSecret there.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Generated once; reused on upgrade so Alertmanager's copy stays valid.
  token: {{ if $existing }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
{{- if .Values.webhook.networkPolicy.enabled }}
{{- if not .Values.webhook.networkPolicy.from }}
{{- fail "webhook.networkPolicy.from must list the allowed peers (an empty list would block Alertmanager too)" }}
{{- end }}
---
# This is a pod-wide ingress DENY with holes in it, not a restriction on one port. `policyTypes:
# [Ingress]` on this podSelector means every ingress connection the rules below do not allow is
# dropped — so every port the pod serves has to be named here or it goes dark. It used to carry
# the webhook rule alone, which killed 8081 (`/healthz`, `/metrics`, the ServiceMonitor) and 8082
# (mcp) while four places in the repo described it as "restrict ingress to the webhook port".
#
# Kubelet probes usually survive regardless, because most CNIs exempt traffic from the node the
# pod runs on — but that is CNI-dependent and not guaranteed by the NetworkPolicy API, so the
# health rule below is what makes probes work rather than luck.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lapilli.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels: {{- include "lapilli.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "lapilli.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # 8080: Alertmanager, and whatever else you let create captures.
    - ports: [{ port: webhook, protocol: TCP }]
      from: {{- toYaml .Values.webhook.networkPolicy.from | nindent 8 }}
    # 8081: probes and scraping.
    {{- include "lapilli.npHealthRule" . | nindent 4 }}
    {{- if and .Values.mcp.enabled (not .Values.mcp.networkPolicy.enabled) }}
    # 8082: the mcp Service. Named here because this policy would otherwise deny it; with
    # mcp.networkPolicy.enabled the separate policy in mcp.yaml carries the same rule instead.
    {{- include "lapilli.npMcpRule" . | nindent 4 }}
    {{- end }}
{{- end }}
