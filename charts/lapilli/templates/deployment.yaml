{{- if eq .Values.mode "serve" }}
{{- $s := .Values.serve }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
spec:
  # One writer for the ledger: the old pod stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      {{- include "lapilli.selector" . | nindent 6 }}
  template:
    metadata:
      {{- include "lapilli.podMeta" . | nindent 6 }}
    spec:
      serviceAccountName: {{ include "lapilli.serviceAccountName" . }}
      automountServiceAccountToken: {{ or (not (empty .Values.gcpProject)) (not (empty .Values.prometheus.auth)) }}
      securityContext:
        {{- include "lapilli.podSecurity" . | nindent 8 }}
      {{- if $s.rulesHistory.repository }}
      {{- $h := $s.rulesHistory }}
      initContainers:
        # Earlier versions of the rules, from git, for --rules-history.
        - name: rules-history
          image: {{ $h.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              set -eu
              since=${SINCE:-}
              if [ -z "$since" ]; then
                case $BACKFILL in
                  *d) s=$(( ${BACKFILL%d} * 86400 )) ;;
                  *h) s=$(( ${BACKFILL%h} * 3600 )) ;;
                  *) echo "serve.rulesHistory.since: give it, as serve.backfill $BACKFILL isn't in days or hours" >&2; exit 1 ;;
                esac
                since=$(date -u -d "@$(( $(date +%s) - s - 86400 ))" +%Y-%m-%dT%H:%M:%SZ)
              fi
              mkdir -p "$TMPDIR"
              rm -rf /work/repo /var/lib/lapilli-history/versions
              if [ -n "${TOKEN_FILE:-}" ]; then
                # shellcheck disable=SC2016 # git runs the helper, which reads the file
                git config --global credential.helper '!f() { echo username=x-access-token; printf "password=%s\n" "$(cat "$TOKEN_FILE")"; }; f'
              fi
              set -- clone --quiet --filter=blob:none --no-checkout --single-branch
              [ -z "$BRANCH" ] || set -- "$@" --branch "$BRANCH"
              git "$@" -- "$REPOSITORY" /work/repo
              REPO=/work/repo SINCE=$since OUT=/var/lib/lapilli-history/versions sh /scripts/git.sh
          env:
            - name: REPOSITORY
              value: {{ $h.repository | quote }}
            - name: BRANCH
              value: {{ $h.branch | quote }}
            - name: PATHS
              value: {{ required "serve.rulesHistory.paths: the rule files or directories in the repository" $h.paths | quote }}
            - name: SINCE
              value: {{ $h.since | quote }}
            - name: RENDER
              value: {{ $h.render | quote }}
            - name: BACKFILL
              value: {{ $s.backfill | quote }}
            - name: HOME
              value: /work
            - name: TMPDIR
              value: /work/tmp
            {{- if $h.tokenSecret.name }}
            - name: TOKEN_FILE
              value: {{ printf "/var/run/lapilli/git/%s" $h.tokenSecret.key | quote }}
            {{- end }}
          securityContext:
            {{- include "lapilli.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: rules-history
              mountPath: /var/lib/lapilli-history
            - name: rules-history-work
              mountPath: /work
            - name: rules-history-script
              mountPath: /scripts
              readOnly: true
            {{- if $h.tokenSecret.name }}
            - name: rules-history-token
              mountPath: /var/run/lapilli/git
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: lapilli
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --ledger=/var/lib/lapilli
            - --listen=:8080
            - {{ printf "--metrics-listen=:%d" (int .Values.serve.metricsPort) | quote }}
            - {{ printf "--every=%s" $s.every | quote }}
            - {{ printf "--settle=%s" $s.settle | quote }}
            - {{ printf "--backfill=%s" $s.backfill | quote }}
            - {{ printf "--keep=%s" $s.keep | quote }}
            - {{ printf "--digest=%s" $s.digest | quote }}
            - {{ printf "--timeout=%dm" (int .Values.timeoutMinutes) | quote }}
            {{- with $s.userHeader }}
            - {{ printf "--user-header=%s" . | quote }}
            {{- end }}
            {{- if $s.readOnly }}
            - --read-only
            {{- end }}
            {{- with $s.roles.editors }}
            - {{ printf "--editors=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $s.roles.admins }}
            - {{ printf "--admins=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $s.roles.groupsHeader }}
            - {{ printf "--groups-header=%s" . | quote }}
            {{- end }}
            {{- if $s.notify.webhookSecret.name }}
            - {{ printf "--notify-webhook-file=/var/run/lapilli/notify/%s" $s.notify.webhookSecret.key | quote }}
            {{- end }}
            {{- if $s.notify.slack }}
            - --notify-slack
            {{- end }}
            - {{ printf "--lang=%s" ($s.notify.lang | default "en") | quote }}
            {{- if $s.teamDigests.secretName }}
            {{- range $team, $key := $s.teamDigests.teams }}
            - {{ printf "--team-digest=%s=/var/run/lapilli/team-digests/%s" $team $key | quote }}
            {{- end }}
            {{- end }}
            {{- if or $s.incidentsAPI.tokenSecret.name $s.firings.tokenSecret.name }}
            - {{ printf "--incidents-listen=:%d" (int $s.incidentsAPI.port) | quote }}
            {{- end }}
            {{- if $s.incidentsAPI.tokenSecret.name }}
            - {{ printf "--incidents-token-file=/var/run/lapilli/incidents-token/%s" $s.incidentsAPI.tokenSecret.key | quote }}
            {{- end }}
            {{- if $s.firings.tokenSecret.name }}
            - {{ printf "--firings-token-file=/var/run/lapilli/firings-token/%s" $s.firings.tokenSecret.key | quote }}
            {{- with $s.firings.quietAfter }}
            - {{ printf "--source-quiet=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- with $s.notificationsAPI }}
            {{- if or .tokenSecret.name .grafanaSecret.name .snsTopics }}
            - {{ printf "--notify-listen=:%d" (int .port) | quote }}
            {{- end }}
            {{- if .tokenSecret.name }}
            - {{ printf "--notify-token-file=/var/run/lapilli/notify-token/%s" .tokenSecret.key | quote }}
            {{- end }}
            {{- if .grafanaSecret.name }}
            - {{ printf "--notify-grafana-secret-file=/var/run/lapilli/notify-grafana/%s" .grafanaSecret.key | quote }}
            {{- end }}
            {{- with .snsTopics }}
            - {{ printf "--notify-sns=%s" (join "," .) | quote }}
            {{- end }}
            {{- end }}
            {{- with $s.externalURL }}
            - {{ printf "--external-url=%s" . | quote }}
            {{- end }}
            {{- with $s.allowedHosts }}
            - {{ printf "--allowed-hosts=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $s.mcpCompare }}
            - {{ printf "--mcp-compare=%s" . | quote }}
            {{- end }}
            {{- if $s.rulesHistory.repository }}
            - --rules-history=/var/lib/lapilli-history/versions
            {{- end }}
            {{- include "lapilli.args" . | trim | nindent 12 }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: {{ .Values.serve.metricsPort }}
            {{- if or $s.incidentsAPI.tokenSecret.name $s.firings.tokenSecret.name }}
            - name: incidents
              containerPort: {{ $s.incidentsAPI.port }}
            {{- end }}
            {{- if (or $s.notificationsAPI.tokenSecret.name $s.notificationsAPI.grafanaSecret.name $s.notificationsAPI.snsTopics) }}
            - name: notifications
              containerPort: {{ $s.notificationsAPI.port }}
            {{- end }}
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            {{- include "lapilli.containerSecurity" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: ledger
              mountPath: /var/lib/lapilli
            {{- include "lapilli.mounts" . | trim | nindent 12 }}
            {{- if $s.notify.webhookSecret.name }}
            - name: notify
              mountPath: /var/run/lapilli/notify
              readOnly: true
            {{- end }}
            {{- if $s.teamDigests.secretName }}
            - name: team-digests
              mountPath: /var/run/lapilli/team-digests
              readOnly: true
            {{- end }}
            {{- if $s.incidentsAPI.tokenSecret.name }}
            - name: incidents-token
              mountPath: /var/run/lapilli/incidents-token
              readOnly: true
            {{- end }}
            {{- if $s.firings.tokenSecret.name }}
            - name: firings-token
              mountPath: /var/run/lapilli/firings-token
              readOnly: true
            {{- end }}
            {{- if $s.notificationsAPI.tokenSecret.name }}
            - name: notify-token
              mountPath: /var/run/lapilli/notify-token
              readOnly: true
            {{- end }}
            {{- if $s.notificationsAPI.grafanaSecret.name }}
            - name: notify-grafana
              mountPath: /var/run/lapilli/notify-grafana
              readOnly: true
            {{- end }}
            {{- if $s.rulesHistory.repository }}
            - name: rules-history
              mountPath: /var/lib/lapilli-history
              readOnly: true
            {{- end }}
      volumes:
        - name: ledger
          {{- if $s.ledger.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $s.ledger.existingClaim }}
          {{- else if $s.ledger.persistence }}
          persistentVolumeClaim:
            claimName: {{ include "lapilli.fullname" . }}-ledger
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "lapilli.volumes" . | trim | nindent 8 }}
        {{- if $s.notify.webhookSecret.name }}
        - name: notify
          secret:
            secretName: {{ $s.notify.webhookSecret.name }}
        {{- end }}
        {{- if $s.teamDigests.secretName }}
        - name: team-digests
          secret:
            secretName: {{ $s.teamDigests.secretName }}
        {{- end }}
        {{- if $s.incidentsAPI.tokenSecret.name }}
        - name: incidents-token
          secret:
            secretName: {{ $s.incidentsAPI.tokenSecret.name }}
        {{- end }}
        {{- if $s.firings.tokenSecret.name }}
        - name: firings-token
          secret:
            secretName: {{ $s.firings.tokenSecret.name }}
        {{- end }}
        {{- if $s.notificationsAPI.tokenSecret.name }}
        - name: notify-token
          secret:
            secretName: {{ $s.notificationsAPI.tokenSecret.name }}
        {{- end }}
        {{- if $s.notificationsAPI.grafanaSecret.name }}
        - name: notify-grafana
          secret:
            secretName: {{ $s.notificationsAPI.grafanaSecret.name }}
        {{- end }}
        {{- if $s.rulesHistory.repository }}
        - name: rules-history
          emptyDir: {}
        - name: rules-history-work
          emptyDir: {}
        - name: rules-history-script
          configMap:
            name: {{ include "lapilli.fullname" . }}-rules-history
        {{- if $s.rulesHistory.tokenSecret.name }}
        - name: rules-history-token
          secret:
            secretName: {{ $s.rulesHistory.tokenSecret.name }}
        {{- end }}
        {{- end }}
      {{- include "lapilli.placement" . | nindent 6 }}
{{- end }}
