{{- include "lapilli.defaults" . }}
{{- if eq .Values.mode "serve" }}
{{- $s := .Values.serve }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
spec:
  # One writer for the ledger: the old pod stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      {{- include "lapilli.selector" . | nindent 6 }}
  template:
    metadata:
      {{- include "lapilli.podMeta" . | nindent 6 }}
    spec:
      serviceAccountName: {{ include "lapilli.serviceAccountName" . }}
      # Mounted in lapilli's container alone, when a cloud's identity may
      # need it (lapilli.saToken), not in the rules history's.
      automountServiceAccountToken: false
      securityContext:
        {{- include "lapilli.podSecurity" . | nindent 8 }}
      {{- if $s.rulesHistory.repository }}
      initContainers:
        {{- include "lapilli.historyInit" . | nindent 8 }}
      {{- end }}
      containers:
        - name: lapilli
          image: {{ include "lapilli.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --ledger=/var/lib/lapilli
            - --listen=:8080
            - {{ printf "--metrics-listen=:%d" (int .Values.serve.metricsPort) | quote }}
            - {{ printf "--every=%s" $s.every | quote }}
            {{- with .Values.rules.alarmsEvery }}
            - {{ printf "--alarms-every=%s" . | quote }}
            {{- end }}
            - {{ printf "--settle=%s" $s.settle | quote }}
            - {{ printf "--backfill=%s" $s.backfill | quote }}
            - {{ printf "--keep=%s" $s.keep | quote }}
            - {{ printf "--digest=%s" $s.digest | quote }}
            {{- if not $s.checkReplay.enabled }}
            - --check-replay=false
            {{- else }}
            {{- range $s.checkReplay.series }}
            - {{ printf "--check-series=%s" . | quote }}
            {{- end }}
            {{- with $s.checkReplay.differs }}
            - {{ printf "--check-differs=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- if not $s.checkContent.enabled }}
            - --check-content=false
            {{- else }}
            {{- with $s.checkContent.severities }}
            - {{ printf "--severities=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $s.checkContent.scrapeInterval }}
            - {{ printf "--scrape-interval=%s" . | quote }}
            {{- end }}
            {{- end }}
            - {{ printf "--timeout=%dm" (int .Values.timeoutMinutes) | quote }}
            {{- with $s.userHeader }}
            - {{ printf "--user-header=%s" . | quote }}
            {{- end }}
            {{- if $s.readOnly }}
            - --read-only
            {{- end }}
            {{- if $s.everyoneAdmin }}
            - --everyone-admin
            {{- end }}
            {{- with $s.roles.editors }}
            - {{ printf "--editors=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $s.roles.admins }}
            - {{ printf "--admins=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $s.roles.viewers }}
            - {{ printf "--viewers=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $s.roles.groupsHeader }}
            - {{ printf "--groups-header=%s" . | quote }}
            {{- end }}
            {{- if $s.notify.webhookSecret.name }}
            - {{ printf "--notify-webhook-file=/var/run/lapilli/notify/%s" $s.notify.webhookSecret.key | quote }}
            {{- end }}
            {{- if $s.notify.slack }}
            - --notify-slack
            {{- end }}
            - {{ printf "--lang=%s" ($s.notify.lang | default "en") | quote }}
            {{- if $s.teamDigests.secretName }}
            {{- range $team, $key := $s.teamDigests.teams }}
            - {{ printf "--team-digest=%s=/var/run/lapilli/team-digests/%s" $team $key | quote }}
            {{- end }}
            {{- end }}
            {{- range $i, $d := ($s.reports).destinations }}
            - {{ printf "--report-dest=%s=/var/run/lapilli/report-dests/%d/url" $d.name $i | quote }}
            {{- end }}
            {{- if include "lapilli.incidentsPort" . }}
            - {{ printf "--incidents-listen=:%d" (int $s.incidentsAPI.port) | quote }}
            {{- end }}
            {{- if $s.incidentsAPI.tokenSecret.name }}
            - {{ printf "--incidents-token-file=/var/run/lapilli/incidents-token/%s" $s.incidentsAPI.tokenSecret.key | quote }}
            {{- end }}
            {{- if $s.firings.tokenSecret.name }}
            - {{ printf "--firings-token-file=/var/run/lapilli/firings-token/%s" $s.firings.tokenSecret.key | quote }}
            {{- with $s.firings.quietAfter }}
            - {{ printf "--source-quiet=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- if $s.onCall.configMap.name }}
            - {{ printf "--on-call=/etc/lapilli/on-call/%s" $s.onCall.configMap.key | quote }}
            {{- end }}
            {{- if $s.trackers.tokenSecret.name }}
            - {{ printf "--tasks-token-file=/var/run/lapilli/tasks-token/%s" $s.trackers.tokenSecret.key | quote }}
            {{- end }}
            {{- with $s.notificationsAPI }}
            {{- if or .tokenSecret.name .grafanaSecret.name .snsTopics }}
            - {{ printf "--notify-listen=:%d" (int .port) | quote }}
            {{- end }}
            {{- if .tokenSecret.name }}
            - {{ printf "--notify-token-file=/var/run/lapilli/notify-token/%s" .tokenSecret.key | quote }}
            {{- end }}
            {{- if .grafanaSecret.name }}
            - {{ printf "--notify-grafana-secret-file=/var/run/lapilli/notify-grafana/%s" .grafanaSecret.key | quote }}
            {{- end }}
            {{- with .snsTopics }}
            - {{ printf "--notify-sns=%s" (join "," .) | quote }}
            {{- end }}
            {{- end }}
            {{- with include "lapilli.externalURL" . }}
            - {{ printf "--external-url=%s" . | quote }}
            {{- end }}
            {{- with include "lapilli.allowedHosts" . }}
            - {{ printf "--allowed-hosts=%s" . | quote }}
            {{- end }}
            {{- with $s.signIn }}
            {{- if .oidc.issuer }}
            - {{ printf "--oidc-issuer=%s" .oidc.issuer | quote }}
            - {{ printf "--oidc-client-id=%s" .oidc.clientId | quote }}
            {{- if .oidc.clientSecret.name }}
            - {{ printf "--oidc-client-secret-file=/var/run/lapilli/oidc/%s" .oidc.clientSecret.key | quote }}
            {{- end }}
            {{- with .oidc.scopes }}
            - {{ printf "--oidc-scopes=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .oidc.hostedDomains }}
            - {{ printf "--oidc-hosted-domain=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .oidc.trustedClients }}
            - {{ printf "--oidc-trusted-clients=%s" (join "," .) | quote }}
            {{- end }}
            {{- if eq (toString .oidc.bearer) "false" }}
            - --oidc-bearer=false
            {{- end }}
            {{- with .sessionMaxAge }}
            - {{ printf "--session-max-age=%s" . | quote }}
            {{- end }}
            {{- if or .sessionKeySecret.name .sessionKeySecret.create }}
            - {{ printf "--session-key-file=/var/run/lapilli/session-key/%s" (ternary .sessionKeySecret.key "session-key" (not (empty .sessionKeySecret.name))) | quote }}
            {{- end }}
            {{- end }}
            {{- with .proxyJWT }}
            {{- if .kind }}
            - {{ printf "--proxy-jwt=%s" .kind | quote }}
            {{- range $flag, $v := dict "audience" .audience "alb-arn" .albArn "issuer" .issuer "jwks" .jwks "header" .header }}
            {{- with $v }}
            - {{ printf "--proxy-jwt-%s=%s" $flag . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if or .oidc.issuer .proxyJWT.kind }}
            - {{ printf "--user-claim=%s" (.userClaim | default "email") | quote }}
            - {{ printf "--groups-claim=%s" (.groupsClaim | default "") | quote }}
            {{- end }}
            {{- end }}
            {{- with $s.mcpCompare }}
            - {{ printf "--mcp-compare=%s" . | quote }}
            {{- end }}
            {{- with $s.mcpPropose }}
            - {{ printf "--mcp-propose=%s" . | quote }}
            {{- end }}
            {{- with $s.changes }}
            {{- if .enabled }}
            - --changes
            {{- with .approvers }}
            - {{ printf "--approvers=%s" (join "," .) | quote }}
            {{- end }}
            - {{ printf "--approvals=%d" (int (.approvals | default 1)) | quote }}
            {{- with .limits }}
            - {{ printf "--changes-limits=%s" . | quote }}
            {{- end }}
            - --changes-paused=/var/run/lapilli/changes-paused/paused
            {{- if .tokenSecret.name }}
            - {{ printf "--changes-token-file=/var/run/lapilli/changes-token/%s" .tokenSecret.key | quote }}
            {{- end }}
            {{- if .grafanaTokenSecret.name }}
            - {{ printf "--changes-grafana-token-file=/var/run/lapilli/changes-grafana/%s" .grafanaTokenSecret.key | quote }}
            {{- end }}
            {{- with .in }}
            - {{ printf "--changes-in=%s" (join "," .) | quote }}
            {{- end }}
            {{- range .managed }}
            - {{ printf "--changes-managed=%s" . | quote }}
            {{- end }}
            {{- if .rulerTokenSecret.name }}
            - {{ printf "--changes-ruler-token-file=/var/run/lapilli/changes-ruler/%s" .rulerTokenSecret.key | quote }}
            {{- end }}
            {{- with .awsRole }}
            - {{ printf "--changes-aws-role=%s" . | quote }}
            {{- end }}
            {{- with .azureClientId }}
            - {{ printf "--changes-azure-client-id=%s" . | quote }}
            {{- end }}
            {{- with .googleServiceAccount }}
            - {{ printf "--changes-google-service-account=%s" . | quote }}
            {{- end }}
            {{- if (.ociConfigSecret).name }}
            - --changes-oci-config=/etc/lapilli/oci/config
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $s.rulesHistory.repository }}
            - --rules-history=/var/lib/lapilli-history/versions
            {{- with $s.rulesHistory.select }}
            - {{ printf "--rules-select=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- include "lapilli.args" . | trim | nindent 12 }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: {{ .Values.serve.metricsPort }}
            {{- if include "lapilli.incidentsPort" . }}
            - name: incidents
              containerPort: {{ $s.incidentsAPI.port }}
            {{- end }}
            {{- if (or $s.notificationsAPI.tokenSecret.name $s.notificationsAPI.grafanaSecret.name $s.notificationsAPI.snsTopics) }}
            - name: notifications
              containerPort: {{ $s.notificationsAPI.port }}
            {{- end }}
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          # Ready once the first run is done (serve.readinessPath), so a
          # load balancer sends people to a UI with something in it.
          readinessProbe:
            httpGet: {path: {{ $s.readinessPath | default "/readyz" }}, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            {{- include "lapilli.containerSecurity" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: ledger
              mountPath: /var/lib/lapilli
            {{- include "lapilli.mounts" . | trim | nindent 12 }}
            {{- if $s.notify.webhookSecret.name }}
            - name: notify
              mountPath: /var/run/lapilli/notify
              readOnly: true
            {{- end }}
            {{- if and $s.signIn.oidc.issuer $s.signIn.oidc.clientSecret.name }}
            - name: oidc
              mountPath: /var/run/lapilli/oidc
              readOnly: true
            {{- end }}
            {{- if and $s.signIn.oidc.issuer (or $s.signIn.sessionKeySecret.name $s.signIn.sessionKeySecret.create) }}
            - name: session-key
              mountPath: /var/run/lapilli/session-key
              readOnly: true
            {{- end }}
            {{- if $s.teamDigests.secretName }}
            - name: team-digests
              mountPath: /var/run/lapilli/team-digests
              readOnly: true
            {{- end }}
            {{- range $i, $d := ($s.reports).destinations }}
            - name: report-dest-{{ $i }}
              mountPath: /var/run/lapilli/report-dests/{{ $i }}
              readOnly: true
            {{- end }}
            {{- if $s.incidentsAPI.tokenSecret.name }}
            - name: incidents-token
              mountPath: /var/run/lapilli/incidents-token
              readOnly: true
            {{- end }}
            {{- if $s.firings.tokenSecret.name }}
            - name: firings-token
              mountPath: /var/run/lapilli/firings-token
              readOnly: true
            {{- end }}
            {{- if $s.trackers.tokenSecret.name }}
            - name: tasks-token
              mountPath: /var/run/lapilli/tasks-token
              readOnly: true
            {{- end }}
            {{- if $s.notificationsAPI.tokenSecret.name }}
            - name: notify-token
              mountPath: /var/run/lapilli/notify-token
              readOnly: true
            {{- end }}
            {{- if $s.onCall.configMap.name }}
            - name: on-call
              mountPath: /etc/lapilli/on-call
              readOnly: true
            {{- end }}
            {{- if $s.onCall.secret }}
            - name: on-call-secrets
              mountPath: /var/run/lapilli/on-call
              readOnly: true
            {{- end }}
            {{- if $s.changes.enabled }}
            - name: changes-paused
              mountPath: /var/run/lapilli/changes-paused
              readOnly: true
            {{- if $s.changes.tokenSecret.name }}
            - name: changes-token
              mountPath: /var/run/lapilli/changes-token
              readOnly: true
            {{- end }}
            {{- if $s.changes.grafanaTokenSecret.name }}
            - name: changes-grafana
              mountPath: /var/run/lapilli/changes-grafana
              readOnly: true
            {{- end }}
            {{- if $s.changes.rulerTokenSecret.name }}
            - name: changes-ruler
              mountPath: /var/run/lapilli/changes-ruler
              readOnly: true
            {{- end }}
            {{- if ($s.changes.ociConfigSecret).name }}
            - name: changes-oci
              mountPath: /etc/lapilli/oci
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $s.notificationsAPI.grafanaSecret.name }}
            - name: notify-grafana
              mountPath: /var/run/lapilli/notify-grafana
              readOnly: true
            {{- end }}
            {{- if $s.rulesHistory.repository }}
            - name: rules-history
              mountPath: /var/lib/lapilli-history
              readOnly: true
            {{- end }}
        {{- if include "lapilli.historyFollows" . }}
        {{- include "lapilli.historySidecars" . | nindent 8 }}
        {{- end }}
      volumes:
        - name: ledger
          {{- if $s.ledger.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $s.ledger.existingClaim }}
          {{- else if $s.ledger.persistence }}
          persistentVolumeClaim:
            claimName: {{ include "lapilli.fullname" . }}-ledger
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "lapilli.volumes" . | trim | nindent 8 }}
        {{- if $s.notify.webhookSecret.name }}
        - name: notify
          secret:
            secretName: {{ $s.notify.webhookSecret.name }}
        {{- end }}
        {{- if and $s.signIn.oidc.issuer $s.signIn.oidc.clientSecret.name }}
        - name: oidc
          secret:
            secretName: {{ $s.signIn.oidc.clientSecret.name }}
        {{- end }}
        {{- if and $s.signIn.oidc.issuer (or $s.signIn.sessionKeySecret.name $s.signIn.sessionKeySecret.create) }}
        - name: session-key
          secret:
            secretName: {{ $s.signIn.sessionKeySecret.name | default (printf "%s-session-key" (include "lapilli.fullname" .)) }}
        {{- end }}
        {{- if $s.teamDigests.secretName }}
        - name: team-digests
          secret:
            secretName: {{ $s.teamDigests.secretName }}
        {{- end }}
        {{- range $i, $d := ($s.reports).destinations }}
        - name: report-dest-{{ $i }}
          secret:
            secretName: {{ $d.secretName }}
            items:
              - key: {{ $d.key | default "url" }}
                path: url
        {{- end }}
        {{- if $s.incidentsAPI.tokenSecret.name }}
        - name: incidents-token
          secret:
            secretName: {{ $s.incidentsAPI.tokenSecret.name }}
        {{- end }}
        {{- if $s.firings.tokenSecret.name }}
        - name: firings-token
          secret:
            secretName: {{ $s.firings.tokenSecret.name }}
        {{- end }}
        {{- if $s.trackers.tokenSecret.name }}
        - name: tasks-token
          secret:
            secretName: {{ $s.trackers.tokenSecret.name }}
        {{- end }}
        {{- if $s.notificationsAPI.tokenSecret.name }}
        - name: notify-token
          secret:
            secretName: {{ $s.notificationsAPI.tokenSecret.name }}
        {{- end }}
        {{- if $s.onCall.configMap.name }}
        - name: on-call
          configMap:
            name: {{ $s.onCall.configMap.name }}
        {{- end }}
        {{- if $s.onCall.secret }}
        - name: on-call-secrets
          secret:
            secretName: {{ $s.onCall.secret }}
        {{- end }}
        {{- if $s.changes.enabled }}
        # Made by whoever stops changes: while it is there, nothing is
        # carried out. The write credentials are mounted only with changes
        # on.
        - name: changes-paused
          configMap:
            name: {{ include "lapilli.fullname" . }}-changes-paused
            optional: true
        {{- if $s.changes.tokenSecret.name }}
        - name: changes-token
          secret:
            secretName: {{ $s.changes.tokenSecret.name }}
        {{- end }}
        {{- if $s.changes.grafanaTokenSecret.name }}
        - name: changes-grafana
          secret:
            secretName: {{ $s.changes.grafanaTokenSecret.name }}
        {{- end }}
        {{- if $s.changes.rulerTokenSecret.name }}
        - name: changes-ruler
          secret:
            secretName: {{ $s.changes.rulerTokenSecret.name }}
        {{- end }}
        {{- with $s.changes.ociConfigSecret }}
        {{- if .name }}
        # An OCI config file and the API key it names, for writes: OCI's
        # workload identity has no second identity a pod can take.
        - name: changes-oci
          secret:
            secretName: {{ .name }}
            items:
              - key: {{ .configKey | default "config" }}
                path: config
              - key: {{ .keyKey | default "key.pem" }}
                path: key.pem
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if $s.notificationsAPI.grafanaSecret.name }}
        - name: notify-grafana
          secret:
            secretName: {{ $s.notificationsAPI.grafanaSecret.name }}
        {{- end }}
        {{- if $s.rulesHistory.repository }}
        {{- include "lapilli.historyVolumes" . | nindent 8 }}
        {{- end }}
      {{- include "lapilli.placement" . | nindent 6 }}
{{- end }}
