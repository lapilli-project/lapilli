{{- include "lapilli.defaults" . }}
{{- if eq .Values.mode "serve" }}
{{- $s := .Values.serve }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
spec:
  {{- $n := int $s.replicas }}
  replicas: {{ $n }}
  strategy:
    {{- if gt $n 1 }}
    # Replicas sharing a Postgres ledger (docs/design/replicas.md): one at
    # a time, each new pod a follower until the leader it replaces lets the
    # lease go, so the UI and the ports never all go.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    # One pod: the old stops before the new one starts. A SQLite ledger is
    # its volume's; a Postgres one, upgraded from 0.35 or before,
    # is refused to a new pod while an old one holds it alone.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      {{- include "lapilli.selector" . | nindent 6 }}
  template:
    metadata:
      {{- include "lapilli.podMeta" . | nindent 6 }}
    spec:
      serviceAccountName: {{ include "lapilli.serviceAccountName" . }}
      # Mounted in lapilli's container alone, when a cloud's identity may
      # need it (lapilli.saToken), not in the rules history's.
      automountServiceAccountToken: false
      {{- $drain := 0 }}
      {{- if gt $n 1 }}{{ $drain = int $s.shutdownDelaySeconds }}{{ end }}
      {{- if gt $drain 0 }}
      # Told to stop, a replica answers for serve.shutdownDelaySeconds
      # first; then the 30 s Kubernetes gives, for the rest of its stop.
      terminationGracePeriodSeconds: {{ add $drain 30 }}
      {{- end }}
      securityContext:
        {{- include "lapilli.podSecurity" . | nindent 8 }}
      {{- $promtool := $s.promtool | default dict }}
      {{- if and $promtool.image $promtool.path }}
      {{- fail "serve.promtool: give image, an image promtool is copied from, or path, promtool's path in an image of your own, not both" }}
      {{- end }}
      {{- if and (or $promtool.image $promtool.path) (not (or $s.expectations $s.config)) }}
      {{- fail "serve.promtool runs the scenarios of serve.expectations or of serve.config's expectations: give one" }}
      {{- end }}
      {{- if or $s.rulesHistory.repository $promtool.image }}
      initContainers:
        {{- if $s.rulesHistory.repository }}
        {{- include "lapilli.historyInit" . | nindent 8 }}
        {{- end }}
        {{- if $promtool.image }}
        # promtool, copied from an image that holds it into an emptyDir
        # of this pod's alone, for --promtool.
        - name: promtool
          image: {{ $promtool.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["cp", {{ $promtool.from | default "/bin/promtool" | quote }}, "/promtool/promtool"]
          securityContext:
            {{- include "lapilli.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: promtool
              mountPath: /promtool
        {{- end }}
      {{- end }}
      containers:
        - name: lapilli
          image: {{ include "lapilli.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            {{- if $s.ledger.postgres.secret.name }}
            - {{ printf "--ledger-url-file=/var/run/lapilli/ledger/%s" $s.ledger.postgres.secret.key | quote }}
            {{- else }}
            - --ledger=/var/lib/lapilli
            {{- end }}
            - --listen=:8080
            - {{ printf "--metrics-listen=:%d" (int .Values.serve.metricsPort) | quote }}
            {{- if gt $drain 0 }}
            - {{ printf "--shutdown-delay=%ds" $drain | quote }}
            {{- end }}
            - {{ printf "--every=%s" $s.every | quote }}
            {{- with .Values.rules.alarmsEvery }}
            - {{ printf "--alarms-every=%s" . | quote }}
            {{- end }}
            - {{ printf "--settle=%s" $s.settle | quote }}
            - {{ printf "--backfill=%s" $s.backfill | quote }}
            - {{ printf "--keep=%s" $s.keep | quote }}
            {{- /* 0 keeps it all: given as it is. Empty, or left out (a
            release from before it, upgraded with --reuse-values), serve's
            own 800d. */}}
            {{- if and (not (kindIs "invalid" $s.keepActivity)) (ne (toString $s.keepActivity) "") }}
            - {{ printf "--keep-activity=%v" $s.keepActivity | quote }}
            {{- end }}
            - {{ printf "--digest=%s" $s.digest | quote }}
            {{- if not $s.checkReplay.enabled }}
            - --check-replay=false
            {{- else }}
            {{- range $s.checkReplay.series }}
            - {{ printf "--check-series=%s" . | quote }}
            {{- end }}
            {{- with $s.checkReplay.differs }}
            - {{ printf "--check-differs=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- if not $s.checkContent.enabled }}
            - --check-content=false
            {{- else }}
            {{- with $s.checkContent.severities }}
            - {{ printf "--severities=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $s.checkContent.scrapeInterval }}
            - {{ printf "--scrape-interval=%s" . | quote }}
            {{- end }}
            {{- with $s.checkContent.runbookAnnotations }}
            - {{ printf "--runbook-annotations=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $s.checkContent.runbookBase }}
            - {{ printf "--runbook-base=%s" . | quote }}
            {{- end }}
            {{- $am := include "lapilli.alertmanager" $ | fromJson }}
            {{- if $am.url }}
            - {{ printf "--alertmanager-config=%s" $am.url | quote }}
            {{- else if ($am.secret).name }}
            - {{ printf "--alertmanager-config=/etc/lapilli/alertmanager/%s" ($am.secret.key | default "alertmanager.yaml") | quote }}
            {{- else if ($am.configMap).name }}
            - {{ printf "--alertmanager-config=/etc/lapilli/alertmanager/%s" ($am.configMap.key | default "alertmanager.yaml") | quote }}
            {{- end }}
            {{- end }}
            - {{ printf "--timeout=%dm" (int .Values.timeoutMinutes) | quote }}
            {{- with $s.userHeader }}
            - {{ printf "--user-header=%s" . | quote }}
            {{- end }}
            {{- if $s.readOnly }}
            {{- if or $s.config $s.proposalsExpire }}
            {{- fail "serve.readOnly writes nothing: serve.config and serve.proposalsExpire write the ledger" }}
            {{- end }}
            - --read-only
            {{- end }}
            {{- if $s.config }}
            - --config=/etc/lapilli/config/config.yaml
            {{- end }}
            {{- if $s.configPrune }}
            {{- if not $s.config }}
            {{- fail "serve.configPrune deletes what serve.config no longer declares: give serve.config" }}
            {{- end }}
            - --config-prune
            {{- end }}
            {{- if $s.recordByWeek }}
            - --record-by-week
            {{- end }}
            {{- if $s.goalTasks }}
            {{- if not $s.config }}
            {{- fail "serve.goalTasks makes tasks for the goals serve.config declares: give serve.config" }}
            {{- end }}
            - --goal-tasks
            {{- end }}
            {{- if $s.expectations }}
            - --expect=/etc/lapilli/expectations/expectations.yaml
            {{- end }}
            {{- if $s.expectTasks }}
            - --expect-tasks
            {{- end }}
            {{- if $promtool.image }}
            - --promtool=/opt/lapilli-promtool/promtool
            {{- else if $promtool.path }}
            - {{ printf "--promtool=%s" $promtool.path | quote }}
            {{- end }}
            {{- if and (or $promtool.image $promtool.path) $promtool.memory }}
            - {{ printf "--promtool-memory=%s" $promtool.memory | quote }}
            {{- end }}
            {{- with $s.proposalsExpire }}
            - {{ printf "--proposals-expire=%s" . | quote }}
            {{- end }}
            {{- if $s.everyoneAdmin }}
            - --everyone-admin
            {{- end }}
            {{- with $s.roles.editors }}
            - {{ printf "--editors=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $s.roles.admins }}
            - {{ printf "--admins=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $s.roles.viewers }}
            - {{ printf "--viewers=%s" (join "," .) | quote }}
            {{- end }}
            {{- with $s.roles.groupsHeader }}
            - {{ printf "--groups-header=%s" . | quote }}
            {{- end }}
            {{- if $s.notify.webhookSecret.name }}
            - {{ printf "--notify-webhook-file=/var/run/lapilli/notify/%s" $s.notify.webhookSecret.key | quote }}
            {{- with $s.notify.webhookSecret.signingKey }}
            - {{ printf "--notify-webhook-secret-file=/var/run/lapilli/notify/%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- if $s.notify.slack }}
            - --notify-slack
            {{- end }}
            - {{ printf "--lang=%s" ($s.notify.lang | default "en") | quote }}
            {{- if $s.teamDigests.secretName }}
            {{- range $team, $key := $s.teamDigests.teams }}
            - {{ printf "--team-digest=%s=/var/run/lapilli/team-digests/%s" $team $key | quote }}
            {{- end }}
            {{- end }}
            {{- range $i, $d := ($s.reports).destinations }}
            - {{ printf "--report-dest=%s=/var/run/lapilli/report-dests/%d/url" $d.name $i | quote }}
            {{- end }}
            {{- range $i, $d := ($s.notify).webhookDests }}
            - {{ printf "--webhook-dest=%s=/var/run/lapilli/webhook-dests/%d/url" $d.name $i | quote }}
            {{- if $d.signingKey }}
            - {{ printf "--webhook-dest-secret=%s=/var/run/lapilli/webhook-dests/%d/key" $d.name $i | quote }}
            {{- end }}
            {{- end }}
            {{- with $s.teamLabels }}
            - {{ printf "--team-labels=%s" (join "," .) | quote }}
            {{- end }}
            {{- if include "lapilli.incidentsPort" . }}
            - {{ printf "--incidents-listen=:%d" (int $s.incidentsAPI.port) | quote }}
            {{- end }}
            {{- if $s.incidentsAPI.tokenSecret.name }}
            - {{ printf "--incidents-token-file=/var/run/lapilli/incidents-token/%s" $s.incidentsAPI.tokenSecret.key | quote }}
            {{- end }}
            {{- if $s.firings.tokenSecret.name }}
            - {{ printf "--firings-token-file=/var/run/lapilli/firings-token/%s" $s.firings.tokenSecret.key | quote }}
            {{- with $s.firings.quietAfter }}
            - {{ printf "--source-quiet=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- range $src, $rt := (($s.responses).tokenSecrets | default dict) }}
            - {{ printf "--responses-token-file=%s=/var/run/lapilli/responses-token/%s/%s" $src $src ($rt.key | default "token") | quote }}
            {{- end }}
            {{- if ($s.responses).configMap.name }}
            - {{ printf "--responses=/etc/lapilli/responses/%s" $s.responses.configMap.key | quote }}
            {{- end }}
            {{- if $s.onCall.configMap.name }}
            - {{ printf "--on-call=/etc/lapilli/on-call/%s" $s.onCall.configMap.key | quote }}
            {{- end }}
            {{- if ($s.deploys).configMap.name }}
            - {{ printf "--deploys=/etc/lapilli/deploys/%s" $s.deploys.configMap.key | quote }}
            {{- with $s.deploys.before }}
            - {{ printf "--deploy-before=%s" . | quote }}
            {{- end }}
            {{- with $s.deploys.after }}
            - {{ printf "--deploy-after=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- if ($s.marked).configMap.name }}
            - {{ printf "--marked=/etc/lapilli/marked/%s" $s.marked.configMap.key | quote }}
            {{- end }}
            {{- range $m := $s.mark }}
            - {{ printf "--mark=%s=%s" $m.kind $m.expr | quote }}
            {{- with $m.match }}
            - {{ printf "--mark-match=%s=%s" $m.kind (join "," .) | quote }}
            {{- end }}
            {{- end }}
            {{- if $s.trackers.tokenSecret.name }}
            - {{ printf "--tasks-token-file=/var/run/lapilli/tasks-token/%s" $s.trackers.tokenSecret.key | quote }}
            {{- end }}
            {{- with $s.notificationsAPI }}
            {{- if or .tokenSecret.name .grafanaSecret.name .snsTopics }}
            - {{ printf "--notify-listen=:%d" (int .port) | quote }}
            {{- end }}
            {{- if .tokenSecret.name }}
            - {{ printf "--notify-token-file=/var/run/lapilli/notify-token/%s" .tokenSecret.key | quote }}
            {{- end }}
            {{- if .grafanaSecret.name }}
            - {{ printf "--notify-grafana-secret-file=/var/run/lapilli/notify-grafana/%s" .grafanaSecret.key | quote }}
            {{- end }}
            {{- with .snsTopics }}
            - {{ printf "--notify-sns=%s" (join "," .) | quote }}
            {{- end }}
            {{- end }}
            {{- with $s.backtest }}
            {{- if .enabled }}
            - {{ printf "--backtest-listen=:%d" (int .port) | quote }}
            - {{ printf "--backtest-trust=/etc/lapilli/backtest/%s" (.trust.configMap.key | default "trust.yaml") | quote }}
            {{- with .share }}
            - {{ printf "--backtest-share=%s" (toString .) | quote }}
            {{- end }}
            {{- with .queue }}
            - {{ printf "--backtest-queue=%d" (int .) | quote }}
            {{- end }}
            {{- with .timeout }}
            - {{ printf "--backtest-timeout=%s" (toString .) | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with include "lapilli.externalURL" . }}
            - {{ printf "--external-url=%s" . | quote }}
            {{- end }}
            {{- with include "lapilli.allowedHosts" . }}
            - {{ printf "--allowed-hosts=%s" . | quote }}
            {{- end }}
            {{- with $s.signIn }}
            {{- if .oidc.issuer }}
            - {{ printf "--oidc-issuer=%s" .oidc.issuer | quote }}
            - {{ printf "--oidc-client-id=%s" .oidc.clientId | quote }}
            {{- if .oidc.clientSecret.name }}
            - {{ printf "--oidc-client-secret-file=/var/run/lapilli/oidc/%s" .oidc.clientSecret.key | quote }}
            {{- end }}
            {{- with .oidc.scopes }}
            - {{ printf "--oidc-scopes=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .oidc.hostedDomains }}
            - {{ printf "--oidc-hosted-domain=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .oidc.trustedClients }}
            - {{ printf "--oidc-trusted-clients=%s" (join "," .) | quote }}
            {{- end }}
            {{- if eq (toString .oidc.bearer) "false" }}
            - --oidc-bearer=false
            {{- end }}
            {{- with .sessionMaxAge }}
            - {{ printf "--session-max-age=%s" . | quote }}
            {{- end }}
            {{- if or .sessionKeySecret.name .sessionKeySecret.create }}
            - {{ printf "--session-key-file=/var/run/lapilli/session-key/%s" (ternary .sessionKeySecret.key "session-key" (not (empty .sessionKeySecret.name))) | quote }}
            {{- end }}
            {{- end }}
            {{- with .proxyJWT }}
            {{- if .kind }}
            - {{ printf "--proxy-jwt=%s" .kind | quote }}
            {{- range $flag, $v := dict "audience" .audience "alb-arn" .albArn "issuer" .issuer "jwks" .jwks "header" .header }}
            {{- with $v }}
            - {{ printf "--proxy-jwt-%s=%s" $flag . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if or .oidc.issuer .proxyJWT.kind }}
            - {{ printf "--user-claim=%s" (.userClaim | default "email") | quote }}
            - {{ printf "--groups-claim=%s" (.groupsClaim | default "") | quote }}
            {{- end }}
            {{- end }}
            {{- with $s.mcpCompare }}
            - {{ printf "--mcp-compare=%s" . | quote }}
            {{- end }}
            {{- with $s.mcpPropose }}
            - {{ printf "--mcp-propose=%s" . | quote }}
            {{- end }}
            {{- with $s.changes }}
            {{- if .enabled }}
            - --changes
            {{- with .approvers }}
            - {{ printf "--approvers=%s" (join "," .) | quote }}
            {{- end }}
            - {{ printf "--approvals=%d" (int (.approvals | default 1)) | quote }}
            {{- with .limits }}
            - {{ printf "--changes-limits=%s" . | quote }}
            {{- end }}
            - --changes-paused=/var/run/lapilli/changes-paused/paused
            {{- if .tokenSecret.name }}
            - {{ printf "--changes-token-file=/var/run/lapilli/changes-token/%s" .tokenSecret.key | quote }}
            {{- end }}
            {{- if .grafanaTokenSecret.name }}
            - {{ printf "--changes-grafana-token-file=/var/run/lapilli/changes-grafana/%s" .grafanaTokenSecret.key | quote }}
            {{- end }}
            {{- with .in }}
            - {{ printf "--changes-in=%s" (join "," .) | quote }}
            {{- end }}
            {{- range .managed }}
            - {{ printf "--changes-managed=%s" . | quote }}
            {{- end }}
            {{- if .rulerTokenSecret.name }}
            - {{ printf "--changes-ruler-token-file=/var/run/lapilli/changes-ruler/%s" .rulerTokenSecret.key | quote }}
            {{- end }}
            {{- if .lokiTokenSecret.name }}
            - {{ printf "--changes-loki-token-file=/var/run/lapilli/changes-loki/%s" .lokiTokenSecret.key | quote }}
            {{- end }}
            {{- with .awsRole }}
            - {{ printf "--changes-aws-role=%s" . | quote }}
            {{- end }}
            {{- with .azureClientId }}
            - {{ printf "--changes-azure-client-id=%s" . | quote }}
            {{- end }}
            {{- with .googleServiceAccount }}
            - {{ printf "--changes-google-service-account=%s" . | quote }}
            {{- end }}
            {{- if (.ociConfigSecret).name }}
            - --changes-oci-config=/etc/lapilli/oci/config
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $s.rulesHistory.repository }}
            - --rules-history=/var/lib/lapilli-history/versions
            {{- with $s.rulesHistory.select }}
            - {{ printf "--rules-select=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- include "lapilli.args" . | trim | nindent 12 }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: {{ .Values.serve.metricsPort }}
            {{- if include "lapilli.incidentsPort" . }}
            - name: incidents
              containerPort: {{ $s.incidentsAPI.port }}
            {{- end }}
            {{- if (or $s.notificationsAPI.tokenSecret.name $s.notificationsAPI.grafanaSecret.name $s.notificationsAPI.snsTopics) }}
            - name: notifications
              containerPort: {{ $s.notificationsAPI.port }}
            {{- end }}
            {{- if $s.backtest.enabled }}
            - name: backtest
              containerPort: {{ int $s.backtest.port }}
            {{- end }}
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  # Said, not left to the API server's default ("0"): resourceFieldRef
                  # is atomic, so a GitOps diff of the applied fields sees the default
                  # as a change. "1" is the same value, in bytes.
                  divisor: "1"
          # Ready once the first run is done (serve.readinessPath), so a
          # load balancer sends people to a UI with something in it.
          readinessProbe:
            httpGet: {path: {{ $s.readinessPath | default "/readyz" }}, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            {{- include "lapilli.containerSecurity" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if $s.ledger.postgres.secret.name }}
            - name: ledger
              mountPath: /var/run/lapilli/ledger
              readOnly: true
            {{- else }}
            - name: ledger
              mountPath: /var/lib/lapilli
            {{- end }}
            {{- include "lapilli.mounts" . | trim | nindent 12 }}
            {{- if $s.notify.webhookSecret.name }}
            - name: notify
              mountPath: /var/run/lapilli/notify
              readOnly: true
            {{- end }}
            {{- if and $s.signIn.oidc.issuer $s.signIn.oidc.clientSecret.name }}
            - name: oidc
              mountPath: /var/run/lapilli/oidc
              readOnly: true
            {{- end }}
            {{- if and $s.signIn.oidc.issuer (or $s.signIn.sessionKeySecret.name $s.signIn.sessionKeySecret.create) }}
            - name: session-key
              mountPath: /var/run/lapilli/session-key
              readOnly: true
            {{- end }}
            {{- if $s.teamDigests.secretName }}
            - name: team-digests
              mountPath: /var/run/lapilli/team-digests
              readOnly: true
            {{- end }}
            {{- range $i, $d := ($s.reports).destinations }}
            - name: report-dest-{{ $i }}
              mountPath: /var/run/lapilli/report-dests/{{ $i }}
              readOnly: true
            {{- end }}
            {{- range $i, $d := ($s.notify).webhookDests }}
            - name: webhook-dest-{{ $i }}
              mountPath: /var/run/lapilli/webhook-dests/{{ $i }}
              readOnly: true
            {{- end }}
            {{- if $s.incidentsAPI.tokenSecret.name }}
            - name: incidents-token
              mountPath: /var/run/lapilli/incidents-token
              readOnly: true
            {{- end }}
            {{- if $s.firings.tokenSecret.name }}
            - name: firings-token
              mountPath: /var/run/lapilli/firings-token
              readOnly: true
            {{- end }}
            {{- range $src, $rt := (($s.responses).tokenSecrets | default dict) }}
            - name: responses-token-{{ $src }}
              mountPath: {{ printf "/var/run/lapilli/responses-token/%s" $src }}
              readOnly: true
            {{- end }}
            {{- if ($s.responses).configMap.name }}
            - name: responses
              mountPath: /etc/lapilli/responses
              readOnly: true
            {{- end }}
            {{- if $s.trackers.tokenSecret.name }}
            - name: tasks-token
              mountPath: /var/run/lapilli/tasks-token
              readOnly: true
            {{- end }}
            {{- if $s.notificationsAPI.tokenSecret.name }}
            - name: notify-token
              mountPath: /var/run/lapilli/notify-token
              readOnly: true
            {{- end }}
            {{- if $s.onCall.configMap.name }}
            - name: on-call
              mountPath: /etc/lapilli/on-call
              readOnly: true
            {{- end }}
            {{- $am := include "lapilli.alertmanager" $ | fromJson }}
            {{- if or ($am.secret).name ($am.configMap).name }}
            # The whole directory, not a subPath: the kubelet updates it as
            # the Secret or the ConfigMaps change, and serve reads it again
            # each hour.
            - name: alertmanager
              mountPath: /etc/lapilli/alertmanager
              readOnly: true
            {{- end }}
            {{- if $s.config }}
            # The whole directory, not a subPath: the kubelet updates it as
            # the ConfigMap changes.
            - name: config
              mountPath: /etc/lapilli/config
              readOnly: true
            {{- end }}
            {{- if $s.expectations }}
            # The whole directory, as config's.
            - name: expectations
              mountPath: /etc/lapilli/expectations
              readOnly: true
            {{- end }}
            {{- if $promtool.image }}
            - name: promtool
              mountPath: /opt/lapilli-promtool
              readOnly: true
            {{- end }}
            {{- if or $promtool.image $promtool.path }}
            # Where each scenario is run, and promtool writes: the root is
            # read-only.
            - name: scenarios-tmp
              mountPath: /tmp
            {{- end }}
            {{- if ($s.deploys).configMap.name }}
            - name: deploys
              mountPath: /etc/lapilli/deploys
              readOnly: true
            {{- end }}
            {{- if ($s.marked).configMap.name }}
            - name: marked
              mountPath: /etc/lapilli/marked
              readOnly: true
            {{- end }}
            {{- if $s.onCall.secret }}
            - name: on-call-secrets
              mountPath: /var/run/lapilli/on-call
              readOnly: true
            {{- end }}
            {{- if $s.changes.enabled }}
            - name: changes-paused
              mountPath: /var/run/lapilli/changes-paused
              readOnly: true
            {{- if $s.changes.tokenSecret.name }}
            - name: changes-token
              mountPath: /var/run/lapilli/changes-token
              readOnly: true
            {{- end }}
            {{- if $s.changes.grafanaTokenSecret.name }}
            - name: changes-grafana
              mountPath: /var/run/lapilli/changes-grafana
              readOnly: true
            {{- end }}
            {{- if $s.changes.rulerTokenSecret.name }}
            - name: changes-ruler
              mountPath: /var/run/lapilli/changes-ruler
              readOnly: true
            {{- end }}
            {{- if $s.changes.lokiTokenSecret.name }}
            - name: changes-loki
              mountPath: /var/run/lapilli/changes-loki
              readOnly: true
            {{- end }}
            {{- if ($s.changes.ociConfigSecret).name }}
            - name: changes-oci
              mountPath: /etc/lapilli/oci
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $s.notificationsAPI.grafanaSecret.name }}
            - name: notify-grafana
              mountPath: /var/run/lapilli/notify-grafana
              readOnly: true
            {{- end }}
            {{- if $s.backtest.enabled }}
            # Who may ask, read as serve starts; the plain tokens its
            # token_file entries name, read for each request.
            - name: backtest-trust
              mountPath: /etc/lapilli/backtest
              readOnly: true
            {{- $tokens := include "lapilli.backtestTokens" . | fromJson }}
            {{- range $i, $name := keys $tokens | sortAlpha }}
            - name: backtest-token-{{ $i }}
              mountPath: /var/run/lapilli/backtest/tokens/{{ $name }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $s.rulesHistory.repository }}
            - name: rules-history
              mountPath: /var/lib/lapilli-history
              readOnly: true
            {{- end }}
        {{- if include "lapilli.historyFollows" . }}
        {{- include "lapilli.historySidecars" . | nindent 8 }}
        {{- end }}
      volumes:
        - name: ledger
          {{- if $s.ledger.postgres.secret.name }}
          secret:
            secretName: {{ $s.ledger.postgres.secret.name }}
          {{- else if $s.ledger.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $s.ledger.existingClaim }}
          {{- else if $s.ledger.persistence }}
          persistentVolumeClaim:
            claimName: {{ include "lapilli.fullname" . }}-ledger
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "lapilli.volumes" . | trim | nindent 8 }}
        {{- if $s.notify.webhookSecret.name }}
        - name: notify
          secret:
            secretName: {{ $s.notify.webhookSecret.name }}
        {{- end }}
        {{- if and $s.signIn.oidc.issuer $s.signIn.oidc.clientSecret.name }}
        - name: oidc
          secret:
            secretName: {{ $s.signIn.oidc.clientSecret.name }}
        {{- end }}
        {{- if and $s.signIn.oidc.issuer (or $s.signIn.sessionKeySecret.name $s.signIn.sessionKeySecret.create) }}
        - name: session-key
          secret:
            secretName: {{ $s.signIn.sessionKeySecret.name | default (printf "%s-session-key" (include "lapilli.fullname" .)) }}
        {{- end }}
        {{- if $s.teamDigests.secretName }}
        - name: team-digests
          secret:
            secretName: {{ $s.teamDigests.secretName }}
        {{- end }}
        {{- range $i, $d := ($s.reports).destinations }}
        - name: report-dest-{{ $i }}
          secret:
            secretName: {{ $d.secretName }}
            items:
              - key: {{ $d.key | default "url" }}
                path: url
        {{- end }}
        {{- range $i, $d := ($s.notify).webhookDests }}
        - name: webhook-dest-{{ $i }}
          secret:
            secretName: {{ $d.secretName }}
            items:
              - key: {{ $d.key | default "url" }}
                path: url
              {{- with $d.signingKey }}
              - key: {{ . }}
                path: key
              {{- end }}
        {{- end }}
        {{- if $s.incidentsAPI.tokenSecret.name }}
        - name: incidents-token
          secret:
            secretName: {{ $s.incidentsAPI.tokenSecret.name }}
        {{- end }}
        {{- if $s.firings.tokenSecret.name }}
        - name: firings-token
          secret:
            secretName: {{ $s.firings.tokenSecret.name }}
        {{- end }}
        {{- range $src, $rt := (($s.responses).tokenSecrets | default dict) }}
        - name: responses-token-{{ $src }}
          secret:
            secretName: {{ $rt.name }}
            defaultMode: 0440
            items:
              - key: {{ ($rt.key | default "token") | quote }}
                path: {{ ($rt.key | default "token") | quote }}
        {{- end }}
        {{- if ($s.responses).configMap.name }}
        - name: responses
          configMap:
            name: {{ $s.responses.configMap.name }}
        {{- end }}
        {{- if $s.trackers.tokenSecret.name }}
        - name: tasks-token
          secret:
            secretName: {{ $s.trackers.tokenSecret.name }}
        {{- end }}
        {{- if $s.notificationsAPI.tokenSecret.name }}
        - name: notify-token
          secret:
            secretName: {{ $s.notificationsAPI.tokenSecret.name }}
        {{- end }}
        {{- if $s.onCall.configMap.name }}
        - name: on-call
          configMap:
            name: {{ $s.onCall.configMap.name }}
        {{- end }}
        {{- $am := include "lapilli.alertmanager" $ | fromJson }}
        {{- if or ($am.secret).name ($am.configMap).name }}
        # Alertmanager's configuration and its template files, side by
        # side in one directory, as templates: globs are read beside it.
        - name: alertmanager
          projected:
            sources:
              {{- if ($am.secret).name }}
              - secret:
                  name: {{ $am.secret.name | quote }}
              {{- else }}
              - configMap:
                  name: {{ $am.configMap.name | quote }}
              {{- end }}
              {{- range $am.templateConfigMaps }}
              - configMap:
                  name: {{ . | quote }}
              {{- end }}
        {{- end }}
        {{- if $s.config }}
        - name: config
          configMap:
            name: {{ include "lapilli.fullname" . }}-config
        {{- end }}
        {{- if $s.expectations }}
        - name: expectations
          configMap:
            name: {{ include "lapilli.fullname" . }}-expectations
        {{- end }}
        {{- if $promtool.image }}
        - name: promtool
          emptyDir:
            sizeLimit: 512Mi
        {{- end }}
        {{- if or $promtool.image $promtool.path }}
        - name: scenarios-tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- end }}
        {{- if ($s.deploys).configMap.name }}
        - name: deploys
          configMap:
            name: {{ $s.deploys.configMap.name }}
        {{- end }}
        {{- if ($s.marked).configMap.name }}
        - name: marked
          configMap:
            name: {{ $s.marked.configMap.name }}
        {{- end }}
        {{- if $s.onCall.secret }}
        - name: on-call-secrets
          secret:
            secretName: {{ $s.onCall.secret }}
        {{- end }}
        {{- if $s.changes.enabled }}
        # Made by whoever stops changes: while it is there, nothing is
        # carried out. The write credentials are mounted only with changes
        # on.
        - name: changes-paused
          configMap:
            name: {{ include "lapilli.fullname" . }}-changes-paused
            optional: true
        {{- if $s.changes.tokenSecret.name }}
        - name: changes-token
          secret:
            secretName: {{ $s.changes.tokenSecret.name }}
        {{- end }}
        {{- if $s.changes.grafanaTokenSecret.name }}
        - name: changes-grafana
          secret:
            secretName: {{ $s.changes.grafanaTokenSecret.name }}
        {{- end }}
        {{- if $s.changes.rulerTokenSecret.name }}
        - name: changes-ruler
          secret:
            secretName: {{ $s.changes.rulerTokenSecret.name }}
        {{- end }}
        {{- if $s.changes.lokiTokenSecret.name }}
        - name: changes-loki
          secret:
            secretName: {{ $s.changes.lokiTokenSecret.name }}
        {{- end }}
        {{- with $s.changes.ociConfigSecret }}
        {{- if .name }}
        # An OCI config file and the API key it names, for writes: OCI's
        # workload identity has no second identity a pod can take.
        - name: changes-oci
          secret:
            secretName: {{ .name }}
            items:
              - key: {{ .configKey | default "config" }}
                path: config
              - key: {{ .keyKey | default "key.pem" }}
                path: key.pem
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if $s.notificationsAPI.grafanaSecret.name }}
        - name: notify-grafana
          secret:
            secretName: {{ $s.notificationsAPI.grafanaSecret.name }}
        {{- end }}
        {{- if $s.backtest.enabled }}
        - name: backtest-trust
          configMap:
            name: {{ $s.backtest.trust.configMap.name }}
        {{- $tokens := include "lapilli.backtestTokens" . | fromJson }}
        {{- range $i, $name := keys $tokens | sortAlpha }}
        - name: backtest-token-{{ $i }}
          secret:
            secretName: {{ $name }}
            items:
              {{- range index $tokens $name }}
              - key: {{ . }}
                path: {{ . }}
              {{- end }}
        {{- end }}
        {{- end }}
        {{- if $s.rulesHistory.repository }}
        {{- include "lapilli.historyVolumes" . | nindent 8 }}
        {{- end }}
      {{- include "lapilli.placement" . | nindent 6 }}
{{- end }}
