{{- include "lapilli.defaults" . }}
{{- $s := .Values.serve }}
{{- $k := $s.signIn.sessionKeySecret }}
{{- if and (eq .Values.mode "serve") $s.signIn.oidc.issuer (not $k.name) $k.create }}
{{- $name := printf "%s-session-key" (include "lapilli.fullname" .) }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
# The key sessions are signed with: whoever holds it can sign in as anyone.
# Made once, at random, and kept: across upgrades (the chart reads it back
# from the cluster) and when the release is uninstalled. Delete it to sign
# everyone out.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $old $old.data (index $old.data "session-key") }}
  session-key: {{ index $old.data "session-key" }}
  {{- else }}
  session-key: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
