{{- if .Values.telemetry.serviceMonitor.enabled }}
{{- /* A Service for the metrics port, and a Prometheus Operator ServiceMonitor for it.
       Off by default: the ServiceMonitor CRD may not exist. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lapilli.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels: {{- include "lapilli.labels" . | nindent 4 }}
spec:
  selector: {{- include "lapilli.selectorLabels" . | nindent 4 }}
  ports:
    - name: http-metrics
      port: 8081
      targetPort: health
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lapilli.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "lapilli.labels" . | nindent 4 }}
    {{- with .Values.telemetry.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  selector:
    matchLabels: {{- include "lapilli.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ .Values.telemetry.serviceMonitor.interval }}
{{- end }}
