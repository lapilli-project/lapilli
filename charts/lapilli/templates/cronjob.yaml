{{- include "lapilli.checks" . }}
{{- if eq .Values.mode "cronjob" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  {{- with .Values.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      # --timeout, and ten minutes to report and send
      activeDeadlineSeconds: {{ mul (add (int .Values.timeoutMinutes) 10) 60 }}
      template:
        metadata:
          {{- include "lapilli.podMeta" . | nindent 10 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "lapilli.serviceAccountName" . }}
          # A cloud's workload identity needs the service account's token.
          automountServiceAccountToken: {{ or (not (empty .Values.gcpProject)) (not (empty .Values.prometheus.auth)) }}
          securityContext:
            {{- include "lapilli.podSecurity" . | nindent 12 }}
          containers:
            - name: lapilli
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - verdict
                - {{ printf "--since=%s" .Values.since | quote }}
                - {{ printf "--timeout=%dm" (int .Values.timeoutMinutes) | quote }}
                {{- include "lapilli.args" . | trim | nindent 16 }}
                {{- with .Values.report.pushgateway }}
                - {{ printf "--push=%s/metrics/job/lapilli/instance/%s-%s" (trimSuffix "/" .) $.Release.Namespace $.Release.Name | quote }}
                {{- end }}
                {{- range .Values.extraArgs }}
                - {{ . | quote }}
                {{- end }}
              env:
                # Keep the Go heap under the container's memory limit.
                - name: GOMEMLIMIT
                  valueFrom:
                    resourceFieldRef:
                      resource: limits.memory
              securityContext:
                {{- include "lapilli.containerSecurity" . | nindent 16 }}
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                {{- include "lapilli.mounts" . | trim | nindent 16 }}
          volumes:
            {{- include "lapilli.volumes" . | trim | nindent 12 }}
          {{- include "lapilli.placement" . | nindent 10 }}
{{- end }}
