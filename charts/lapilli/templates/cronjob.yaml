{{- $p := .Values.prometheus -}}
{{- if eq (empty $p.url) (empty .Values.gcpProject) }}
{{- fail "give one of prometheus.url and gcpProject" }}
{{- end }}
{{- if and $p.auth (not (has $p.auth (list "aws" "azure" "google"))) }}
{{- fail "prometheus.auth: aws, azure or google" }}
{{- end }}
{{- if and .Values.gcpProject $p.auth (ne $p.auth "google") }}
{{- fail "gcpProject is Google Cloud's: leave prometheus.auth empty or google" }}
{{- end }}
{{- if and $p.auth $p.tokenSecret.name }}
{{- fail "prometheus.auth and prometheus.tokenSecret don't go together" }}
{{- end }}
{{- $r := .Values.rules -}}
{{- $from := 0 }}
{{- if $r.configMaps }}{{ $from = add1 $from }}{{ end }}
{{- if $r.loaded }}{{ $from = add1 $from }}{{ end }}
{{- if $r.grafana.url }}{{ $from = add1 $from }}{{ end }}
{{- if ne (int $from) 1 }}
{{- fail "rules: give one of rules.configMaps, rules.loaded and rules.grafana.url" }}
{{- end }}
{{- if and (not .Values.incidents) (not .Values.impact) }}
{{- fail "give incidents, impact, or both" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  {{- with .Values.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      # --timeout, and ten minutes to report and send
      activeDeadlineSeconds: {{ mul (add (int .Values.timeoutMinutes) 10) 60 }}
      template:
        metadata:
          labels:
            {{- include "lapilli.labels" . | nindent 12 }}
            {{- range $k, $v := .Values.podLabels }}
            {{ $k }}: {{ $v | toString | quote }}
            {{- end }}
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "lapilli.serviceAccountName" . }}
          # A cloud's workload identity needs the service account's token.
          automountServiceAccountToken: {{ or (not (empty .Values.gcpProject)) (not (empty $p.auth)) }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: lapilli
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - verdict
                - {{ printf "--since=%s" .Values.since | quote }}
                - {{ printf "--timeout=%dm" (int .Values.timeoutMinutes) | quote }}
                {{- with .Values.report.timeZone | default .Values.timeZone }}
                - {{ printf "--tz=%s" . | quote }}
                {{- end }}
                {{- if $p.url }}
                - {{ printf "--prometheus=%s" $p.url | quote }}
                {{- with $p.auth }}
                - {{ printf "--auth=%s" . | quote }}
                {{- end }}
                {{- with $p.awsRegion }}
                - {{ printf "--aws-region=%s" . | quote }}
                {{- end }}
                {{- if $p.tokenSecret.name }}
                - {{ printf "--bearer-token-file=/var/run/lapilli/token/%s" $p.tokenSecret.key | quote }}
                {{- end }}
                {{- else }}
                - {{ printf "--gcp-project=%s" .Values.gcpProject | quote }}
                {{- end }}
                {{- range $i, $_ := $r.configMaps }}
                - {{ printf "--rules=/etc/lapilli/rules/%d" $i | quote }}
                {{- end }}
                {{- if $r.loaded }}
                - --loaded-rules
                {{- end }}
                {{- with $r.grafana.url }}
                - {{ printf "--grafana=%s" . | quote }}
                {{- end }}
                {{- if and $r.grafana.url $r.grafana.tokenSecret.name }}
                - {{ printf "--grafana-token-file=/var/run/lapilli/grafana/%s" ($r.grafana.tokenSecret.key | default "token") | quote }}
                {{- end }}
                {{- if .Values.incidents }}
                - --incidents=/etc/lapilli/incidents/incidents.yaml
                {{- end }}
                {{- with .Values.impact }}
                - {{ printf "--impact=%s" . | quote }}
                {{- end }}
                {{- range .Values.match }}
                - {{ printf "--match=%s" . | quote }}
                {{- end }}
                {{- with .Values.report.pushgateway }}
                - {{ printf "--push=%s/metrics/job/lapilli/instance/%s-%s" (trimSuffix "/" .) $.Release.Namespace $.Release.Name | quote }}
                {{- end }}
                {{- if .Values.report.slackWebhookSecret.name }}
                - {{ printf "--slack-webhook-file=/var/run/lapilli/slack/%s" .Values.report.slackWebhookSecret.key | quote }}
                {{- end }}
                {{- range .Values.extraArgs }}
                - {{ . | quote }}
                {{- end }}
              env:
                # Keep the Go heap under the container's memory limit.
                - name: GOMEMLIMIT
                  valueFrom:
                    resourceFieldRef:
                      resource: limits.memory
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                {{- range $i, $_ := .Values.rules.configMaps }}
                - name: rules-{{ $i }}
                  mountPath: /etc/lapilli/rules/{{ $i }}
                  readOnly: true
                {{- end }}
                {{- if .Values.incidents }}
                - name: incidents
                  mountPath: /etc/lapilli/incidents
                  readOnly: true
                {{- end }}
                {{- if $p.tokenSecret.name }}
                - name: token
                  mountPath: /var/run/lapilli/token
                  readOnly: true
                {{- end }}
                {{- if and $r.grafana.url $r.grafana.tokenSecret.name }}
                - name: grafana-token
                  mountPath: /var/run/lapilli/grafana
                  readOnly: true
                {{- end }}
                {{- if .Values.report.slackWebhookSecret.name }}
                - name: slack
                  mountPath: /var/run/lapilli/slack
                  readOnly: true
                {{- end }}
          volumes:
            {{- range $i, $name := .Values.rules.configMaps }}
            - name: rules-{{ $i }}
              configMap:
                name: {{ $name }}
            {{- end }}
            {{- if .Values.incidents }}
            - name: incidents
              configMap:
                name: {{ include "lapilli.fullname" . }}-incidents
            {{- end }}
            {{- if $p.tokenSecret.name }}
            - name: token
              secret:
                secretName: {{ $p.tokenSecret.name }}
            {{- end }}
            {{- if and $r.grafana.url $r.grafana.tokenSecret.name }}
            - name: grafana-token
              secret:
                secretName: {{ $r.grafana.tokenSecret.name }}
            {{- end }}
            {{- if .Values.report.slackWebhookSecret.name }}
            - name: slack
              secret:
                secretName: {{ .Values.report.slackWebhookSecret.name }}
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
