{{- if and (eq .Values.mode "serve") .Values.serve.networkPolicy.enabled }}
{{- if not .Values.serve.networkPolicy.from }}
{{- fail "serve.networkPolicy.from: name who may reach lapilli serve, the sign-in proxy; empty would be everyone. Prometheus goes in metricsFrom, to the metrics port alone" }}
{{- end }}
# Only those named may reach lapilli serve: the headers it takes people's
# names and groups from are then only the sign-in proxy's. Prometheus, in
# metricsFrom, reaches /metrics and the health checks, and nothing else; a job
# in incidentsAPI.from reaches the port that takes incidents, and nothing else;
# an alert manager in notificationsAPI.from, the port that takes
# notifications.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      {{- include "lapilli.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.serve.networkPolicy.from | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- with .Values.serve.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
    {{- if and (or .Values.serve.incidentsAPI.tokenSecret.name .Values.serve.firings.tokenSecret.name) .Values.serve.incidentsAPI.from }}
    - from:
        {{- toYaml .Values.serve.incidentsAPI.from | nindent 8 }}
      ports:
        - port: incidents
          protocol: TCP
    {{- end }}
    {{- if and (or .Values.serve.notificationsAPI.tokenSecret.name .Values.serve.notificationsAPI.grafanaSecret.name .Values.serve.notificationsAPI.snsTopics) .Values.serve.notificationsAPI.from }}
    - from:
        {{- toYaml .Values.serve.notificationsAPI.from | nindent 8 }}
      ports:
        - port: notifications
          protocol: TCP
    {{- end }}
{{- end }}
