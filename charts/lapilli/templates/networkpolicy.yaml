{{- include "lapilli.defaults" . }}
{{- if and (eq .Values.mode "serve") .Values.serve.networkPolicy.enabled }}
{{- if not .Values.serve.networkPolicy.from }}
{{- fail "serve.networkPolicy.from: name who may reach lapilli serve's UI: the sign-in proxy, the ingress controller's or the Gateway's pods, or a load balancer's addresses (ipBlock); empty would be everyone. Prometheus goes in metricsFrom, to the metrics port alone" }}
{{- end }}
# Only those named may reach lapilli serve's UI: the sign-in proxy, whose
# headers then alone name people, or the ingress controller, the Gateway
# or the load balancer in front of a sign-in of lapilli's own. Prometheus, in
# metricsFrom, reaches /metrics and the health checks, and nothing else; a job
# in incidentsAPI.from (and the chart's trackers job) reaches the port that
# takes incidents, firings and tasks, and nothing else;
# an alert manager in notificationsAPI.from, the port that takes
# notifications.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      {{- include "lapilli.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.serve.networkPolicy.from | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- with .Values.serve.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
    {{- $t := .Values.serve.trackers }}
    {{- $job := and $t.tokenSecret.name $t.tracker }}
    {{- if and (include "lapilli.incidentsPort" .) (or .Values.serve.incidentsAPI.from $job) }}
    - from:
        {{- with .Values.serve.incidentsAPI.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $job }}
        # The chart's own job keeping tasks in step with a tracker.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: trackers
        {{- end }}
      ports:
        - port: incidents
          protocol: TCP
    {{- end }}
    {{- if and (or .Values.serve.notificationsAPI.tokenSecret.name .Values.serve.notificationsAPI.grafanaSecret.name .Values.serve.notificationsAPI.snsTopics) .Values.serve.notificationsAPI.from }}
    - from:
        {{- toYaml .Values.serve.notificationsAPI.from | nindent 8 }}
      ports:
        - port: notifications
          protocol: TCP
    {{- end }}
{{- end }}
{{- $e := .Values.serve.networkPolicy.egress }}
{{- if and (eq .Values.mode "serve") $e.enabled }}
{{- if not $e.to }}
{{- fail "serve.networkPolicy.egress.to: name where lapilli serve may connect, as NetworkPolicy egress rules: its Prometheus, the rules' API, Slack and the webhooks, a cloud's APIs. Empty, it could reach nothing but DNS" }}
{{- end }}
---
# Where lapilli serve, and its rules history's containers, may
# connect: the cluster's DNS, and those named in egress.to. Nothing else,
# a cloud's metadata server (169.254.169.254) and the Kubernetes API among
# them, unless named.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lapilli.fullname" . }}-egress
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      {{- include "lapilli.selector" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- if $e.dns }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- toYaml $e.to | nindent 4 }}
{{- end }}
