{{- include "lapilli.defaults" . }}
{{- if eq .Values.mode "serve" }}
{{- $s := .Values.serve }}
{{- $svc := $s.service }}
{{- $type := $svc.type | default "ClusterIP" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
spec:
  # Inside the cluster: every port, as jobs, alert managers and Prometheus
  # reach them. The UI outside it is FULLNAME-ui's (serve.service.type).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "lapilli.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ $s.port }}
      targetPort: http
    {{- include "lapilli.innerPorts" . | nindent 4 }}
{{- if ne $type "ClusterIP" }}
---
# The UI outside the cluster, alone: a load balancer's or a node's port.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lapilli.fullname" . }}-ui
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $type }}
  {{- if eq $type "LoadBalancer" }}
  {{- with $svc.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  {{- with $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- with $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "lapilli.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port | default 80 }}
      targetPort: http
      {{- with $svc.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
---
{{- if and .Values.serve.ledger.persistence (not .Values.serve.ledger.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lapilli.fullname" . }}-ledger
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
  annotations:
    # The ledger outlives the release unless deleted by hand.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.serve.ledger.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.serve.ledger.size }}
{{- end }}
{{- if .Values.serve.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
    {{- with .Values.serve.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serve.serviceMonitor.interval }}
{{- end }}
{{- end }}
