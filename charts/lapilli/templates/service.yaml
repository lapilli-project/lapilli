{{- if eq .Values.mode "serve" }}
{{- $s := .Values.serve }}
{{- $svc := $s.service }}
{{- $type := $svc.type | default "ClusterIP" }}
{{- $outside := ne $type "ClusterIP" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Inside the cluster unless serve.service.type says otherwise: then the
  # UI's port alone, which signs people in, and the rest on -internal.
  type: {{ $type }}
  {{- if eq $type "LoadBalancer" }}
  {{- with $svc.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  {{- with $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- if and $outside $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $svc.externalTrafficPolicy }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "lapilli.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.serve.port }}
      targetPort: http
      {{- if and $outside $svc.nodePort }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
    {{- if not $outside }}
    {{- include "lapilli.innerPorts" . | nindent 4 }}
    {{- end }}
{{- if $outside }}
---
# The ports beside the UI's, inside the cluster: metrics, and those that
# take what jobs and alert managers send with a token.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lapilli.fullname" . }}-internal
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "lapilli.selector" . | nindent 4 }}
  ports:
    {{- include "lapilli.innerPorts" . | nindent 4 }}
{{- end }}
---
{{- if and .Values.serve.ledger.persistence (not .Values.serve.ledger.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lapilli.fullname" . }}-ledger
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
  annotations:
    # The ledger outlives the release unless deleted by hand.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.serve.ledger.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.serve.ledger.size }}
{{- end }}
{{- if .Values.serve.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
    {{- with .Values.serve.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serve.serviceMonitor.interval }}
{{- end }}
{{- end }}
