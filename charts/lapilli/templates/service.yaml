{{- if eq .Values.mode "serve" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
spec:
  # Inside the cluster only: lapilli serve has no sign-in of its own.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "lapilli.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.serve.port }}
      targetPort: http
    # /metrics and the health checks, alone: what Prometheus needs.
    - name: metrics
      port: {{ .Values.serve.metricsPort }}
      targetPort: metrics
    {{- if include "lapilli.incidentsPort" . }}
    # Incidents, firings, tasks and changes, each with a token, alone: what
    # jobs copying them, keeping tasks in step with a tracker, and the change
    # recipes need.
    - name: incidents
      port: {{ .Values.serve.incidentsAPI.port }}
      targetPort: incidents
    {{- end }}
    {{- if (or .Values.serve.notificationsAPI.tokenSecret.name .Values.serve.notificationsAPI.grafanaSecret.name .Values.serve.notificationsAPI.snsTopics) }}
    # Notifications as alert managers sent them, alone.
    - name: notifications
      port: {{ .Values.serve.notificationsAPI.port }}
      targetPort: notifications
    {{- end }}
---
{{- if and .Values.serve.ledger.persistence (not .Values.serve.ledger.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lapilli.fullname" . }}-ledger
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
  annotations:
    # The ledger outlives the release unless deleted by hand.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.serve.ledger.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.serve.ledger.size }}
{{- end }}
{{- if .Values.serve.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lapilli.fullname" . }}
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
    {{- with .Values.serve.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  sampleLimit: {{ int .Values.serve.serviceMonitor.sampleLimit }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serve.serviceMonitor.interval }}
      # The rules' team label is lapilli's own: kept, not renamed to
      # exported_team beside a target label of the same name.
      honorLabels: true
{{- end }}
{{- end }}
