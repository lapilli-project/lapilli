{{- include "lapilli.defaults" . }}
{{- if .Values.incidents }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lapilli.fullname" . }}-incidents
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
data:
  incidents.yaml: |
    {{- dict "incidents" .Values.incidents | toYaml | nindent 4 }}
{{- end }}
{{- if kindIs "map" .Values.impact }}
---
# The named impact signals and the rule entries (docs/design/signals.md),
# as --impact-file reads them: impact given as a mapping, with signals and
# rules under it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lapilli.fullname" . }}-impact
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
data:
  impact.yaml: |
    {{- dict "impact" .Values.impact | toYaml | nindent 4 }}
{{- end }}
{{- if and (eq .Values.mode "serve") .Values.serve.rulesHistory.repository }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lapilli.fullname" . }}-rules-history
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
data:
  # recipes/versions/git.sh and follow.sh, as the containers run them.
  git.sh: |
    {{- .Files.Get "files/versions-git.sh" | trimSuffix "\n" | nindent 4 }}
  follow.sh: |
    {{- .Files.Get "files/versions-follow.sh" | trimSuffix "\n" | nindent 4 }}
{{- end }}
{{- if and (eq .Values.mode "serve") .Values.serve.config }}
---
# What serve.config declares (docs/design/serveops.md): read again as it
# changes, through the file the kubelet swaps in place.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lapilli.fullname" . }}-config
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
data:
  {{- if kindIs "string" .Values.serve.config }}
  # As written: Helm doesn't read it. The indentation said (2, past the
  # key's), so a first line indented more than the rest is kept as it is.
  config.yaml: |2
    {{- .Values.serve.config | trimSuffix "\n" | nindent 4 }}
  {{- else }}
  config.yaml: |
    {{- toYaml .Values.serve.config | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and (eq .Values.mode "serve") .Values.serve.expectations }}
---
# What serve.expectations holds the rules to (docs/design/expectations.md):
# read again as it changes, through the file the kubelet swaps in place,
# as serve.config is.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lapilli.fullname" . }}-expectations
  labels:
    {{- include "lapilli.labels" . | nindent 4 }}
data:
  {{- if kindIs "string" .Values.serve.expectations }}
  expectations.yaml: |2
    {{- .Values.serve.expectations | trimSuffix "\n" | nindent 4 }}
  {{- else }}
  expectations.yaml: |
    {{- toYaml .Values.serve.expectations | nindent 4 }}
  {{- end }}
  {{- /* The scenarios' test files, beside it: a scenario's path is its
  name. */}}
  {{- range $name, $body := .Values.serve.scenarios }}
  {{- if or (eq $name "expectations.yaml") (not (regexMatch "^[-._a-zA-Z0-9]+$" $name)) }}
  {{- fail (printf "serve.scenarios: %q: want a file's name of letters, digits, -, _ and ., not expectations.yaml" $name) }}
  {{- end }}
  {{ $name }}: |2
    {{- $body | toString | trimSuffix "\n" | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.serve.scenarios (not .Values.serve.expectations) }}
{{- fail "serve.scenarios are the test files serve.expectations names: give serve.expectations" }}
{{- end }}
