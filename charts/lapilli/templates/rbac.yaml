{{- $fullname := include "lapilli.fullname" . -}}
{{- $collectorRules := list
  (dict "apiGroups" (list "") "resources" (list "pods" "pods/log" "events") "verbs" (list "get" "list" "watch"))
  (dict "apiGroups" (list "apps") "resources" (list "replicasets" "deployments" "statefulsets" "daemonsets" "controllerrevisions") "verbs" (list "get" "list" "watch")) -}}
# Read-only access to exactly what the collectors read — explicit resources, never "*",
# and no Secrets (DESIGN §7).
{{- if .Values.diffs.configMaps }}
{{- if empty .Values.watchNamespaces }}
{{- fail "diffs.configMaps needs watchNamespaces: a cluster-wide `get configmaps` would reach kube-system and every tenant's config" }}
{{- end }}
{{- if has "kube-system" .Values.watchNamespaces }}
{{- fail "diffs.configMaps: kube-system may not be in watchNamespaces" }}
{{- end }}
{{- $collectorRules = append $collectorRules (dict "apiGroups" (list "") "resources" (list "configmaps") "verbs" (list "get")) }}
{{- end }}
{{- if empty .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-collector
  labels: {{- include "lapilli.labels" . | nindent 4 }}
rules: {{- toYaml $collectorRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-collector
  labels: {{- include "lapilli.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-collector
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-collector
  namespace: {{ . }}
  labels: {{- include "lapilli.labels" $ | nindent 4 }}
rules: {{- toYaml $collectorRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-collector
  namespace: {{ . }}
  labels: {{- include "lapilli.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-collector
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
---
# Control: the CRs Lapilli owns, in its own namespace. Secret access only for the signing key
# and the object-store credentials the admin named, by resourceNames.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "lapilli.labels" . | nindent 4 }}
rules:
  - apiGroups: ["lapilli.dev"]
    resources: ["incidentcaptures", "incidentcaptures/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # CaptureProfiles are READ ONLY, and deliberately a rule of their own. They used to share the
  # write verbs above, which the controller never issues: `reconcile.rs` only ever `.get`s a
  # profile, and the permission self-check's own table asks for `verbs: &["get"]`
  # (`perms.rs`). The grant mattered because a profile is policy, not data — a compromised
  # controller could have set `redaction.mode: off` on it, or pointed `notify.route` at another
  # team's channel, which is the exact escalation `crd.rs` says editing a profile must not allow.
  # The chart still creates and updates the profile; that is Helm's credentials, not these.
  - apiGroups: ["lapilli.dev"]
    resources: ["captureprofiles"]
    verbs: ["get"]
  {{- $secrets := list }}
  {{- if eq .Values.signing.mode "static" }}
  {{- $secrets = append $secrets (required "signing.keySecret is required when signing.mode=static" .Values.signing.keySecret) }}
  {{- end }}
  {{- range .Values.export.destinations }}
  {{- if .credentialsSecret }}
  {{- $secrets = append $secrets .credentialsSecret }}
  {{- end }}
  {{- end }}
  {{- with $secrets }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ toJson (uniq .) }}
    verbs: ["get"]
  {{- end }}
  # Events about exports that were refused, conflicted, or gave up.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "lapilli.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ .Release.Namespace }}
