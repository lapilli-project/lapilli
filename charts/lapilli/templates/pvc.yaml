{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lapilli.fullname" . }}-bundles
  namespace: {{ .Release.Namespace }}
  labels: {{- include "lapilli.labels" . | nindent 4 }}
  annotations:
    # Evidence outlives the release: `helm uninstall` must not delete the bundles.
    helm.sh/resource-policy: keep
spec:
  accessModes: {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
