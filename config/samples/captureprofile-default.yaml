apiVersion: kairn.dev/v1alpha1
kind: CaptureProfile
metadata:
  name: default
  namespace: kairn-system
spec:
  preSeconds: 300
  postSeconds: 300
  collectors: ["logs"]
  export:
    path: /var/lib/kairn/bundles
  signing:
    mode: none # v0.1 default; set to "static" + keySecret for opt-in signing
