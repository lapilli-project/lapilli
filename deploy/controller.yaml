apiVersion: apps/v1
kind: Deployment
metadata:
  name: kairn-controller
  namespace: kairn-system
  labels: { app.kubernetes.io/name: kairn }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kairn }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kairn }
    spec:
      serviceAccountName: kairn-controller
      containers:
        - name: controller
          image: kairn-controller:dev # kind load docker-image; SHA-tagged in CI
          imagePullPolicy: IfNotPresent
          args: ["run"]
          env:
            - name: KAIRN_NAMESPACE
              value: kairn-system
            - name: KAIRN_CLUSTER_ID
              value: kind-kairn
            - name: KAIRN_PROFILE
              value: default
            - name: RUST_LOG
              value: info,kube=warn
          ports:
            - name: webhook
              containerPort: 8080
          volumeMounts:
            - name: bundles
              mountPath: /var/lib/kairn/bundles
            - name: tmp
              mountPath: /tmp # writable scratch for `kairn verify` unpacking (RO rootfs)
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: bundles
          emptyDir: {} # v0.1 demo; a real PVC (WORM-capable) in production — DESIGN §5
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kairn-webhook
  namespace: kairn-system
spec:
  selector: { app.kubernetes.io/name: kairn }
  ports:
    - name: webhook
      port: 8080
      targetPort: webhook
