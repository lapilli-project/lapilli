alloy/payments/rules/0b1c:
    - name: shop
      rules:
        - alert: ScrapeSlow
          expr: scrape_duration_seconds > 1
          for: 1m30s
shop:
    - name: edge
      rules:
        - alert: EdgeDown
          expr: up{job="edge"} == 0
          for: 2m
    - name: shop
      interval: 30s
      rules:
        - alert: ScrapeSlow
          expr: scrape_duration_seconds{job="mimir"}>0.000001
          for: 1m
          labels:
            severity: page
          annotations:
            summary: Scrape slow on {{ $labels.instance }}
        - record: job:up:sum
          expr: sum by (job) (up)
        - alert: TargetDown
          expr: up == 0
          for: 5m
          labels:
            severity: page
solo:
    - name: solo
      rules:
        - alert: SoloDown
          expr: up{job="solo"} == 0
