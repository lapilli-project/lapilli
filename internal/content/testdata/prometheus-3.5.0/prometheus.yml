global:
  scrape_interval: 30s
scrape_configs:
  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: batch
    scrape_interval: 2m
    static_configs:
      - targets: ["batch.invalid:9100"]
  - job_name: node
    static_configs:
      - targets: ["node-1.invalid:9100", "node-2.invalid:9100"]
  # As the Prometheus Operator writes a ServiceMonitor's job: the job label
  # is the service's, not the job's name.
  - job_name: serviceMonitor/shop/checkout/0
    scrape_interval: 1m
    static_configs:
      - targets: ["checkout.invalid:8080"]
    relabel_configs:
      - target_label: job
        replacement: checkout
