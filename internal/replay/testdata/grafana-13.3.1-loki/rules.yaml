apiVersion: 1
groups:
    - orgId: 1
      name: lk
      folder: Logs
      interval: 10s
      rules:
        - uid: lk-instant
          title: LkInstant
          condition: B
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: loki
              model:
                datasource:
                    type: loki
                    uid: loki
                editorMode: code
                expr: sum(count_over_time({app="shop", level="error"}[30s]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 20
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
            summary: LkInstant
          labels:
            team: logs
          isPaused: false
        - uid: lk-instant-nodata
          title: LkInstantNoData
