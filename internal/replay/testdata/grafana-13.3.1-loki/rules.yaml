          condition: C
          data:
            - refId: A
              queryType: range
              relativeTimeRange:
                from: 30
                to: 0
              datasourceUid: loki
              model:
                editorMode: code
                expr: sum(count_over_time({app="shop", level="error"}[$__auto]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: range
                refId: A
                step: 10s
            - refId: B
              datasourceUid: __expr__
              model:
                expression: A
                intervalMs: 1000
