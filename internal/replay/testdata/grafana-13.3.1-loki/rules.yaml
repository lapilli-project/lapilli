            - refId: A
              queryType: range
              relativeTimeRange:
                from: 120
                to: 0
              datasourceUid: loki
              model:
                editorMode: code
                expr: sum(count_over_time({app="shop", level="error"}[30s]))
                intervalMs: 3000
                maxDataPoints: 43200
                queryType: range
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: min
                refId: B
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
