          condition: B
          data:
            - refId: A
              queryType: range
              relativeTimeRange:
                from: 60
                to: 0
              datasourceUid: loki
              model:
                editorMode: code
                expr: sum(count_over_time({app="shop", level="error"}[30s]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: range
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 10
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - A
                      reducer:
                        type: avg
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: classic_conditions
          noDataState: OK
          execErrState: Error
          annotations:
            summary: LkClassic
          labels:
            team: logs
          isPaused: false
        - uid: lk-mixed
          title: LkMixed
          condition: C
