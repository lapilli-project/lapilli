                to: 0
              datasourceUid: loki
              model:
                editorMode: code
                expr: sum(count_over_time({app="shop", level="error"}[30s]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: B
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prom
              model:
                editorMode: code
                expr: vector(1)
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: B
            - refId: C
              datasourceUid: __expr__
              model:
                expression: $A > 20 && $B > 0
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: math
          noDataState: OK
          execErrState: Error
          annotations:
            summary: LkMixed
          labels:
            team: logs
          isPaused: false
        - uid: lk-sql
          title: LkSQL
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: orders
              model:
                format: table
                intervalMs: 1000
                maxDataPoints: 43200
                rawSql: SELECT count(*) FROM failed_orders
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 5
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
