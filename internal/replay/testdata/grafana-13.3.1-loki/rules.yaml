apiVersion: 1
groups:
    - orgId: 1
      name: lk
      folder: Logs
      interval: 10s
      rules:
        - uid: lk-instant
          title: LkInstant
          condition: B
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: loki
              model:
                datasource:
                    type: loki
                    uid: loki
                editorMode: code
                expr: sum(count_over_time({app="shop", level="error"}[30s]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 20
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
            summary: LkInstant
          labels:
            team: logs
          isPaused: false
        - uid: lk-instant-nodata
          title: LkInstantNoData
          condition: B
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: loki
              model:
                editorMode: code
                expr: sum by (app) (count_over_time({level="error"}[1m]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 30
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: NoData
          execErrState: Error
          annotations:
            summary: LkInstantNoData
          labels:
            team: logs
          isPaused: false
        - uid: lk-range-last
          title: LkRangeLast
          condition: C
          data:
            - refId: A
              queryType: range
              relativeTimeRange:
                from: 60
                to: 0
              datasourceUid: loki
              model:
                datasource:
                    type: loki
                    uid: loki
                editorMode: code
                expr: sum(count_over_time({app="shop", level="error"}[30s]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: range
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 20
                        type: gt
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 30s
          annotations:
            summary: LkRangeLast
          labels:
            team: logs
          isPaused: false
        - uid: lk-range-max
          title: LkRangeMax
          condition: C
          data:
            - refId: A
              queryType: range
              relativeTimeRange:
                from: 120
                to: 0
              datasourceUid: loki
              model:
                datasource:
                    type: loki
                    uid: loki
                editorMode: code
                expr: sum(count_over_time({app="shop", level="error"}[30s]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: range
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: max
                refId: B
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 50
                        type: gt
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
            summary: LkRangeMax
          labels:
            team: logs
          isPaused: false
        - uid: lk-range-mean
          title: LkRangeMean
          condition: C
          data:
            - refId: A
              queryType: range
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: loki
              model:
                datasource:
                    type: loki
                    uid: loki
                editorMode: code
                expr: max by (app) (max_over_time({app="api"} | logfmt | unwrap latency_ms [10s]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: range
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: mean
                refId: B
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 250
                        type: gt
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
            summary: LkRangeMean
          labels:
            team: logs
          isPaused: false
        - uid: lk-math
          title: LkMath
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: loki
              model:
                datasource:
                    type: loki
                    uid: loki
                editorMode: code
                expr: sum(rate({app="shop"} |= "error" [1m]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: B
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: loki
              model:
                datasource:
                    type: loki
                    uid: loki
                editorMode: code
                expr: sum(rate({app="shop"}[1m]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: B
            - refId: C
              datasourceUid: __expr__
              model:
                expression: $A / $B > 0.3
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: math
          noDataState: OK
          execErrState: Error
          annotations:
            summary: LkMath
          labels:
            team: logs
          isPaused: false
        - uid: lk-gappy
          title: LkGappy
          condition: B
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: loki
              model:
                datasource:
                    type: loki
                    uid: loki
                editorMode: code
                expr: sum(count_over_time({app="gappy"}[30s]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: NoData
          execErrState: Error
          annotations:
            summary: LkGappy
          labels:
            team: logs
          isPaused: false
        - uid: lk-gappy-keep
          title: LkGappyKeepLast
          condition: B
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: loki
              model:
                editorMode: code
                expr: sum(count_over_time({app="gappy"}[30s]))
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: KeepLast
          execErrState: Error
          annotations:
            summary: LkGappyKeepLast
          labels:
            team: logs
          isPaused: false
    - orgId: 1
