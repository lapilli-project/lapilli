              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prom30
              model:
                expr: vector(1) and on() (count_over_time(vector(1)[$__rate_interval:1s]) > 100)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          dashboardUid: ""
          panelId: 0
          noDataState: OK
          execErrState: Error
          annotations:
            summary: M rate interval ds30
          labels:
            exp: fid2
          isPaused: false
