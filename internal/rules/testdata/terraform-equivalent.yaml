apiVersion: 1
groups:
  - orgId: "1"
    name: checkout
    folder: ops-folder
    interval: 60s
    rules:
      - uid: checkout-errors
        title: Checkout errors high
        condition: C
        for: 5m
        labels: {severity: page, team: shop}
        annotations: {summary: "Checkout errors at {{ $values.C }}"}
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prom-main
            relativeTimeRange: {from: 600, to: 0}
            model: {expr: "sum(rate(checkout_errors_total[5m]))", instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A}
          - refId: B
            datasourceUid: prom-main
            relativeTimeRange: {from: 600, to: 0}
            model: {expr: "sum(rate(checkout_requests_total[5m]))", instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: B}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model: {type: math, expression: "$A / $B > 0.05", intervalMs: 1000, maxDataPoints: 43200, refId: C}
      - uid: checkout-slow
        title: Checkout slow
        condition: C
        for: 10m
        labels: {severity: ticket}
        noDataState: "OK"
        execErrState: Alerting
        isPaused: true
        data:
          - refId: A
            datasourceUid: prom-main
            relativeTimeRange: {from: 600, to: 0}
            model: {expr: "histogram_quantile(0.95, sum by (le) (rate(checkout_seconds_bucket[5m])))", instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A}
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model: {type: reduce, expression: A, reducer: last, intervalMs: 1000, maxDataPoints: 43200, refId: B}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model: {type: threshold, expression: B, conditions: [{evaluator: {params: [2], type: gt}}], intervalMs: 1000, maxDataPoints: 43200, refId: C}
  - orgId: "1"
    name: edge
    folder: ops-folder
    interval: 120s
    rules:
      - uid: edge-down
        title: Edge down
        condition: C
        for: 2m
        labels: {severity: page}
        noDataState: Alerting
        execErrState: Error
        notification_settings: {receiver: pager, group_by: [alertname], group_wait: 30s}
        data:
          - refId: A
            datasourceUid: prom-main
            relativeTimeRange: {from: 600, to: 0}
            model: {expr: 'up{job="edge"}', instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A}
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model: {type: reduce, expression: A, reducer: min, intervalMs: 1000, maxDataPoints: 43200, refId: B}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model: {type: threshold, expression: B, conditions: [{evaluator: {params: [1], type: lt}}], intervalMs: 1000, maxDataPoints: 43200, refId: C}
      - uid: edge-rate
        title: edge requests per second
        data:
          - refId: A
            datasourceUid: prom-main
            relativeTimeRange: {from: 600, to: 0}
            model: {expr: "sum(rate(edge_requests_total[1m]))", instant: true, intervalMs: 1000, maxDataPoints: 43200, refId: A}
        noDataState: NoData
        execErrState: Error
        record: {metric: edge_requests_per_second, from: A, targetDatasourceUid: prom-main}
