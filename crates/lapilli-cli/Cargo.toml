[package]
name = "lapilli"
description = "Lapilli CLI: `lapilli verify` (offline bundle verification), `postmortem`, `mcp`, `demo`, `keygen` and `key fetch`."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# crates.io metadata. The crate and the binary are both `lapilli`: `cargo install lapilli`. The
# directory is `crates/lapilli-cli/` — cargo does not require the two to match, and every path in
# the scripts, workflows and design records uses the directory. `--no-default-features` builds a
# verifier with no network code at all.
readme = "../../README.md"
keywords = ["kubernetes", "incident", "sre", "postmortem", "mcp"]
categories = ["command-line-utilities", "development-tools::debugging"]

[[bin]]
name = "lapilli"
path = "src/main.rs"

[features]
# `lapilli verify s3://… | gs://… | https://…`. Off (`--no-default-features`) builds a
# verifier with no network code at all.
default = ["remote", "mcp"]
remote = ["dep:object_store", "dep:reqwest", "dep:rustls", "dep:tokio", "dep:tokio-util", "dep:futures", "dep:bytes", "dep:http", "dep:lapilli-kms", "dep:lapilli-net"]
# `lapilli mcp`: a stdio Model Context Protocol server over local bundles. Optional for the same
# reason as `remote`: the lean verifier links no protocol stack it does not need.
mcp = ["dep:rmcp", "dep:schemars", "dep:serde", "dep:tokio", "dep:axum", "tokio/net", "tokio/macros", "dep:chrono"]

[dependencies]
lapilli-bundle = { path = "../lapilli-bundle", version = "0.2.0" }
lapilli-kms = { path = "../lapilli-kms", version = "0.2.0", optional = true }
# Lapilli's outbound-HTTP rules (strict URL parsing, no redirects, vetted and pinned
# addresses). Optional with `remote`: without that feature there is nothing to fetch, and
# the point of the lean build is that no HTTP stack is linked in at all.
lapilli-net = { path = "../lapilli-net", version = "0.2.0", optional = true }
clap = { version = "4", features = ["derive", "env"] }
anyhow.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Same TLS arrangement as the controller: rustls with the ring provider, no aws-lc-rs.
object_store = { version = "0.14", default-features = false, features = ["aws-base", "gcp-base", "reqwest", "ring"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
# "time": the per-chunk stall guard on a streamed object body.
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
tokio-util = { version = "0.7", features = ["io", "io-util"], optional = true }
futures = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
# Rendering needs the files themselves. Verification streams and keeps only hashes
# (verify.rs: `Contents` holds path → sha256), so a `.ieb` has to be unpacked to be read.
tempfile = "3"
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server", "macros"], optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"], optional = true }
chrono = { version = "0.4.45", default-features = false, optional = true }
