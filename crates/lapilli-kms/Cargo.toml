[package]
name = "lapilli-kms"
description = "KMS-backed bundle signing for Lapilli: AWS KMS and GCP Cloud KMS, without cloud SDKs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# crates.io metadata. No cloud SDKs: AWS KMS and GCP Cloud KMS over their REST APIs with
# `object_store`'s credential chains, so a published build links neither SDK nor aws-lc-rs.
readme = "../../README.md"
keywords = ["kms", "signing", "ecdsa", "aws", "gcp"]
categories = ["cryptography"]

[dependencies]
lapilli-bundle = { path = "../lapilli-bundle", version = "0.1.0" }
lapilli-net = { path = "../lapilli-net", version = "0.1.0" }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
base64.workspace = true
p256.workspace = true
http = "1"
# Same arrangement as the controller: rustls with the ring provider (installed by the
# binary), SigV4 and token providers from object_store; no aws-lc-rs.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
object_store = { version = "0.14", default-features = false, features = ["aws-base", "gcp-base", "reqwest", "ring"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
