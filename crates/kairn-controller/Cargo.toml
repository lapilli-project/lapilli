[package]
name = "kairn-controller"
description = "Kairn controller: Alertmanager webhook → IncidentCapture CR → collect → seal → export."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kairn-controller"
path = "src/main.rs"

[dependencies]
kairn-bundle = { path = "../kairn-bundle" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
kube = { version = "0.99", default-features = false, features = [
    "runtime",
    "derive",
    "client",
    "rustls-tls",
] }
k8s-openapi = { version = "0.24", features = ["latest"] }
schemars = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.7"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# rustls needs an explicit crypto provider; install ring at startup (kube uses rustls-tls).
rustls = { version = "0.23", features = ["ring"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
