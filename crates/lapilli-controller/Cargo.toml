[package]
name = "lapilli-controller"
description = "Lapilli controller: Alertmanager webhook → IncidentCapture CR → collect → seal → export."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# crates.io metadata. `readme` points at the workspace README because this crate has none of its
# own and the project's story is one story. `keywords`/`categories` exist so the crate is findable
# if it is published; `publish` is deliberately left unset (the default, true) — see ROADMAP for
# the open question of which crate owns the `lapilli` name on crates.io.
readme = "../../README.md"
keywords = ["kubernetes", "incident", "sre", "observability", "evidence"]
categories = ["development-tools::debugging"]

[[bin]]
name = "lapilli-controller"
path = "src/main.rs"

[dependencies]
# `version` alongside `path`: without it `cargo publish` refuses the manifest ("all dependencies
# must have a version requirement specified when publishing"). Workspace builds still resolve
# through `path`; the version is what a published crate would depend on.
lapilli-bundle = { path = "../lapilli-bundle", version = "0.1.0" }
lapilli-kms = { path = "../lapilli-kms", version = "0.1.0" }
lapilli-net = { path = "../lapilli-net", version = "0.1.0" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
kube = { version = "0.99", default-features = false, features = [
    "runtime",
    "derive",
    "client",
    "rustls-tls",
] }
k8s-openapi = { version = "0.24", features = ["v1_30"] }  # oldest tested Kubernetes minor (docs/COMPATIBILITY.md §4)
schemars = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
axum = "0.7"
tower = { version = "0.5", features = ["limit"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# rustls needs an explicit crypto provider; install ring at startup (kube uses rustls-tls).
# `default-features = false` is load-bearing: rustls's defaults are `aws_lc_rs` + `logging` +
# `prefer-post-quantum` + `std` + `tls12`, and `aws_lc_rs` (a C/cmake build, aws-lc-sys) would be
# linked in *alongside* ring — feature-unified into every rustls user in the graph. The features
# below are the defaults minus aws-lc-rs. `prefer-post-quantum` (X25519MLKEM768) is aws-lc-rs-only
# and goes with it: the peers are a Kubernetes API server, a Prometheus, an object store and a KMS,
# and none of them negotiates a PQ hybrid group today — if one ever does, that is a deliberate
# decision to make in `deny.toml`, which bans aws-lc-sys so this cannot come back by accident.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
# Prometheus HTTP API. `rustls-no-provider`: reuse the ring provider main() installs instead
# of pulling aws-lc-rs (a C/cmake build) into the image.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "query", "json"] }
# Object-store export (S3, S3-compatible, GCS). No `aws`/`gcp` features: those pull aws-lc-rs.
# `ring` signs (SigV4 HMAC, GCP RS256). TLS comes from the reqwest dependency above
# (`rustls-no-provider`, same reqwest 0.13) and the ring provider main() installs.
object_store = { version = "0.14", default-features = false, features = ["aws-base", "gcp-base", "reqwest", "ring"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# statvfs, for the bundle volume's free space. Already in the lock via other crates; taken
# directly so the retention preflight does not shell out to `df`, which distroless has not got.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# `start_paused`: the coalescing-window tests advance time instead of sleeping.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
