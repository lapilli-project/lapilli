[package]
name = "lapilli-bundle"
description = "Lapilli Incident Evidence Bundle (IEB): manifest, content hash tree, seal, verify, and cosign-compatible signing. No Kubernetes dependencies — shared by the controller (sealer) and the CLI (verifier)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# crates.io metadata. `readme` points at the workspace README: this crate has no README of its
# own and the project is one story. The bundle format it reads and writes is frozen as
# `lapilli.dev/ieb/v1` from v0.1.0 and specified in `spec/IEB-SPEC.md`, so a third party can
# produce or verify one without this crate at all.
readme = "../../README.md"
keywords = ["kubernetes", "incident", "evidence", "integrity", "signing"]
categories = ["development-tools::debugging", "cryptography"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
p256.workspace = true
ecdsa.workspace = true
base64.workspace = true
tar.workspace = true
zstd.workspace = true
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
