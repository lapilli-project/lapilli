# Backtests the alert rules a pull request changes against your metric
# history, and comments the report on the pull request: github.sh, run in
# GitHub Actions (see README.md here). Check out the pull request first,
# with its merge commit's parents:
#
#   on:
#     pull_request:
#       paths: ['alerts/**']
#   permissions:
#     contents: read
#     pull-requests: write
#   jobs:
#     backtest:
#       # Never for a fork's pull request: it would run with what this job
#       # can reach (README.md, "Pull requests from forks").
#       if: github.event.pull_request.head.repo.full_name == github.repository
#       runs-on: ubuntu-latest # one that can reach your Prometheus
#       steps:
#         - uses: actions/checkout@v4
#           with: {fetch-depth: 2, persist-credentials: false}
#         # Pinned by the commit of the release's tag, which also says the
#         # release of lapilli it installs (version, below).
#         - uses: lapilli-project/lapilli/recipes/backtest@COMMIT # vX.Y.Z
#           with:
#             paths: alerts
#             incidents: incidents.yaml
#             prometheus-url: ${{ vars.PROMETHEUS_URL }}
#             since: 14d
name: Lapilli alert rules backtest
description: Backtest the alert rules a pull request changes against your metric history, and comment the report on the pull request.
author: Lapilli
branding:
  icon: bar-chart-2
  color: gray-dark
inputs:
  version:
    description: The Lapilli release to install, such as v0.48.0, checked against its SHA256SUMS. Default, the release this action is at, the first its own CHANGELOG.md names, so that the commit on the uses line pins the binary too.
    default: ""
  sha256:
    description: The sha256 of the release's archive for the runner (lapilli-VERSION-linux-amd64.tar.gz), pinned, which a release replaced can't match. SHA256SUMS is checked either way. It is one release's; with the uses line moved to another release, nothing is installed until it is changed too.
    default: ""
  paths:
    description: Where the rules are, files or directories in the repository, space-separated. Or render.
    default: ""
  render:
    description: A command that writes the rules on its stdout, run in each commit's files, such as "helm template monitoring charts/monitoring". Or paths.
    default: ""
  render-prepare:
    description: A command run in each commit's files before render, such as "helm dependency build charts/monitoring".
    default: ""
  incidents:
    description: A file of incidents in the repository, read from the commit the pull request goes into, never the pull request's own.
    default: ""
  impact:
    description: A PromQL expression that returns something while users are hurt, such as a 5xx ratio above 1% (--impact); its windows are incidents too, which the rules that differ are judged by. Given to lapilli as one argument, never split or expanded.
    default: ""
  impact-for:
    description: How long impact must last in a series to be an incident (--impact-for), such as 10m; lapilli's default is 5m.
    default: ""
  match:
    description: The labels a firing and an incident must agree on when both have them, comma-separated, such as service (a --match each).
    default: ""
  prometheus-url:
    description: The Prometheus-compatible API the history is read from (--prometheus).
    default: ""
  auth:
    description: The cloud whose managed Prometheus that is, its credentials those the job has (--auth aws, azure or google).
    default: ""
  gcp-project:
    description: Google Cloud Managed Service for Prometheus's project, in place of prometheus-url (--gcp-project).
    default: ""
  aws-region:
    description: The region to sign for, when the URL doesn't say (--aws-region).
    default: ""
  since:
    description: How far back to replay (--since), such as 14d.
    default: 7d
  args:
    description: More of lapilli verdict's flags, split at spaces, such as "--rules-select grafana_alert=1 --tz Asia/Seoul". A file they name in the checkout is refused, as the pull request's. An expression with spaces in it goes in impact.
    default: ""
  target:
    description: The commit the pull request goes into, as the checkout has it. HEAD^1 is the merge commit's first parent.
    default: HEAD^1
  key:
    description: Tells apart the comments of several jobs on one pull request.
    default: default
  fail-on-error:
    description: true fails the step when the backtest does, or a rule that differs couldn't be replayed, whatever why, once the comment says so.
    default: "false"
  expect:
    description: An expectations file in the repository (docs/design/expectations.md), read from both commits; the rules that differ are held to it, and the comment says what the change broke.
    default: ""
  fail-on-expectations:
    description: true fails the step when the change breaks an expectation the rules in place meet, once the comment says which.
    default: "false"
  expect-required:
    description: true fails the step when the change adds a rule no expectation holds.
    default: "false"
  token:
    description: A token that may comment on the pull request.
    default: ${{ github.token }}
  login:
    description: The account the token comments as, for a GitHub App's token (NAME[bot]). GitHub says it for a person's, and the job's own is github-actions[bot].
    default: ""
runs:
  using: composite
  steps:
    - shell: sh
      env:
        # Inputs reach the script as variables, never in its text.
        LAPILLI_INPUT_TOKEN: ${{ inputs.token }}
        LAPILLI_VERSION: ${{ inputs.version }}
        LAPILLI_SHA256: ${{ inputs.sha256 }}
        PATHS: ${{ inputs.paths }}
        RENDER: ${{ inputs.render }}
        RENDER_PREPARE: ${{ inputs.render-prepare }}
        INCIDENTS: ${{ inputs.incidents }}
        IMPACT: ${{ inputs.impact }}
        IMPACT_FOR: ${{ inputs.impact-for }}
        MATCH: ${{ inputs.match }}
        LAPILLI_PROMETHEUS: ${{ inputs.prometheus-url }}
        LAPILLI_AUTH: ${{ inputs.auth }}
        LAPILLI_GCP_PROJECT: ${{ inputs.gcp-project }}
        LAPILLI_AWS_REGION: ${{ inputs.aws-region }}
        LAPILLI_SINCE: ${{ inputs.since }}
        LAPILLI_ARGS: ${{ inputs.args }}
        TARGET: ${{ inputs.target }}
        KEY: ${{ inputs.key }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        EXPECT: ${{ inputs.expect }}
        FAIL_ON_EXPECTATIONS: ${{ inputs.fail-on-expectations }}
        EXPECT_REQUIRED: ${{ inputs.expect-required }}
        GITHUB_LOGIN: ${{ inputs.login }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -eu
        # The release this action is at: the first CHANGELOG.md names, in
        # the files GitHub fetched for the uses line, when they are
        # Lapilli's (its go.mod says so): at a release's tag, that release;
        # at a commit between two, the one before it. Nothing is asked.
        tree=$GITHUB_ACTION_PATH/../..
        own=
        if [ "$(head -n 1 "$tree/go.mod" 2>/dev/null)" = "module lapilli.dev" ]; then
          own=$(awk 'match($0, /^## \[[0-9]+\.[0-9]+\.[0-9]+\]/) { print "v" substr($0, 5, RLENGTH - 5); exit }' "$tree/CHANGELOG.md" 2>/dev/null || :)
        fi
        if [ -z "$LAPILLI_VERSION" ]; then
          if [ -z "$own" ]; then
            echo "action.yml: give version, the Lapilli release to install: this action's files don't say which release they are" >&2
            exit 1
          fi
          LAPILLI_VERSION=$own
          echo "action.yml: Lapilli $own, the release this action is at" >&2
        elif [ -n "$own" ] && [ "$LAPILLI_VERSION" != "$own" ]; then
          echo "action.yml: version isn't $own, the release this action is at: leave it out, and the uses line pins the release too" >&2
        fi
        export LAPILLI_VERSION
        # The token, in a file only this job's user can read, gone when the
        # step ends; github.sh gives it to curl on stdin.
        umask 077
        GITHUB_TOKEN_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/lapilli-token.XXXXXX")
        trap 'rm -f "$GITHUB_TOKEN_FILE"' EXIT
        printf '%s' "$LAPILLI_INPUT_TOKEN" >"$GITHUB_TOKEN_FILE"
        unset LAPILLI_INPUT_TOKEN
        export GITHUB_TOKEN_FILE
        set --
        [ -z "$LAPILLI_PROMETHEUS" ] || set -- "$@" --prometheus "$LAPILLI_PROMETHEUS"
        [ -z "$LAPILLI_AUTH" ] || set -- "$@" --auth "$LAPILLI_AUTH"
        [ -z "$LAPILLI_GCP_PROJECT" ] || set -- "$@" --gcp-project "$LAPILLI_GCP_PROJECT"
        [ -z "$LAPILLI_AWS_REGION" ] || set -- "$@" --aws-region "$LAPILLI_AWS_REGION"
        [ -z "$LAPILLI_SINCE" ] || set -- "$@" --since "$LAPILLI_SINCE"
        # Split at spaces, never expanded: no *, no $.
        set -f
        # shellcheck disable=SC2086
        set -- "$@" $LAPILLI_ARGS
        set +f
        sh "$GITHUB_ACTION_PATH/github.sh" "$@"
