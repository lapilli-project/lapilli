name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, for vulnerabilities found since the last change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The job names are what the branch ruleset requires; rename them there too.
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go.mod is tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...

  latest-go:
    name: test on the latest Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...

  postgres:
    # The ledger's, serve's and the command's tests with the ledger in
    # Postgres (docs/design/postgres.md): each test's in a schema of its
    # own. The oldest major the PostgreSQL project still supports, and the
    # latest; the images' own collation is en_US.utf8, not C, which the
    # ledger's columns must not depend on. Not a required check: it pulls
    # an image.
    name: tests on Postgres ${{ matrix.major }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: "15"
            image: postgres:15.19@sha256:1aac5b49cefd627f02816141ca4ad012d6cc19460dfe02a9b5168a105be3fc53
          - major: "18"
            image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: lapilli-ci
          POSTGRES_DB: lapilli
        ports:
          - 5432:5432
        # Over TCP: the image's first server, which sets it up, listens on
        # its socket alone, and stops.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d lapilli"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      LAPILLI_TEST_POSTGRES: postgres://postgres:lapilli-ci@127.0.0.1:5432/lapilli?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/ledger ./internal/serve ./cmd/lapilli

  e2e-postgres:
    # lapilli serve on a real Postgres in Docker: firings kept across a
    # restart and a dropped connection, a second serve refused, a SQLite
    # ledger copied in and read back. Not a required check: it pulls an
    # image.
    name: the ledger in a real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/postgres.sh

  e2e:
    # The chart's CronJob on a kind cluster, against a real Prometheus. Not a
    # required check: it pulls images and starts a cluster.
    name: e2e on kind
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/run.sh

  e2e-serve-lb:
    # The chart served at a URL, as a team serves it: on kind, behind a
    # LoadBalancer, Gateway API and an Ingress (cloud-provider-kind), with
    # people signed in by lapilli against a Dex in the cluster, and the
    # NetworkPolicy letting in what is in front. Not a required check: it
    # pulls images and starts a cluster.
    name: serve at a URL on kind
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/serve-lb.sh

  e2e-service:
    # The whole service on kind, as an operations team runs it: a shop
    # whose errors the test turns on and off, Prometheus, Grafana's alert
    # rule sending its notifications to Lapilli, the chart's dashboard in
    # Grafana, Lapilli served at a LoadBalancer with people signed in
    # through Dex; then a scenario of user impact, a re-fire and a firing
    # during a deploy, checked through the load balancer, Grafana's API and
    # a headless Chromium, whose screenshots are kept. Not a required
    # check: it pulls images and starts a cluster.
    name: the whole service on kind
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/service.sh
        env:
          SHOTS: ${{ runner.temp }}/screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: service-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 14

  e2e-signin:
    # lapilli serve's own sign-in against a real Dex in Docker: the
    # authorization code flow, roles from Dex's groups, bearer tokens, a
    # replayed callback, signing out. Not a required check: it pulls an
    # image.
    name: sign-in against Dex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/signin.sh

  e2e-changes:
    # Changes to rules carried out against a real Prometheus, Gitea and
    # Grafana in Docker. Not a required check: it pulls images.
    name: changes on real servers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/changes.sh

  e2e-backtest:
    # Pull request backtests against a real Gitea and Prometheus in Docker:
    # recipes/backtest/gitea.sh comments, edits, and says nothing when no
    # rule changed; Gitea renders what a rule's name holds as text. Not a
    # required check: it pulls images.
    name: pull request backtests on real servers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/backtest.sh

  e2e-loki:
    # Rules written in LogQL replayed against a real Loki and Grafana in
    # Docker, and set beside what they fired. Not a required check: it
    # pulls images, and logs must run for some minutes first.
    name: Loki on real servers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/loki.sh

  e2e-rendered:
    # Rules a chart renders, kept in a real Gitea, replayed against a real
    # Prometheus and followed; the chart's own rules history containers run
    # in Docker. Not a required check: it pulls images. helm and yq are the
    # runner's.
    name: rendered rules on real servers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/rendered.sh

  e2e-dashboard:
    # The chart's Grafana dashboard against a real Grafana and Prometheus
    # scraping a real lapilli serve: every panel's query returns data. Not
    # a required check: it pulls images.
    name: dashboard on real servers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/dashboard.sh

  e2e-ratelimit:
    # Runs at once against a real Prometheus behind nginx's rate limit,
    # answered HTTP 429: every rule replayed, and --max-rate kept under it.
    # Not a required check: it pulls images.
    name: rate limit on real servers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/ratelimit.sh

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # the Go a release is built with
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    # The parsers of what comes from outside (rule files and APIs, what an
    # agent sends over MCP, Grafana expressions, incidents and firings
    # files, what a ruler or a cloud's alarms API answers, a history API's
    # range answers, on-call feeds, a JWKS and a load balancer's signed
    # header), each fuzzed for two minutes: weekly, and when asked.
    name: fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - name: fuzz
        run: |
          set -euo pipefail
          for t in rules:FuzzParse rules:FuzzPick rules:FuzzFromAPI rules:FuzzScope rules:FuzzYAMLValue sse:FuzzParseMath firing:FuzzReadJSONL \
            incident:FuzzIncidents source:FuzzConfigDocs source:FuzzAmazon source:FuzzAzure source:FuzzAlarms prom:FuzzRangeAnswer \
            oncall:FuzzFeed signin:FuzzJWKS signin:FuzzALB; do
            echo "::group::${t}"
            go test -run '^$' -fuzz "^${t#*:}\$" -fuzztime 2m "./internal/${t%%:*}"
            echo "::endgroup::"
          done
