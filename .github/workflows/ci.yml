name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: fmt · clippy · test · signing-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Signing conformance (openssl)
        # Proves the manifest signature is a standard ECDSA-P256-SHA256 DER signature.
        # See spec/IEB-SPEC.md — neutral gate, not tied to a moving cosign CLI version.
        run: ./scripts/verify-conformance.sh

  crd-drift:
    name: CRD manifest matches Rust types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate CRDs and diff against committed manifest
        run: |
          cargo run -q -p kairn-controller -- crdgen > /tmp/crds.json
          diff -u config/crd/crds.json /tmp/crds.json

  e2e-kind:
    name: kind E2E (webhook → capture → seal → verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: kairn
      - name: Run E2E
        # The script creates its own cluster; helm/kind-action just guarantees kind is present.
        run: |
          kind delete cluster --name kairn || true
          test/e2e/run.sh
