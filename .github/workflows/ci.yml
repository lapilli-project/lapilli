name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, for vulnerabilities found since the last change
  workflow_dispatch:

permissions:
  contents: read

# A pull request's run is cancelled by the pull request's next push. Every
# other run (a push to main, the schedule, one asked for) is in a group of
# its own, so none waits for another or is cancelled: in one group a run
# would wait for the one before, and a run waiting be cancelled by the next.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The job names are what the branch ruleset requires; rename them there too.
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go.mod is tidy
        run: go mod tidy -diff
      - run: go vet ./...
      # serve's tests that keep to their own ledger and server run in
      # parallel (internal/serve/parallel_test.go), after those that run
      # alone, as do the command's that keep to their own files and
      # stand-ins (cmd/lapilli/parallel_test.go). Many of them wait more
      # than they work: on a recipe's shell and curl, or on a second to
      # pass. -parallel 8 lets more of them wait at once than a runner has
      # cores: on three cores, serve's package
      # took five minutes rather than seven. They took ten minutes on Linux
      # and eighteen on macOS one at a time, where twenty left a slow
      # runner's package unfinished (11-23): forty, so that a slow runner
      # fails a test, not the clock. No test is bounded by time.
      - run: go test -timeout 40m -parallel 8 ./...

  latest-go:
    name: test on the latest Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - run: go vet ./...
      # serve's tests that keep to their own ledger and server run in
      # parallel (internal/serve/parallel_test.go), after those that run
      # alone, as do the command's that keep to their own files and
      # stand-ins (cmd/lapilli/parallel_test.go). Many of them wait more
      # than they work: on a recipe's shell and curl, or on a second to
      # pass. -parallel 8 lets more of them wait at once than a runner has
      # cores: on three cores, serve's package
      # took five minutes rather than seven. They took ten minutes on Linux
      # and eighteen on macOS one at a time, where twenty left a slow
      # runner's package unfinished (11-23): forty, so that a slow runner
      # fails a test, not the clock. No test is bounded by time.
      - run: go test -timeout 40m -parallel 8 ./...

  postgres:
    # The ledger's, serve's and the command's tests with the ledger in
    # Postgres (docs/design/postgres.md): each test's in a schema of its
    # own. The oldest major the PostgreSQL project still supports, and the
    # latest; the images' own collation is en_US.utf8, not C, which the
    # ledger's columns must not depend on. In two shards each
    # (test/shard.sh), every test in one: serve's alone took some twenty
    # minutes in one job. Not a required check: it pulls an image.
    name: tests on Postgres ${{ matrix.major }}, shard ${{ matrix.shard }} of 2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        major: ["15", "18"]
        shard: [1, 2]
        include:
          - major: "15"
            image: postgres:15.19@sha256:1aac5b49cefd627f02816141ca4ad012d6cc19460dfe02a9b5168a105be3fc53
          - major: "18"
            image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: lapilli-ci
          POSTGRES_DB: lapilli
        ports:
          - 5432:5432
        # Over TCP: the image's first server, which sets it up, listens on
        # its socket alone, and stops.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d lapilli"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      LAPILLI_TEST_POSTGRES: postgres://postgres:lapilli-ci@127.0.0.1:5432/lapilli?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # In one job, serve's tests took seventeen to twenty-one minutes on
      # Postgres (1,284 s on 15 in November 2026); a shard's job takes eight
      # to eleven, fourteen on a slow runner. go test's own limit is still
      # twenty-five, inside the job's thirty.
      - run: test/shard.sh "$SHARD" -timeout 25m
        env:
          SHARD: ${{ matrix.shard }}

  changes:
    # The end-to-end jobs a pull request's changes reach
    # (test/e2e/reached.sh): the merge commit against its first parent,
    # the base it is merged into. On a pull request, a job it doesn't reach
    # is skipped; on main, on the schedule and when asked, every one runs.
    name: the end-to-end jobs a pull request reaches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.reached.outputs.e2e }}
      e2e-replicas: ${{ steps.reached.outputs.e2e-replicas }}
      e2e-serve-lb: ${{ steps.reached.outputs.e2e-serve-lb }}
      e2e-service: ${{ steps.reached.outputs.e2e-service }}
      e2e-postgres: ${{ steps.reached.outputs.e2e-postgres }}
      e2e-signin: ${{ steps.reached.outputs.e2e-signin }}
      e2e-changes: ${{ steps.reached.outputs.e2e-changes }}
      e2e-backtest: ${{ steps.reached.outputs.e2e-backtest }}
      e2e-loki: ${{ steps.reached.outputs.e2e-loki }}
      e2e-rendered: ${{ steps.reached.outputs.e2e-rendered }}
      e2e-dashboard: ${{ steps.reached.outputs.e2e-dashboard }}
      e2e-ratelimit: ${{ steps.reached.outputs.e2e-ratelimit }}
      e2e-compat: ${{ steps.reached.outputs.e2e-compat }}
      e2e-kubernetes: ${{ steps.reached.outputs.e2e-kubernetes }}
      e2e-rollouts: ${{ steps.reached.outputs.e2e-rollouts }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: reached
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --name-only --no-renames HEAD^1 HEAD | tee "$RUNNER_TEMP/changed"
          test/e2e/reached.sh <"$RUNNER_TEMP/changed" | tee -a "$GITHUB_OUTPUT"

  e2e-postgres:
    # lapilli serve on a real Postgres in Docker: firings kept across a
    # restart and a dropped connection, a second serve a replica that
    # follows, a copy out refused while they hold it, a SQLite ledger copied
    # in and read back. Not a required check: it pulls an image.
    name: the ledger in a real Postgres
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-postgres == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/postgres.sh

  e2e-replicas:
    # Three replicas of serve on one Postgres ledger on kind
    # (docs/design/replicas.md): the leader's process killed, another
    # leading within the lease, every notice sent once across it, and a
    # rolling restart the API answers through. Not a required check: it
    # pulls images and starts a cluster.
    name: replicas on kind
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-replicas == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/replicas.sh

  e2e:
    # The chart's CronJob on a kind cluster, against a real Prometheus. Not a
    # required check: it pulls images and starts a cluster.
    name: e2e on kind
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/run.sh

  e2e-serve-lb:
    # The chart served at a URL, as a team serves it: on kind, behind a
    # LoadBalancer, Gateway API and an Ingress (cloud-provider-kind), with
    # people signed in by lapilli against a Dex in the cluster, and the
    # NetworkPolicy letting in what is in front. Not a required check: it
    # pulls images and starts a cluster.
    name: serve at a URL on kind
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-serve-lb == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/serve-lb.sh

  e2e-service:
    # The whole service on kind, as an operations team runs it: a shop
    # whose errors the test turns on and off, Prometheus, Grafana's alert
    # rule sending its notifications to Lapilli, the chart's dashboard in
    # Grafana, Lapilli served at a LoadBalancer with people signed in
    # through Dex; then a scenario of user impact, a re-fire and a firing
    # during a deploy, checked through the load balancer, Grafana's API and
    # a headless Chromium, whose screenshots are kept. Not a required
    # check: it pulls images and starts a cluster.
    name: the whole service on kind
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-service == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/service.sh
        env:
          SHOTS: ${{ runner.temp }}/screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: service-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 14

  e2e-signin:
    # lapilli serve's own sign-in against a real Dex in Docker: the
    # authorization code flow, roles from Dex's groups, bearer tokens, a
    # replayed callback, signing out. Not a required check: it pulls an
    # image.
    name: sign-in against Dex
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-signin == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/signin.sh

  e2e-changes:
    # Changes to rules carried out against a real Prometheus, Gitea and
    # Grafana in Docker. Not a required check: it pulls images.
    name: changes on real servers
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-changes == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/changes.sh

  e2e-backtest:
    # Pull request backtests against a real Gitea and Prometheus in Docker:
    # recipes/backtest/gitea.sh comments, edits, and says nothing when no
    # rule changed; Gitea renders what a rule's name holds as text. Not a
    # required check: it pulls images.
    name: pull request backtests on real servers
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-backtest == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/backtest.sh

  e2e-loki:
    # Rules written in LogQL replayed against a real Loki and Grafana in
    # Docker, and set beside what they fired; then a change applied and
    # undone through a second Loki's ruler. Not a required check: it pulls
    # images, and logs must run for some minutes first.
    name: Loki on real servers
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-loki == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/loki.sh

  e2e-rendered:
    # Rules a chart renders, kept in a real Gitea, replayed against a real
    # Prometheus and followed; the chart's own rules history containers run
    # in Docker. Not a required check: it pulls images. helm and yq are the
    # runner's.
    name: rendered rules on real servers
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-rendered == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/rendered.sh

  e2e-dashboard:
    # The chart's Grafana dashboard against a real Grafana and Prometheus
    # scraping a real lapilli serve: every panel's query returns data. Not
    # a required check: it pulls images.
    name: dashboard on real servers
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-dashboard == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/dashboard.sh

  e2e-ratelimit:
    # Runs at once against a real Prometheus behind nginx's rate limit,
    # answered HTTP 429: every rule replayed, and --max-rate kept under it.
    # Not a required check: it pulls images.
    name: rate limit on real servers
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-ratelimit == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/ratelimit.sh

  e2e-compat:
    # lapilli verdict and --check-replay against a real Thanos (a sidecar
    # and its query) and a real VictoriaMetrics with vmalert in Docker,
    # beside the Prometheus they read or are written by. Not a required
    # check: it pulls images, and the rules must fire for some minutes
    # first.
    name: Thanos and VictoriaMetrics on real servers
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-compat == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/compat.sh

  e2e-kubernetes:
    # The replay checked against what a real Prometheus fired, on a real
    # rule set: the default alert rules of kube-prometheus-stack on a kind
    # cluster, with failures made on purpose so that some fire and resolve,
    # and `lapilli verdict --check-replay --loaded-rules` over the period
    # (test/e2e/kubernetes-rules.sh). Every firing must be alike. Not a
    # required check: it pulls images, starts a cluster, and waits out the
    # rules' for of 15 minutes (about 40 minutes in all).
    name: Kubernetes's default rules replay as Prometheus fired them
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-kubernetes == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/kubernetes-rules.sh

  e2e-rollouts:
    # The rollouts reader checked against a real kube-state-metrics: a
    # Deployment restarted, scaled and rolled back, a StatefulSet and a
    # DaemonSet changed, an autoscaled Deployment scaled by hand and one
    # scaled to 0 and back, on a kind cluster, read by `lapilli verdict
    # --rollouts` (test/e2e/rollouts.sh). Each change must be found as what
    # it was, when it was made. Not a required check: it pulls images, starts
    # a cluster, and waits out four changes four minutes apart (about 35
    # minutes in all).
    name: rollouts read from a real kube-state-metrics
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e-rollouts == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/rollouts.sh

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # the Go a release is built with
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  staticcheck:
    # What go vet doesn't look for: a value never used, code nothing
    # reaches, a call of something deprecated. staticcheck.conf says which
    # checks are left out, and why.
    name: staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

  fuzz:
    # The parsers of what comes from outside (rule files and APIs, what an
    # agent sends over MCP, Grafana expressions, incidents and firings
    # files, what a ruler or a cloud's alarms API answers, a history API's
    # range answers, on-call feeds, a JWKS and a load balancer's signed
    # header), each fuzzed for two minutes: weekly, and when asked.
    name: fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - name: fuzz
        run: |
          set -euo pipefail
          for t in rules:FuzzParse rules:FuzzPick rules:FuzzFromAPI rules:FuzzScope rules:FuzzYAMLValue sse:FuzzParseMath firing:FuzzReadJSONL \
            incident:FuzzIncidents source:FuzzConfigDocs source:FuzzAmazon source:FuzzAzure source:FuzzAlarms prom:FuzzRangeAnswer \
            oncall:FuzzFeed signin:FuzzJWKS signin:FuzzALB; do
            echo "::group::${t}"
            go test -run '^$' -fuzz "^${t#*:}\$" -fuzztime 2m "./internal/${t%%:*}"
            echo "::endgroup::"
          done
