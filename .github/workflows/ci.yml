name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the repo. Nothing publishes, comments or writes a check, so the
# workflow floor is read-only rather than whatever the repository default happens to be. A job
# that ever needs more elevates itself with its own `permissions:` block.
permissions:
  contents: read

# Third-party actions are pinned to a commit with the version in a comment, so a compromised or
# retagged release cannot change what runs here, and Dependabot can still bump them
# (.github/dependabot.yml). `dtolnay/rust-toolchain` is the exception: it publishes no tags, and
# its `stable` / `1.89` branches are force-pushed generated refs whose commits get garbage
# collected. The pin is therefore a commit on `master` — the only durable ref — with the toolchain
# named in `with: toolchain:` instead of in the ref.

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: fmt · clippy · test · signing-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `--locked` on every cargo invocation in this workflow: the committed Cargo.lock is what
      # the image and the release binaries are built from (Dockerfile, release.yml), so it is also
      # what CI must have tested. Without it a manifest change with a stale lock passes here and
      # resolves differently at release time.
      - name: Test
        run: cargo test --workspace --locked

      - name: CLI without network code (`--no-default-features`)
        run: |
          cargo clippy -p lapilli --no-default-features --all-targets --locked -- -D warnings
          cargo test -p lapilli --no-default-features --locked

      - name: Signing conformance (openssl)
        # Proves the manifest signature is a standard ECDSA-P256-SHA256 DER signature.
        # See spec/IEB-SPEC.md — neutral gate, not tied to a moving cosign CLI version.
        run: ./scripts/verify-conformance.sh

      - name: The fixture generator reproduces the committed expected.json
        # Same step as scripts/release-check.sh: a fixture case edited by hand, or a generator
        # change that forgot the committed file, is a drift between what the fixtures claim and
        # what produced them. Only expected.json is compared; the .ieb bytes are frozen.
        run: |
          for dir in test/fixtures/ieb/v*/; do
            release=$(basename "$dir")
            cargo run -q --locked -p lapilli-bundle --example gen_fixtures -- "$RUNNER_TEMP/fixtures/$release" test/fixtures/ieb/keys >/dev/null
            python3 - "$RUNNER_TEMP/fixtures/$release/expected.json" "$dir/expected.json" <<'PY'
          import json, sys
          a, b = (json.load(open(p)) for p in sys.argv[1:])
          sys.exit(0 if a == b else f"{sys.argv[2]} differs from what the generator produces")
          PY
          done
          echo "expected.json matches the generator"

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo check --workspace --all-targets --locked

  supply-chain:
    name: No C crypto stack in the dependency graph (cargo-deny bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustls 0.23's *default* features include aws_lc_rs, so one manifest line missing
      # `default-features = false` links a C/cmake crypto build into the shipped controller
      # alongside ring — which is exactly what `0.1.0-rc.1` shipped. deny.toml bans aws-lc-sys,
      # aws-lc-rs, openssl-sys and native-tls; this job is what makes the ban a gate rather than
      # a comment, and what keeps docs/security-scanning.md's reachability claim true.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          command: check bans
          manifest-path: Cargo.toml
          arguments: --config deny.toml --all-features

  docs:
    name: The published API docs render what they say (rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # docs.rs builds every crate the moment it is published — nobody opts in — so the doc
      # comments are a public surface with no gate on them. They had two defects when the first
      # five crates went up: repo-relative paths (`spec/IEB-SPEC.md`) that resolve in a clone and
      # are dead on docs.rs, and `<n>`/`<b>`/`<a>` placeholders that rustdoc reads as HTML, which
      # renders the rest of a line bold and swallows the next word. `invalid_html_tags` is a
      # warning by default, so nothing said so.
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::invalid_html_tags

  advisories:
    name: No known vulnerability in the dependency graph (cargo-deny advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `deny.toml` asserted in two places that "`cargo audit` is the advisory gate
      # (scripts/release-check.sh)". It was not: every `cargo audit*` string in that script is
      # `cargo auditable build`, which embeds a dependency list in a binary and scans nothing. The
      # two commands differ by one word and by their entire purpose, and the comment made the gap
      # invisible for as long as it existed. The scan was clean when this job was added (343
      # crates, 0 advisories) — which is the point: nobody knew that, because nobody was looking.
      #
      # It was `rustsec/audit-check` for one commit, and that is worth recording rather than
      # quietly replacing: its scan PASSED and the job went red anyway, because the action wants
      # `checks: write` to post its annotation and this workflow grants `contents: read`. A
      # security gate that fails for a permission reason is worse than no gate — it is red on a
      # public repository for a reason unrelated to security, and it teaches every reader to
      # ignore the one job whose red means something.
      #
      # So the gate runs through the cargo-deny action this repository already pins for
      # `check bans`, with `deny.toml` as its configuration: no token, no elevated permission, the
      # same RustSec database, and one fewer third-party action inside the gate that exists to
      # watch the supply chain.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          command: check advisories
          manifest-path: Cargo.toml
          arguments: --config deny.toml --all-features

  dco:
    name: Every commit carries a DCO sign-off
    runs-on: ubuntu-latest
    # Only a pull request has a range of commits to check. A push to `main` has already been
    # merged, and checking it there would report a failure nobody can act on without a rewrite.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge-base needs both sides; a shallow clone has neither.
          fetch-depth: 0
      # `CONTRIBUTING.md` says "unsigned commits cannot be merged" and said it for months with
      # nothing behind it: there was no sign-off check anywhere in this repository, so an unsigned
      # commit could be merged and nothing would notice. Same shape as `deny.toml` naming an
      # advisory gate that did not exist — a claim in the document a contributor reads first.
      #
      # A job rather than the DCO GitHub App: it needs no app installed on the organisation, it is
      # pinned like every other gate here, and it can be a required check.
      - name: Check Signed-off-by on every commit in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base=$(git merge-base "$BASE" "$HEAD")
          missing=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            author=$(git show -s --format='%an <%ae>' "$sha")
            # A merge commit carries no sign-off of its own and is not the contributor's work.
            if [ "$(git rev-list --no-walk --count --merges "$sha")" = "1" ]; then
              echo "skip (merge)  $(git show -s --format='%h %s' "$sha")"
              continue
            fi
            if git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "ok            $(git show -s --format='%h %s' "$sha")"
            else
              echo "MISSING       $(git show -s --format='%h %s' "$sha")"
              echo "              expected a trailer: Signed-off-by: $author"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "$base..$HEAD")
          if [ "$missing" -gt 0 ]; then
            echo
            echo "$missing commit(s) have no DCO sign-off matching their author."
            echo "Add it with:  git commit -s   (or: git rebase --signoff $base)"
            echo "CONTRIBUTING.md explains what signing off certifies."
            exit 1
          fi

  attribution:
    name: Third-party attribution still covers what we ship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `targets:` — the check resolves the graph for all five published targets with
      # `cargo tree --target`, which needs no std installed for any of them.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # THIRD-PARTY-LICENSES.md is generated from Cargo.lock, so the thing most likely to make it
      # stale is not an edit but Dependabot's `cargo` group moving the lock. Run at release time
      # only, that bump would quietly leave a crate whose licence text we no longer distribute.
      - run: ./scripts/attribution-check.sh

  spec-producer:
    name: A bundle built from the spec alone verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Independent producer (Python, no Lapilli code) → lapilli verify
        run: |
          cargo build -q --locked -p lapilli
          python3 test/spec/build_from_spec.py "$RUNNER_TEMP/spec-bundle"
          target/debug/lapilli verify "$RUNNER_TEMP/spec-bundle" --cluster spec-cluster --incident spec-incident

  kms-emulators:
    name: KMS signing against AWS (LocalStack) and GCP (gcp-kms-emulator) emulators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: test/kms/emulators.sh

  crd-drift:
    name: CRD manifest matches Rust types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Regenerate CRDs and diff against committed manifests (source + Helm chart copy)
        run: |
          cargo run -q --locked -p lapilli-controller -- crdgen > /tmp/crds.json
          diff -u config/crd/crds.json /tmp/crds.json
          diff -u charts/lapilli/crds/crds.json /tmp/crds.json

  helm-lint:
    name: Helm chart lint + render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - name: Lint and render the supported value combinations
        run: ./scripts/helm-renders.sh

  alert-rules:
    name: The alert rules in docs/metrics.md actually fire (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: promtool check + unit tests
        # Same step as scripts/release-check.sh. The script runs promtool from the pinned
        # prom/prometheus:v3.5.0 image (PROM_IMAGE), so it needs docker and nothing else.
        run: ./scripts/alert-rules-check.sh

  case-tool:
    name: lapilli-case (Go) · vet · test · shipped cases · no cloud SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The second language in this repository. `stable`, like the Rust jobs: go.mod names the
      # oldest Go that builds it, and what ships is built with the newest.
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Format
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }

      # The Go counterpart of `--locked`: go.mod and go.sum must already be what the code needs.
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # Not only unit tests. Some of them read what the repository ships: every case under cases/
      # must verify and must contain the decisive evidence its answer key names, in the store it
      # names; the frozen metrics must answer with the digits their Prometheus gave; and every
      # recorded run under test/fixtures/case-runs must grade to the result stored beside it.
      - name: Test
        run: go test ./...

      - name: Every shipped case verifies with the built binary
        run: |
          go build -trimpath -o "$RUNNER_TEMP/lapilli-case" ./cmd/lapilli-case
          "$RUNNER_TEMP/lapilli-case" verify cases/*/

      # `lapilli-kms` signs with two clouds' KMS and links neither SDK, and the Go half holds the
      # same line. It is one import away from losing it: Prometheus's top-level `tsdb`
      # package compiles 160 packages of the AWS, Azure and Google SDKs (measured at v0.315.0),
      # which is why internal/metrics evaluates PromQL over a store of its own instead.
      - name: No cloud SDK in the dependency graph
        run: |
          found=$(go list -deps ./... | grep -E '^(github\.com/aws/|github\.com/Azure/|github\.com/AzureAD/|cloud\.google\.com/go|google\.golang\.org/api)' || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::a cloud SDK entered the Go dependency graph"
            exit 1
          fi

      # The Go counterpart of the `advisories` job. Pinned, so that what changes this gate's
      # verdict is an advisory or a dependency, never the scanner.
      - name: No known vulnerability reachable from the code (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  e2e-kind:
    name: kind E2E on the newest tested Kubernetes (1.37)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, 2026-09-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2  # v1.15.0
        with:
          version: v0.33.0
          cluster_name: lapilli
      - name: Run E2E
        # The script creates its own cluster; helm/kind-action just guarantees kind is present.
        run: |
          kind delete cluster --name lapilli || true
          test/e2e/run.sh
