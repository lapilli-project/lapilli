name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: fmt · clippy · test · signing-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: CLI without network code (`--no-default-features`)
        run: |
          cargo clippy -p kairn-cli --no-default-features --all-targets -- -D warnings
          cargo test -p kairn-cli --no-default-features

      - name: Signing conformance (openssl)
        # Proves the manifest signature is a standard ECDSA-P256-SHA256 DER signature.
        # See spec/IEB-SPEC.md — neutral gate, not tied to a moving cosign CLI version.
        run: ./scripts/verify-conformance.sh

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  spec-producer:
    name: A bundle built from the spec alone verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Independent producer (Python, no Kairn code) → kairn verify
        run: |
          cargo build -q -p kairn-cli
          python3 test/spec/build_from_spec.py "$RUNNER_TEMP/spec-bundle"
          target/debug/kairn verify "$RUNNER_TEMP/spec-bundle" --cluster spec-cluster --incident spec-incident

  crd-drift:
    name: CRD manifest matches Rust types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate CRDs and diff against committed manifests (source + Helm chart copy)
        run: |
          cargo run -q -p kairn-controller -- crdgen > /tmp/crds.json
          diff -u config/crd/crds.json /tmp/crds.json
          diff -u charts/kairn/crds/crds.json /tmp/crds.json

  helm-lint:
    name: Helm chart lint + render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render the supported value combinations
        run: ./scripts/helm-renders.sh

  e2e-kind:
    name: kind E2E on the newest tested Kubernetes (1.37)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: kairn
      - name: Run E2E
        # The script creates its own cluster; helm/kind-action just guarantees kind is present.
        run: |
          kind delete cluster --name kairn || true
          test/e2e/run.sh
