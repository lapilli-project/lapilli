name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, for vulnerabilities found since the last change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The job names are what the branch ruleset requires; rename them there too.
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go.mod is tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...

  latest-go:
    name: test on the latest Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...

  e2e:
    # The chart's CronJob on a kind cluster, against a real Prometheus. Not a
    # required check: it pulls images and starts a cluster.
    name: e2e on kind
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/run.sh

  e2e-changes:
    # Changes to rules carried out against a real Prometheus, Gitea and
    # Grafana in Docker. Not a required check: it pulls images.
    name: changes on real servers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: test/e2e/changes.sh

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # the Go a release is built with
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    # The parsers of what comes from outside (rule files and APIs, what an
    # agent sends over MCP, Grafana expressions, incidents and firings
    # files, what a ruler answers), each fuzzed for two minutes: weekly,
    # and when asked.
    name: fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - name: fuzz
        run: |
          set -euo pipefail
          for t in rules:FuzzParse rules:FuzzFromAPI rules:FuzzScope sse:FuzzParseMath firing:FuzzReadJSONL incident:FuzzIncidents \
            source:FuzzConfigDocs source:FuzzAmazon source:FuzzAzure; do
            echo "::group::${t}"
            go test -run '^$' -fuzz "^${t#*:}\$" -fuzztime 2m "./internal/${t%%:*}"
            echo "::endgroup::"
          done
