name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: fmt · clippy · test · signing-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Signing conformance (openssl)
        # Proves the manifest signature is a standard ECDSA-P256-SHA256 DER signature.
        # See spec/IEB-SPEC.md — neutral gate, not tied to a moving cosign CLI version.
        run: ./scripts/verify-conformance.sh

  crd-drift:
    name: CRD manifest matches Rust types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate CRDs and diff against committed manifests (source + Helm chart copy)
        run: |
          cargo run -q -p kairn-controller -- crdgen > /tmp/crds.json
          diff -u config/crd/crds.json /tmp/crds.json
          diff -u charts/kairn/crds/crds.json /tmp/crds.json

  helm-lint:
    name: Helm chart lint + render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/kairn
      - name: Render the supported value combinations
        run: |
          helm template kairn charts/kairn >/dev/null
          helm template kairn charts/kairn --set watchNamespaces='{a,b}' >/dev/null
          helm template kairn charts/kairn --set signing.mode=static --set signing.keySecret=k >/dev/null
          helm template kairn charts/kairn --set persistence.enabled=false >/dev/null
          helm template kairn charts/kairn --set metrics.prometheusUrl=http://prom:9090 | grep -q -- '- metrics'
          # static signing without a key Secret must be refused
          ! helm template kairn charts/kairn --set signing.mode=static >/dev/null 2>&1

  e2e-kind:
    name: kind E2E (kairn demo × 2 scenarios + negative verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: kairn
      - name: Run E2E
        # The script creates its own cluster; helm/kind-action just guarantees kind is present.
        run: |
          kind delete cluster --name kairn || true
          test/e2e/run.sh
