name: release

# Push a tag `vX.Y.Z` to publish, after the release gate passes:
#   ghcr.io/lapilli-project/lapilli-controller:X.Y.Z   (linux/amd64 + linux/arm64, SBOM + provenance)
#   oci://ghcr.io/lapilli-project/charts/lapilli       (chart version = appVersion = X.Y.Z)
#   lapilli CLI binaries + SHA256SUMS          (linux amd64/arm64, macOS arm64)
# Checklist: RELEASE.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/lapilli-project/lapilli-controller
  CHART_REPO: oci://ghcr.io/lapilli-project/charts

jobs:
  gate:
    uses: ./.github/workflows/release-gate.yml

  image:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from tag (v0.1.0 -> 0.1.0, matching the chart's appVersion)
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push (arm64 is emulated, so this is the slow step)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push the chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/lapilli --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/lapilli-$VERSION.tgz" "$CHART_REPO"

  cli:
    needs: gate
    name: lapilli CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-14, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (static on Linux)
        run: cargo build --release --locked -p lapilli-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          name="lapilli-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name" && cp "target/${{ matrix.target }}/release/lapilli" LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: lapilli-*.tar.gz

  publish:
    needs: [image, chart, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum lapilli-*.tar.gz > SHA256SUMS
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "Image: \`${IMAGE}:${VERSION}\` (digest \`${{ needs.image.outputs.digest }}\`)"
            echo "Chart: \`${CHART_REPO}/lapilli --version ${VERSION}\`"
            echo
            echo "Upgrading: apply the CRDs first (Helm does not upgrade crds/):"
            echo "\`kubectl apply --server-side -f https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/config/crd/crds.json\`"
            echo
            # A pre-release (a `-` in the version) has no CHANGELOG section of its own: it ships
            # what [Unreleased] says, and says so.
            case "$VERSION" in
              *-*) echo "**Pre-release.** Not covered by the compatibility promises in docs/COMPATIBILITY.md;"
                   echo "the fixture set and the format are frozen at the first non-pre-release tag."
                   echo
                   SECTION="## [Unreleased]" ;;
              *)   SECTION="## [${VERSION}]" ;;
            esac
            awk -v v="$SECTION" 'index($0, v)==1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: |
            lapilli-*.tar.gz
            SHA256SUMS
