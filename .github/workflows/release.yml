name: release

# Push a tag vX.Y.Z whose section is in CHANGELOG.md. This builds lapilli for
# macOS and Linux, amd64 and arm64; stops if govulncheck finds a known
# vulnerability in the code or the binaries; pushes an image holding the Linux binaries
# to ghcr.io/lapilli-project/lapilli and the Helm chart to
# oci://ghcr.io/lapilli-project/charts/lapilli; attests the archives,
# SHA256SUMS, the chart and the image; and publishes a GitHub release with the
# CHANGELOG section as its notes, and the attestations' Sigstore bundles as
# lapilli-vX.Y.Z.intoto.jsonl, so they can be checked without GitHub's
# attestation store (SECURITY.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      packages: write      # push the image and the chart to ghcr.io
      id-token: write      # the OIDC token attest-build-provenance signs with
      attestations: write  # store the provenance on this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The newest Go, not go.mod's minimum: a binary carries the standard
      # library it was built with, fixes and all.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="lapilli-${tag}-${os}-${arch}"
            mkdir -p "dist/$name"
            # -w without -s: the symbol table stays, so govulncheck
            # -mode=binary can tell which vulnerable functions a binary holds.
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-w -X main.version=${tag}" -o "dist/$name/lapilli" ./cmd/lapilli
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          mkdir -p dist/image
          for arch in amd64 arm64; do
            cp "dist/lapilli-${tag}-linux-${arch}/lapilli" "dist/image/lapilli-linux-${arch}"
          done
          cd dist && sha256sum lapilli-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      # Nothing is published with a known vulnerability in the code it calls
      # or in what each binary holds: its modules and this Go's standard
      # library.
      - name: Vulnerabilities
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck="$(go env GOPATH)/bin/govulncheck"
          "$govulncheck" ./...
          for b in dist/lapilli-*/lapilli; do
            echo "$b"
            "$govulncheck" -mode=binary "$b"
          done
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || { echo "::error::CHANGELOG.md has no section [$version]"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lapilli-project/lapilli:${{ github.ref_name }}
            ghcr.io/lapilli-project/lapilli:latest
          labels: |
            org.opencontainers.image.source=https://github.com/lapilli-project/lapilli
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Judge alert rules against what actually went wrong
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - name: Chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The image Artifact Hub scans for this chart version.
          sed -i "s|ghcr.io/lapilli-project/lapilli:dev$|ghcr.io/lapilli-project/lapilli:${GITHUB_REF_NAME}|" charts/lapilli/Chart.yaml
          grep -q "ghcr.io/lapilli-project/lapilli:${GITHUB_REF_NAME}$" charts/lapilli/Chart.yaml
          helm lint charts/lapilli --set prometheus.url=http://prometheus:9090 \
            --set 'rules.configMaps={rules}' --set impact=up
          helm lint charts/lapilli --set mode=serve --set prometheus.url=http://prometheus:9090 \
            --set 'rules.configMaps={rules}' --set serve.serviceMonitor.enabled=true --set dashboard.enabled=true
          helm package charts/lapilli --destination dist \
            --version "${GITHUB_REF_NAME#v}" --app-version "$GITHUB_REF_NAME"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/lapilli-${GITHUB_REF_NAME#v}.tgz" oci://ghcr.io/lapilli-project/charts
      - id: attest-files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/lapilli-*.tar.gz
            dist/lapilli-*.tgz
            dist/SHA256SUMS
      - id: attest-image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/lapilli-project/lapilli
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      # Each attestation step writes its Sigstore bundle, one JSON object on
      # one line, to a file of its own under RUNNER_TEMP (bundle-path). The
      # two, a line each, are a release asset: OpenSSF Scorecard looks for
      # provenance among a release's assets (*.intoto.jsonl), and
      # `gh attestation verify --bundle` reads a file of several.
      - name: Provenance as a release asset
        env:
          FILES_BUNDLE: ${{ steps.attest-files.outputs.bundle-path }}
          IMAGE_BUNDLE: ${{ steps.attest-image.outputs.bundle-path }}
        run: |
          set -euo pipefail
          out="dist/lapilli-${GITHUB_REF_NAME}.intoto.jsonl"
          cat "$FILES_BUNDLE" "$IMAGE_BUNDLE" > "$out"
          # Two lines, each a Sigstore bundle, or nothing is published.
          test "$(wc -l < "$out")" -eq 2
          jq -e -s 'length == 2 and all(.[]; (.mediaType | startswith("application/vnd.dev.sigstore.bundle")) and .dsseEnvelope.payloadType == "application/vnd.in-toto+json")' "$out" >/dev/null
      # Seven assets: four archives, the chart, SHA256SUMS and the bundles.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file dist/notes.md dist/lapilli-*.tar.gz dist/lapilli-*.tgz dist/SHA256SUMS \
            "dist/lapilli-${GITHUB_REF_NAME}.intoto.jsonl"
