name: release

# Push a tag `vX.Y.Z` to publish:
#   ghcr.io/jmcunst/kairn-controller:X.Y.Z   (linux/amd64 + linux/arm64)
#   oci://ghcr.io/jmcunst/charts/kairn       (chart version = appVersion = X.Y.Z)
# so `helm install kairn oci://ghcr.io/jmcunst/charts/kairn` works with no local build.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jmcunst/kairn-controller
  CHART_REPO: oci://ghcr.io/jmcunst/charts

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from tag (v0.1.0 -> 0.1.0, matching the chart's appVersion)
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push (arm64 is emulated, so this is the slow step)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push the chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/kairn --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/kairn-$VERSION.tgz" "$CHART_REPO"
