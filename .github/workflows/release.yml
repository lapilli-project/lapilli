name: release

# Push a tag vX.Y.Z whose section is in CHANGELOG.md. This builds lapilli for
# macOS and Linux, amd64 and arm64, attests the archives and SHA256SUMS, and
# publishes a GitHub release with the CHANGELOG section as its notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # the OIDC token attest-build-provenance signs with
      attestations: write  # store the provenance on this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The newest Go, not go.mod's minimum: a binary carries the standard
      # library it was built with, fixes and all.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="lapilli-${tag}-${os}-${arch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${tag}" -o "dist/$name/lapilli" .
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          cd dist && sha256sum lapilli-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || { echo "::error::CHANGELOG.md has no section [$version]"; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/lapilli-*.tar.gz
            dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file dist/notes.md dist/lapilli-*.tar.gz dist/SHA256SUMS
