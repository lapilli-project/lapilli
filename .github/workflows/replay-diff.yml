name: replay-diff

# The same command against a cluster and against its frozen copy, output compared
# (test/replay-diff): what kubectl prints, and for a case that has a Prometheus what promq prints
# and what its API sends. It builds three scenarios and two fixtures on kind — one of every kind,
# and a Prometheus that holds more than a scenario's — and takes most of an hour, so it runs when
# what it tests changes, once a week, and on request — not on every pull request, and it is not one
# of the required checks: it pulls images and waits for an incident to form, and a check that can
# fail for the weather should not stand between a typo and `main`.
on:
  pull_request:
    paths:
      - internal/replay/**
      - internal/guard/**
      - internal/freeze/**
      - internal/casefile/**
      - internal/agent/**
      - internal/metrics/**
      - cmd/lapilli-case/**
      - cases/**
      - scenarios/**
      - test/replay-diff/**
      - test/fixtures/case-runs/**
      - .github/workflows/replay-diff.yml
      - go.mod
      - go.sum
  schedule:
    - cron: "17 4 * * 1"   # Mondays: kubectl and the runner image move without a commit here
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: live against frozen, command by command
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The tool under test is built as ci.yml builds it: with the newest Go the runner has, and
      # never an older one than go.mod's `toolchain` line (the reason is there).
      - name: Go, no older than go.mod's toolchain line
        run: |
          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
          GOTOOLCHAIN=auto go version
      # kind only; the sweep creates its own cluster, with its own kubeconfig.
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa  # v1.15.1
        with:
          version: v0.33.0
          install_only: true

      # The snapshot server is someone else's binary. It is taken by digest, so that what changes
      # this job's verdict is this repository or the cluster, never a re-published release.
      - name: crust-gather v0.17.1, by digest
        run: |
          curl -fsSLo "$RUNNER_TEMP/crust-gather.tar.gz" \
            https://github.com/crust-gather/crust-gather/releases/download/v0.17.1/kubectl-crust-gather_0.17.1_linux_amd64.tar.gz
          echo "28b31a4f07072576bae7d6ac3a4f2dd27a06a79f7f04d37a8762b3629ea82283  $RUNNER_TEMP/crust-gather.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crust-gather.tar.gz" -C "$RUNNER_TEMP" kubectl-crust-gather
          echo "LAPILLI_CRUST_GATHER=$RUNNER_TEMP/kubectl-crust-gather" >> "$GITHUB_ENV"

      - name: The comparison calls a difference a difference
        run: python3 test/replay-diff/selftest.py

      # Before a cluster is built: that the evidence of each shipped case is in it is checked by the
      # required checks, and that a command prints it is checked here, where the snapshot server is.
      # Every evidence item names its witness — a kubectl command, or a query — and each is run against
      # the case as it is served, through the guard an agent's kubectl goes through.
      - name: Every evidence item of a shipped case is printed by the command it names
        run: |
          go build -trimpath -o "$RUNNER_TEMP/lapilli-case" ./cmd/lapilli-case
          kubectl version --client
          "$RUNNER_TEMP/lapilli-case" reach --every cases/*/

      - name: Sweep
        run: |
          go build -trimpath -o "$RUNNER_TEMP/lapilli-case" ./cmd/lapilli-case
          LAPILLI_CASE="$RUNNER_TEMP/lapilli-case" test/replay-diff/sweep.sh "$PWD" "$RUNNER_TEMP/replay-diff"

      - name: Reports
        if: always()
        run: |
          # In the log as well as in the summary: a failure should be readable from where it is reported.
          # report.md is what kubectl prints; report-promq.md and report-api.md, where a case has a
          # Prometheus, what promq prints and what its API sends.
          for report in "$RUNNER_TEMP"/replay-diff/*/report*.md; do
            [ -f "$report" ] || continue
            echo "## $(basename "$(dirname "$report")"), $(basename "$report" .md)"
            cat "$report"
            echo
          done | tee -a "$GITHUB_STEP_SUMMARY"
          tail -n 40 "$RUNNER_TEMP/replay-diff/log/sweep.log" || true
