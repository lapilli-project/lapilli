name: pages

# lapilli.dev. site/CNAME must keep saying lapilli.dev: deploy-pages publishes
# whatever is in site/, so deleting it drops the custom domain. DNS is at
# Cloudflare with the proxy off; with the proxy on, GitHub can't issue the
# certificate. docs/ is published at /docs/ (site/docs.sh). A pull request
# that changes any of it builds the site, checks it with axe, and deploys
# nothing. The pages name the latest release, so a release, once published,
# builds and deploys the site again (workflow_run).

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", "docs/*.md", "docs/ko/*.md", "docs/ja/*.md", "internal/serve/static/heebo-*", "test/a11y/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "assets/**", "docs/*.md", "docs/ko/*.md", "docs/ja/*.md", "internal/serve/static/heebo-*", "test/a11y/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # After the release workflow: only a tag's run, not a dry run, and only
    # once it has published.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Copy the brand images, the font and docs/ in, and set baseurl and the version
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp assets/*.png site/
          cp internal/serve/static/heebo-*.woff2 internal/serve/static/OFL-Heebo.txt site/
          [ "$BASE" = "/" ] && BASE=""
          sh site/docs.sh "$BASE"
          echo "baseurl: \"$BASE\"" >> site/_config.yml
          # The header, the front page and the footer name the latest
          # release, and the commands to install it.
          version=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "the latest release is \"$version\", not a version" >&2
            exit 1
          }
          echo "version: \"$version\"" >> site/_config.yml
          # The header links to the front page's sections by their ids, in
          # every language: each translation has the English page's.
          for f in site/*/index.md; do
            grep -q '^lang: ' "$f" || continue
            diff <(grep -o '{#[a-z-]*}' site/index.md) <(grep -o '{#[a-z-]*}' "$f") >/dev/null || {
              echo "$f: its sections' ids aren't site/index.md's" >&2
              exit 1
            }
          done
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0

  # Every page the site's sitemap lists, as built, with axe-core against
  # WCAG 2.2 AA, light and dark, and at 320 CSS px (test/a11y/site.mjs), in
  # the Playwright image test/a11y/axe.sh runs serve's pages in.
  a11y:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Check every page with axe, in light and dark, and at 320 CSS px
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$RUNNER_TEMP/site"
          cd test/a11y
          npm ci --no-audit --no-fund
          SITE_DIR="$RUNNER_TEMP/site" node site.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
