name: pages

# lapilli.dev. site/CNAME must keep saying lapilli.dev: deploy-pages publishes
# whatever is in site/, so deleting it drops the custom domain. DNS is at
# Cloudflare with the proxy off; with the proxy on, GitHub can't issue the
# certificate.

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Copy the brand images in and set baseurl
        run: |
          set -euo pipefail
          cp assets/*.png site/
          BASE='${{ steps.pages.outputs.base_path }}'
          [ "$BASE" = "/" ] && BASE=""
          echo "baseurl: \"$BASE\"" >> site/_config.yml
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
