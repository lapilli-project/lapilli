name: pages

# lapilli.dev. site/CNAME must keep saying lapilli.dev: deploy-pages publishes
# whatever is in site/, so deleting it drops the custom domain. DNS is at
# Cloudflare with the proxy off; with the proxy on, GitHub can't issue the
# certificate.

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - name: Copy the brand images in and set baseurl
        run: |
          set -euo pipefail
          cp assets/*.png site/
          BASE='${{ steps.pages.outputs.base_path }}'
          [ "$BASE" = "/" ] && BASE=""
          echo "baseurl: \"$BASE\"" >> site/_config.yml
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4.0.0

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
