name: sizing

# What a ledger takes on disk and what serve takes in memory, on SQLite and
# on Postgres (internal/serve/sizing_test.go, docs/serve.md "Sizing"), by
# hand: it takes a good while, and the million firings a week more. The
# tables are the run's artifact and its summary.
on:
  workflow_dispatch:
    inputs:
      big:
        description: Add a million firings a week (up to four weeks kept)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sizing:
    name: sizing, SQLite and Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        # The latest major ci.yml tests.
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: lapilli-ci
          POSTGRES_DB: lapilli
        ports:
          - 5432:5432
        # Over TCP: the image's first server, which sets it up, listens on
        # its socket alone, and stops.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d lapilli"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      BIG: ${{ inputs.big }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: SQLite
        run: |
          if [ "$BIG" = true ]; then export LAPILLI_SIZING_BIG=1; fi
          LAPILLI_SIZING=1 LAPILLI_SIZING_OUT="$RUNNER_TEMP/sizing-sqlite.md" \
            go test ./internal/serve -run '^TestSizing$' -v -timeout 120m
      - name: Postgres
        env:
          LAPILLI_TEST_POSTGRES: postgres://postgres:lapilli-ci@127.0.0.1:5432/lapilli?sslmode=disable
        run: |
          if [ "$BIG" = true ]; then export LAPILLI_SIZING_BIG=1; fi
          LAPILLI_SIZING=1 LAPILLI_SIZING_OUT="$RUNNER_TEMP/sizing-postgres.md" \
            go test ./internal/serve -run '^TestSizing$' -v -timeout 120m
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Sizing"
            echo
            echo "Runner: $(nproc) CPUs, $(free -m | awk '/^Mem:/ {print $2}') MB memory, Postgres 18.6 in a service container on the same runner. Million-a-week rows: $BIG."
            for f in sqlite postgres; do
              echo
              echo "### $f"
              echo
              cat "$RUNNER_TEMP/sizing-$f.md" 2>/dev/null || echo "No table: the step did not finish."
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sizing
          path: |
            ${{ runner.temp }}/sizing-sqlite.md
            ${{ runner.temp }}/sizing-postgres.md
          if-no-files-found: warn
