name: release-gate

# End to end on the oldest and newest tested Kubernetes minors (docs/COMPATIBILITY.md §4).
# Run by hand before tagging, and as the first job of the release workflow.

on:
  workflow_dispatch:
  workflow_call:

# This workflow creates kind clusters, pulls images and runs test/e2e/run.sh through third-party
# actions. It publishes nothing, so it gets nothing to publish with — and, because it is also
# called by `release.yml`, declaring the floor here means the gate cannot inherit that workflow's
# write scopes. (A `workflow_call` job can never hold more than its caller grants, but it can hold
# less, and this is where "less" is written down.)
permissions:
  contents: read

jobs:
  e2e:
    name: kind E2E on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Kubernetes 1.30 (oldest tested)
            image: kindest/node:v1.30.0@sha256:047357ac0cfea04663786a612ba1eaba9702bef25227a794b52890dd8bcd692e
          - name: Kubernetes 1.37 (newest tested)
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master, 2026-09-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2  # v1.15.0
        with:
          version: v0.33.0
          cluster_name: lapilli
      - name: Run E2E
        env:
          NODE_IMAGE: ${{ matrix.image }}
        run: |
          kind delete cluster --name lapilli || true
          test/e2e/run.sh
