body:
  - type: markdown
    attributes:
      value: |
        Nothing private here: no tokens or webhook URLs, no real rule names, hostnames or incident
        titles. A rule that replays differently from how it fired is better as an issue, which has
        a form for it.
  - type: input
    id: version
    attributes:
      label: Version
      description: What `lapilli version` says, or the chart's version.
      placeholder: lapilli v0.58.0
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, what you pointed Lapilli at (Prometheus, a managed Prometheus, Grafana, Loki, a cloud's alarms), and what you ran.
    validations:
      required: true
