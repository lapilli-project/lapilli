name: An accessibility barrier
description: Something on a page of lapilli serve, or in the docs, that got in your way.
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you: a barrier one person meets is in the way of everyone who uses the same tools.
        You never need to say anything about yourself, and a screenshot is welcome but not needed.
        Nothing private here: no real rule names, hostnames or incident titles.
  - type: textarea
    id: task
    attributes:
      label: What you were trying to do
      placeholder: See which rules were noisiest last week, from the overview.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page's path, such as /rules or /incidents, or the docs page.
  - type: textarea
    id: happened
    attributes:
      label: What got in the way
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Browser and assistive technology
      description: With versions, if you know them.
      placeholder: Firefox 140, NVDA 2025.1, Windows 11
  - type: input
    id: version
    attributes:
      label: Version
      description: What `lapilli version` says, or the chart's version, if you know it.
      placeholder: lapilli v0.59.0
