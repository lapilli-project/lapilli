# cargo-deny configuration.
#
# The one thing this file exists to prevent: a C/cmake crypto stack getting linked into the
# shipped binaries by accident. `rustls` 0.23's *default* features include `aws_lc_rs`, so a
# single `rustls = { version = "0.23", features = ["ring"] }` — without
# `default-features = false` — pulls `aws-lc-sys` in alongside ring, in every crate in the
# graph, because Cargo unifies features. That happened: it was in the published
# `0.1.0-rc.1` controller image while three manifest comments said it was not. The ban below
# turns that silent regression into a failed check.
#
# Run: `cargo deny --config deny.toml check bans`
# (`check advisories` needs the advisory DB, so it is not part of the same gate; the `advisories`
# covers that in `scripts/release-check.sh`.)

[graph]
all-features = true

[bans]
multiple-versions = "allow"   # not what this file is for; the workspace has known duplicates
# "allow" only until the intra-workspace `path` dependencies carry a `version` (they must, for
# `cargo publish -p lapilli` to work at all — see the publish-readiness note in ROADMAP).
# Flip this to "deny" in the same change that adds those versions, and it becomes the check that
# keeps them.
wildcards = "allow"

[[bans.deny]]
crate = "aws-lc-sys"
reason = """
A C/cmake build (aws-lc), not wanted in the images or the release binaries. rustls and
object_store both offer `ring` instead; every rustls/reqwest/object_store dependency in this
workspace must be declared with `default-features = false` and an explicit `ring` feature.
If you need a post-quantum key exchange or FIPS later, that is a deliberate decision with a
build-time cost, so lift this ban explicitly rather than by adding a feature.
"""

[[bans.deny]]
crate = "aws-lc-rs"
reason = "The safe wrapper over the banned aws-lc-sys; same reasoning."

[[bans.deny]]
crate = "openssl-sys"
reason = """
Nothing here links OpenSSL, and the runtime image is distroless with no libssl on the load
path. Keeping it banned is what lets `docs/security-scanning.md` say the base image's libssl
CVEs are not reachable from these binaries.
"""

[[bans.deny]]
crate = "native-tls"
reason = "Would drag in the platform TLS stack (OpenSSL on Linux); rustls + ring is the only TLS here."

[licenses]
# Informational only for the `bans` gate above; kept so `cargo deny check licenses` is usable.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[advisories]
# The `advisories` job in ci.yml is the advisory gate, on every pull request, and it runs
# `cargo deny check advisories` — so THIS file is its configuration and not a bystander.
#
# Until 2026-09-30 the comment here said `scripts/release-check.sh`, which ran no such scan — only
# `cargo auditable build`, a different command with a similar name, which embeds a dependency list
# and scans nothing. The job that replaced that claim first used `rustsec/audit-check`, whose scan
# passed (343 crates, 0 advisories) while the job went red anyway: the action wants `checks: write`
# to post an annotation and this workflow grants `contents: read`. A security gate that fails for a
# permission reason teaches people to ignore it, so the gate moved to the cargo-deny action this
# repository already pins for `check bans` — no token, no elevated permission, and one fewer
# third-party action inside the gate that exists to watch the supply chain.
#
# The settings below are written out rather than inherited. A vulnerability is always an error in
# cargo-deny and needs no key; these two have defaults that have changed across releases, and a
# gate whose verdict depends on which version of the tool ran is not a gate.
yanked = "warn"
# A yank is somebody else's action on their own crate and can land at any moment, so denying it
# would turn a third party's decision into a red gate on `main` before there is anything here to
# fix. Warn, and fix the lock when it fires: that is how `yoke-derive 0.8.3` was found (yanked at
# crates.io, `0.8.4` published and not yanked) and bumped.
#
# Note for anyone reproducing this locally: cargo-deny decides yanked from *cached* index metadata,
# so a stale local index reports nothing while a fresh CI runner reports the yank. `yanked = "deny"`
# passing locally is therefore not evidence that nothing is yanked.
unmaintained = "workspace"
# "all" reports unmaintained advisories for every crate in the graph including ones nothing can be
# done about from here; "workspace" keeps it to the dependencies this workspace actually declares,
# which is the set a maintainer can act on.
