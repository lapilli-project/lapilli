# Artifact Hub repository metadata — the ownership claim.
#
# What it is for: Artifact Hub will list this chart repository whether or not this file exists, but
# without it the listing carries no publisher identity. With it, and once the repository is added on
# artifacthub.io under an organisation whose id matches `repositoryID`, the package shows a verified
# publisher. For a chart that installs a controller with cluster-wide read on pods and their logs,
# that is the difference between "some chart called lapilli" and "the chart this project publishes".
#
# Where it has to live for an OCI repository: Artifact Hub does not read it from this git tree. It is
# pushed to the registry beside the chart as its own artifact —
#
#   oras push ghcr.io/lapilli-project/charts/artifacthub.io:latest \
#     artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
#
# — so this copy is the source of truth for what gets pushed, and is here because a reader looking
# for the claim should find it in the repository rather than only in a registry.
#
# `repositoryID` is the id on the repository's settings page on artifacthub.io, set once the
# repository was added (2026-10-01).
#
# `owners` IS DELIBERATELY UNSET. It is the ownership-transfer claim and it requires a `name` and
# `email` matching an Artifact Hub **user account** exactly — which would publish an email address
# here and in the registry. `MAINTAINERS.md` publishes a GitHub handle and a private-advisory link
# and no email address; that is a choice about how this project is contacted, and this file is not
# the place to reverse it. The verified-publisher badge is what this file is for, and that follows
# from `repositoryID`; if a transfer is ever needed, whoever performs it adds their own account
# here at that moment.
repositoryID: 5075f316-a472-4ab3-8138-e434b9b83d7e
