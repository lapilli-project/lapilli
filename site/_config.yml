# lapilli.dev, built by .github/workflows/pages.yml. No theme: one layout in
# _layouts/default.html. The brand images and screenshots are copied in from
# assets/, and the font from internal/serve/static/, at deploy time, so there
# is one copy of each.
title: Lapilli
description: Which of your alerts are worth their page? Lapilli judges alert rules against what actually went wrong, once with lapilli verdict or every hour with lapilli serve.
url: https://lapilli.dev
repo: https://github.com/lapilli-project/lapilli
# version, the latest release's tag, is added by pages.yml at build time, as
# baseurl is; without it (a build by hand) the pages leave the version out.
theme: null
# jekyll-sitemap writes /sitemap.xml of every page, and /robots.txt naming it.
plugins: [jekyll-sitemap]
exclude: [README.md, docs.sh]
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
